<svg xmlns="http://www.w3.org/2000/svg" width="700" height="590" viewBox="0 0 700 590" role="img" aria-labelledby="title desc">
  <title id="title">实例属性查找、函数对象原型链与 new 的原型设置</title>
  <desc id="desc">第一部分输入属性键 format，从 service 查到 ReportService.prototype 上的共享函数并停止。第二部分显示 ReportService 函数对象沿内部原型链接经过 Function.prototype 和 Object.prototype，终止于 null。第三部分显示 new 读取对象值 ReportService.prototype，并把同一对象设为新实例 service 的内部原型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#415a77"/>
    </marker>
    <marker id="arrowNew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a05a2c"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172b4d; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #425466; }
      .box { fill: #f4f8fc; stroke: #6f87a1; stroke-width: 1.5; rx: 9; }
      .hit { fill: #e9f5ef; stroke: #498568; stroke-width: 1.8; rx: 9; }
      .lookup { stroke: #415a77; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .construction { stroke: #a05a2c; stroke-width: 2.2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrowNew); }
      .divider { stroke: #d5dee8; stroke-width: 1; }
    </style>
  </defs>
  <rect width="700" height="590" fill="#ffffff"/>

  <text x="24" y="32" class="heading">① 读取 service.format</text>
  <text x="24" y="55" class="small">输入属性键："format"。先查 service；未命中时才沿内部原型链接继续。</text>
  <rect x="24" y="86" width="260" height="78" class="box"/>
  <text x="42" y="115" class="label">service（接收者）</text>
  <text x="42" y="141" class="body">没有自有属性 format</text>
  <path d="M 284 125 H 420" class="lookup"/>
  <text x="352" y="78" class="small" text-anchor="middle">沿 [[Prototype]] 查找</text>
  <rect x="426" y="86" width="250" height="78" class="hit"/>
  <text x="444" y="115" class="label">ReportService.prototype</text>
  <text x="444" y="141" class="body">命中 format，返回共享函数</text>
  <text x="24" y="177" class="small">在这里命中便停止；若一路未找到，直到 null 才返回 undefined。</text>

  <line x1="24" y1="198" x2="676" y2="198" class="divider"/>
  <text x="24" y="229" class="heading">② 函数对象也沿自己的 [[Prototype]] 查找</text>
  <text x="24" y="251" class="small">实线沿内部 [[Prototype]] 链指向右侧下一项；末端 null 不是对象。</text>
  <text x="166" y="281" class="small" text-anchor="middle">[[Prototype]]</text>
  <text x="350" y="281" class="small" text-anchor="middle">[[Prototype]]</text>
  <text x="534" y="281" class="small" text-anchor="middle">[[Prototype]]</text>
  <rect x="24" y="292" width="126" height="66" class="box"/>
  <text x="87" y="322" class="label" text-anchor="middle">ReportService</text>
  <text x="87" y="344" class="small" text-anchor="middle">函数对象</text>
  <path d="M 150 325 H 180" class="lookup"/>
  <rect x="186" y="292" width="152" height="66" class="box"/>
  <text x="262" y="322" class="label" text-anchor="middle">Function.prototype</text>
  <text x="262" y="344" class="small" text-anchor="middle">函数共享方法</text>
  <path d="M 338 325 H 364" class="lookup"/>
  <rect x="370" y="292" width="152" height="66" class="box"/>
  <text x="446" y="322" class="label" text-anchor="middle">Object.prototype</text>
  <text x="446" y="344" class="small" text-anchor="middle">对象共享方法</text>
  <path d="M 522 325 H 548" class="lookup"/>
  <rect x="554" y="292" width="122" height="66" class="box"/>
  <text x="615" y="332" class="label" text-anchor="middle">null</text>
  <text x="615" y="379" class="small" text-anchor="middle">原型链末端</text>

  <line x1="24" y1="399" x2="676" y2="399" class="divider"/>
  <text x="24" y="430" class="heading">③ 构造时设置新实例的原型</text>
  <text x="24" y="453" class="small">条件：ReportService.prototype 的值是对象。虚线表示 new 采用该值。</text>
  <rect x="24" y="473" width="260" height="78" class="box"/>
  <text x="42" y="503" class="label">输入：ReportService.prototype</text>
  <text x="42" y="530" class="small">new 读取的构造函数属性值</text>
  <path d="M 284 512 H 416" class="construction"/>
  <text x="350" y="493" class="label" text-anchor="middle" fill="#a05a2c">new</text>
  <rect x="422" y="473" width="254" height="78" class="hit"/>
  <text x="440" y="503" class="label">输出：service.[[Prototype]]</text>
  <text x="440" y="530" class="small">与输入指向同一原型对象</text>
  <text x="24" y="575" class="small">若 prototype 值不是对象（包括 null），构造过程改用构造函数所在 Realm 的对应内建原型。</text>
</svg>
