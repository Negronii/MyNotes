<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410" role="img" aria-labelledby="title desc">
  <title id="title">直接读取与 Reflect.get 的 getter receiver</title>
  <desc id="desc">并排比较 target[property] 让 getter 的 this 指向 target，以及 Reflect.get 保留 proxy receiver、使 getter 内部 prefix 读取再次经过代理。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526176"/>
    </marker>
    <style>
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
      .head { font:700 18px sans-serif; fill:#172033; }
      .label { font:17px sans-serif; fill:#253247; }
      .small { font:17px sans-serif; fill:#536176; }
      .node { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.2; }
      .proxy { fill:#e0f2fe; stroke:#38bdf8; stroke-width:1.4; }
      .getter { fill:#fef3c7; stroke:#f59e0b; stroke-width:1.4; }
      .line { fill:none; stroke:#526176; stroke-width:1.8; marker-end:url(#arrow); }
      .return { fill:none; stroke:#64748b; stroke-width:1.6; stroke-dasharray:5 4; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="700" height="410" fill="#ffffff"/>

  <rect class="panel" x="8" y="8" width="336" height="356" rx="12"/>
  <text class="head" x="26" y="38">直接读取：target[property]</text>
  <rect class="proxy" x="30" y="60" width="292" height="46" rx="8"/>
  <text class="label" x="46" y="89">direct.label → get trap</text>
  <path class="line" d="M176 106 V134"/>
  <rect class="node" x="30" y="140" width="292" height="56" rx="8"/>
  <text class="label" x="46" y="164">target[property]</text>
  <text class="small" x="46" y="186">getter 的 this = target</text>
  <path class="line" d="M176 196 V224"/>
  <rect class="getter" x="30" y="230" width="292" height="56" rx="8"/>
  <text class="label" x="46" y="254">原型上的 label getter</text>
  <text class="small" x="46" y="276">读取 this.prefix：绕过代理</text>
  <path class="return" d="M176 286 V312"/>
  <text class="small" x="46" y="338">只记录 direct get label</text>

  <rect class="panel" x="356" y="8" width="336" height="356" rx="12"/>
  <text class="head" x="374" y="38">保留 receiver：Reflect.get</text>
  <rect class="proxy" x="378" y="60" width="292" height="46" rx="8"/>
  <text class="label" x="394" y="89">observed.label → get trap</text>
  <path class="line" d="M524 106 V134"/>
  <rect class="node" x="378" y="140" width="292" height="56" rx="8"/>
  <text class="label" x="394" y="164">Reflect.get(target, key, receiver)</text>
  <text class="small" x="394" y="186">receiver = observed</text>
  <path class="line" d="M524 196 V224"/>
  <rect class="getter" x="378" y="230" width="292" height="56" rx="8"/>
  <text class="label" x="394" y="254">原型上的 label getter</text>
  <text class="small" x="394" y="276">getter 的 this = observed</text>
  <path class="line" d="M524 286 V312"/>
  <rect class="proxy" x="394" y="316" width="260" height="38" rx="8"/>
  <text class="small" x="410" y="341">this.prefix → get trap</text>
  <text class="label" x="166" y="396">两次都返回 "Sales reports"；日志不同</text>
</svg>
