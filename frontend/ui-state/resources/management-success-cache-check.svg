<svg xmlns="http://www.w3.org/2000/svg" width="700" height="852" viewBox="0 0 700 852" role="img" aria-labelledby="title desc">
  <title id="title">成功回执的缓存版本保护</title>
  <desc id="desc">PATCH 带 If-Match "report-42-v7"，收到 200 与 ETag "report-42-v8"。先取消并等待该详情键的在途读取，再按缓存 ETag 只比较相等：缓存仍是 v7 时用回执 v8 更新缓存；缓存已是 v8 时复用，不重读；缓存是别的 ETag（如 v9）或为空时保留已知值、不让回执覆盖，并发重新验证的读取。之后只有回执的 sessionId、submitId 仍匹配，且确认的当前表示 ETag 等于回执 ETag，才从规范表示重建草稿；否则旧尝试只更新它捕获的缓存，当前尝试保留草稿进入复核，重读失败时按有无已知表示给出不同提示。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263b52"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172b3f; }
      .sub { font-size: 17px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 15px; fill: #44566a; }
      .code { font-family: Menlo, "SF Mono", Consolas, monospace; font-size: 15px; }
      .arrow { fill: none; stroke: #263b52; stroke-width: 2.2; marker-end: url(#arrow); }
      .rail { fill: none; stroke: #263b52; stroke-width: 2.2; }
    </style>
  </defs>
  <rect width="700" height="852" fill="#ffffff"/>

  <rect x="24" y="20" width="290" height="72" rx="10" fill="#ffffff" stroke="#c6d0da" stroke-width="2"/>
  <text x="169" y="48" class="sub" text-anchor="middle">PATCH 条件请求</text>
  <text x="169" y="76" class="code" text-anchor="middle">If-Match: "report-42-v7"</text>
  <path d="M314 56 H378" class="arrow"/>
  <rect x="386" y="20" width="290" height="72" rx="10" fill="#eef6f0" stroke="#4f8a62" stroke-width="2"/>
  <text x="531" y="48" class="sub" text-anchor="middle">200 成功回执</text>
  <text x="531" y="76" class="code" text-anchor="middle">ETag: "report-42-v8"</text>

  <path d="M531 92 V112 H350 V128" class="arrow"/>
  <rect x="74" y="132" width="552" height="72" rx="10" fill="#f5f7fa" stroke="#8796a8" stroke-width="2"/>
  <text x="350" y="161" class="sub" text-anchor="middle">取消并等待该详情键的在途读取，再看缓存</text>
  <text x="350" y="188" class="small" text-anchor="middle">ETag 只比较相等，不按后缀推断新旧</text>

  <path d="M350 204 V222 M118 222 H582" class="rail"/>
  <path d="M118 222 V242" class="arrow"/>
  <path d="M350 222 V242" class="arrow"/>
  <path d="M582 222 V242" class="arrow"/>

  <rect x="24" y="246" width="210" height="132" rx="10" fill="#eef6f0" stroke="#4f8a62" stroke-width="2"/>
  <text x="129" y="274" class="sub" text-anchor="middle">① 缓存仍是 v7</text>
  <text x="129" y="297" class="small" text-anchor="middle">等于本次 If-Match</text>
  <text x="129" y="330" class="body" text-anchor="middle">用回执 v8</text>
  <text x="129" y="354" class="body" text-anchor="middle">更新缓存</text>

  <rect x="245" y="246" width="210" height="132" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="350" y="274" class="sub" text-anchor="middle">② 缓存已是 v8</text>
  <text x="350" y="297" class="small" text-anchor="middle">等于回执 ETag</text>
  <text x="350" y="330" class="body" text-anchor="middle">同一版本已确认</text>
  <text x="350" y="354" class="body" text-anchor="middle">复用，不必重读</text>

  <rect x="466" y="246" width="210" height="132" rx="10" fill="#fff4e0" stroke="#c98a1b" stroke-width="2"/>
  <text x="571" y="274" class="sub" text-anchor="middle">③ 别的 ETag 或为空</text>
  <text x="571" y="297" class="small" text-anchor="middle">例如已知 v9</text>
  <text x="571" y="330" class="body" text-anchor="middle">保留已知值，不覆盖</text>
  <text x="571" y="354" class="body" text-anchor="middle">发重新验证的读取</text>

  <path d="M129 378 V398 M571 378 V398 M129 398 H571" class="rail"/>
  <path d="M350 378 V418" class="arrow"/>

  <rect x="74" y="422" width="552" height="104" rx="10" fill="#ffffff" stroke="#263b52" stroke-width="2"/>
  <text x="350" y="452" class="sub" text-anchor="middle">核对之后，当前表单能否重建？</text>
  <text x="350" y="480" class="body" text-anchor="middle">回执的 sessionId、submitId 仍匹配当前尝试，</text>
  <text x="350" y="506" class="body" text-anchor="middle">且确认的当前表示 ETag = 回执 ETag</text>

  <path d="M190 526 V572" class="arrow"/>
  <text x="202" y="555" class="sub">是</text>
  <path d="M510 526 V572" class="arrow"/>
  <text x="522" y="555" class="sub">否</text>

  <rect x="24" y="576" width="250" height="100" rx="10" fill="#eef6f0" stroke="#4f8a62" stroke-width="2"/>
  <text x="149" y="616" class="sub" text-anchor="middle">从规范表示重建草稿</text>
  <text x="149" y="644" class="small" text-anchor="middle">缓存、回执与表单一致</text>

  <rect x="290" y="576" width="386" height="256" rx="10" fill="#f5f7fa" stroke="#8796a8" stroke-width="2"/>
  <text x="310" y="606" class="sub">旧尝试的回执</text>
  <text x="310" y="630" class="small">只更新它捕获的账户/报表缓存，不动当前表单</text>
  <text x="310" y="666" class="sub">当前表示是别的版本</text>
  <text x="310" y="690" class="small">保留草稿，进入复核</text>
  <text x="310" y="726" class="sub">没有已知表示，重读失败</text>
  <text x="310" y="750" class="small">提示“写入已确认，当前版本无法重读”</text>
  <text x="310" y="786" class="sub">已知不同版本，重读失败</text>
  <text x="310" y="810" class="small">保留草稿，标明已知版本只是最后观测值</text>
</svg>
