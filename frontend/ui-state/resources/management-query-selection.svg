<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580" viewBox="0 0 700 580" role="img" aria-labelledby="title desc">
  <title id="title">列表查询到当前行</title>
  <desc id="desc">已提交 URL 中的 sort=recent、status=published、page=1 与账户 acct-a 合成列表查询键 ["reports", "acct-a", "list", { sort, status, page }]；GET 第 1 页的响应写进这个键的缓存，行为 17、42；表格按 report.id 渲染，React key 不用页内下标。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263b52"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172b3f; }
      .sub { font-size: 17px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 15px; fill: #44566a; }
      .code { font-family: Menlo, "SF Mono", Consolas, monospace; font-size: 15px; }
      .arrow { fill: none; stroke: #263b52; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="700" height="580" fill="#ffffff"/>

  <rect x="24" y="20" width="400" height="76" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="224" y="49" class="sub" text-anchor="middle">已提交 URL</text>
  <text x="224" y="77" class="code" text-anchor="middle">sort=recent&amp;status=published&amp;page=1</text>
  <rect x="444" y="20" width="232" height="76" rx="10" fill="#fff4e0" stroke="#c98a1b" stroke-width="2"/>
  <text x="560" y="49" class="sub" text-anchor="middle">当前账户</text>
  <text x="560" y="77" class="code" text-anchor="middle">accountId = "acct-a"</text>

  <path d="M224 96 V118 H330 V138" class="arrow"/>
  <path d="M560 96 V118 H370 V138" class="arrow"/>

  <rect x="74" y="142" width="552" height="98" rx="10" fill="#f4f1fb" stroke="#7e61b3" stroke-width="2"/>
  <text x="350" y="170" class="sub" text-anchor="middle">列表查询键</text>
  <text x="350" y="197" class="code" text-anchor="middle">["reports", "acct-a", "list",</text>
  <text x="350" y="221" class="code" text-anchor="middle">{ sort: "recent", status: "published", page: 1 }]</text>

  <path d="M350 240 V280" class="arrow"/>
  <text x="362" y="266" class="small">GET 第 1 页，响应只写这个键</text>

  <rect x="174" y="284" width="352" height="78" rx="10" fill="#eef6f0" stroke="#4f8a62" stroke-width="2"/>
  <text x="350" y="314" class="sub" text-anchor="middle">该键的缓存</text>
  <text x="350" y="342" class="body" text-anchor="middle">当前页的行：17、42</text>

  <path d="M350 362 V402" class="arrow"/>

  <rect x="124" y="406" width="452" height="150" rx="10" fill="#ffffff" stroke="#c6d0da" stroke-width="2"/>
  <text x="350" y="436" class="sub" text-anchor="middle">表格按 report.id 渲染行</text>
  <rect x="164" y="452" width="372" height="30" rx="6" fill="#f5f7fa" stroke="#d7e0e8"/>
  <text x="180" y="473" class="code">key="17"</text>
  <text x="300" y="473" class="body">报表 17</text>
  <rect x="164" y="488" width="372" height="30" rx="6" fill="#f5f7fa" stroke="#d7e0e8"/>
  <text x="180" y="509" class="code">key="42"</text>
  <text x="300" y="509" class="body">报表 42</text>
  <text x="350" y="541" class="small" text-anchor="middle">React key 用 report.id，不用页内下标</text>
</svg>
