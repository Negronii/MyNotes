<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">报表行查询键的层级与前缀</title>
  <desc id="desc">查询键 [&quot;reports&quot;, 账户, &quot;42&quot;, &quot;rows&quot;, 排序] 按段组成一棵树。acct-a 下 recent 格存 May、April，oldest 格存 April、May，当前键是 oldest 格。前缀 [&quot;reports&quot;,&quot;acct-a&quot;,&quot;42&quot;,&quot;rows&quot;] 选中该报表的全部排序，用于失效；前缀 [&quot;reports&quot;,&quot;acct-a&quot;] 选中整个账户子树，用于退出登录时移除。acct-b 下没有缓存，不能借用 acct-a 的行。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263b52"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b03a3a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172b3f; }
      .head { font-size: 19px; font-weight: 700; }
      .sub { font-size: 17px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 15px; fill: #44566a; }
      .code { font-family: Menlo, "SF Mono", Consolas, monospace; font-size: 15px; }
      .red { fill: #9e2f2f; }
      .arrow { fill: none; stroke: #263b52; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-red { fill: none; stroke: #b03a3a; stroke-width: 2.2; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect x="6" y="6" width="748" height="508" rx="18" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
  <text x="380.0" y="40" class="head" text-anchor="middle">每个完整查询键对应一格；前缀选中一棵子树</text>
  <rect x="136" y="64" width="608" height="252" rx="14" fill="#faf8ff" stroke="#7a64b0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="150" y="88" class="sub" style="fill:#5b4790">① 移除前缀</text>
  <rect x="344" y="98" width="392" height="206" rx="12" fill="#fffaf0" stroke="#bf8627" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="356" y="122" class="sub" style="fill:#8a5d12">② 失效前缀</text>
  <rect x="22" y="230" width="98" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="71.0" y="256" class="code" text-anchor="middle">&quot;reports&quot;</text>
  <rect x="150" y="170" width="92" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="196.0" y="196" class="code" text-anchor="middle">&quot;acct-a&quot;</text>
  <rect x="258" y="170" width="62" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="289.0" y="196" class="code" text-anchor="middle">&quot;42&quot;</text>
  <rect x="356" y="170" width="72" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="392.0" y="196" class="code" text-anchor="middle">&quot;rows&quot;</text>
  <rect x="452" y="140" width="90" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="497.0" y="166" class="code" text-anchor="middle">&quot;recent&quot;</text>
  <rect x="452" y="222" width="90" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="497.0" y="248" class="code" text-anchor="middle">&quot;oldest&quot;</text>
  <path d="M120 250 C135.0 250 135.0 190 150 190" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M242 190 C250.0 190 250.0 190 258 190" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M320 190 C338.0 190 338.0 190 356 190" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M428 190 C440.0 190 440.0 160 452 160" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M428 190 C440.0 190 440.0 242 452 242" fill="none" stroke="#6d879f" stroke-width="2"/>
  <rect x="566" y="134" width="160" height="52" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="646" y="166" class="sub" text-anchor="middle">May、April</text>
  <rect x="566" y="216" width="160" height="52" rx="10" fill="#fff4df" stroke="#bf8627" stroke-width="3"/>
  <text x="646" y="248" class="sub" text-anchor="middle">April、May</text>
  <line x1="542" y1="160" x2="566" y2="160" stroke="#6d879f" stroke-width="2"/>
  <line x1="542" y1="242" x2="566" y2="242" stroke="#6d879f" stroke-width="2"/>
  <text x="634" y="290" class="small" text-anchor="middle">▲ 切到 oldest 后的当前键</text>
  <rect x="150" y="350" width="92" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="196.0" y="376" class="code" text-anchor="middle">&quot;acct-b&quot;</text>
  <rect x="258" y="350" width="62" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="289.0" y="376" class="code" text-anchor="middle">&quot;42&quot;</text>
  <rect x="356" y="350" width="72" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="392.0" y="376" class="code" text-anchor="middle">&quot;rows&quot;</text>
  <rect x="452" y="350" width="90" height="40" rx="8" fill="#f2f6fb" stroke="#6d879f" stroke-width="2"/>
  <text x="497.0" y="376" class="code" text-anchor="middle">sort</text>
  <path d="M120 250 C135.0 250 135.0 370 150 370" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M242 370 C250.0 370 250.0 370 258 370" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M320 370 C338.0 370 338.0 370 356 370" fill="none" stroke="#6d879f" stroke-width="2"/>
  <path d="M428 370 C440.0 370 440.0 370 452 370" fill="none" stroke="#6d879f" stroke-width="2"/>
  <rect x="566" y="344" width="160" height="52" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="646" y="367" class="sub" text-anchor="middle">无缓存</text>
  <text x="646" y="388" class="small" text-anchor="middle">等待或空状态</text>
  <text x="24" y="438" class="sub" style="fill:#5b4790">①</text>
  <text x="48" y="438" class="code">[&quot;reports&quot;, &quot;acct-a&quot;]</text>
  <text x="250" y="438" class="body">退出登录时整体移除这个账户的所有格</text>
  <text x="24" y="470" class="sub" style="fill:#8a5d12">②</text>
  <text x="48" y="470" class="code">[&quot;reports&quot;, &quot;acct-a&quot;, &quot;42&quot;, &quot;rows&quot;]</text>
  <text x="384" y="470" class="body">一次失效该报表的全部排序</text>
  <text x="24" y="500" class="small">键里没有 #summary：fragment 不改变 queryFn 的结果。</text>
</svg>
