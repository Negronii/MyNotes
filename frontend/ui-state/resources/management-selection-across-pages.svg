<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img" aria-labelledby="title desc">
  <title id="title">同一筛选范围内的跨页选择</title>
  <desc id="desc">选择范围是账户 acct-a 与 status=published。第 1 页的列表键显示 17、42，用户点选 42，派发 reportToggled("42")；翻到第 2 页只换列表键，显示 61。Redux 的 reportSelection.selectedIds 仍是 ["42"]，工具栏仍显示已选 1 项。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263b52"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172b3f; }
      .sub { font-size: 17px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 15px; fill: #44566a; }
      .scope { font-size: 16px; font-weight: 600; fill: #5b3f91; }
      .code { font-family: Menlo, "SF Mono", Consolas, monospace; font-size: 15px; }
      .arrow { fill: none; stroke: #263b52; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="700" height="430" fill="#ffffff"/>

  <rect x="16" y="14" width="668" height="246" rx="14" fill="#faf8fe" stroke="#7e61b3" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="36" y="42" class="scope">选择范围：acct-a · status=published</text>

  <rect x="40" y="60" width="260" height="180" rx="10" fill="#ffffff" stroke="#4c78a8" stroke-width="2"/>
  <text x="170" y="88" class="sub" text-anchor="middle">第 1 页</text>
  <text x="170" y="112" class="code" text-anchor="middle">page=1 的列表键</text>
  <rect x="64" y="126" width="212" height="34" rx="6" fill="#f5f7fa" stroke="#d7e0e8"/>
  <rect x="76" y="135" width="16" height="16" rx="3" fill="#ffffff" stroke="#8796a8" stroke-width="1.5"/>
  <text x="104" y="149" class="body">报表 17</text>
  <rect x="64" y="168" width="212" height="34" rx="6" fill="#eaf2fb" stroke="#4c78a8" stroke-width="1.5"/>
  <rect x="76" y="177" width="16" height="16" rx="3" fill="#4c78a8"/>
  <path d="M79.5 185 L83 189 L89 181" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="104" y="191" class="body">报表 42</text>
  <text x="170" y="226" class="small" text-anchor="middle">用户点选 42</text>

  <path d="M300 150 H392" class="arrow"/>
  <text x="346" y="138" class="small" text-anchor="middle">翻页</text>

  <rect x="400" y="60" width="260" height="180" rx="10" fill="#ffffff" stroke="#4c78a8" stroke-width="2"/>
  <text x="530" y="88" class="sub" text-anchor="middle">第 2 页</text>
  <text x="530" y="112" class="code" text-anchor="middle">page=2 的列表键</text>
  <rect x="424" y="126" width="212" height="34" rx="6" fill="#f5f7fa" stroke="#d7e0e8"/>
  <rect x="436" y="135" width="16" height="16" rx="3" fill="#ffffff" stroke="#8796a8" stroke-width="1.5"/>
  <text x="464" y="149" class="body">报表 61</text>
  <text x="530" y="226" class="small" text-anchor="middle">只换列表键，42 不在这一页</text>

  <path d="M170 240 V316" class="arrow"/>
  <text x="182" y="290" class="code">reportToggled("42")</text>
  <path d="M530 320 V244" class="arrow"/>
  <text x="542" y="290" class="small">工具栏读取同一选择</text>

  <rect x="40" y="320" width="620" height="92" rx="10" fill="#eef6f0" stroke="#4f8a62" stroke-width="2"/>
  <text x="350" y="350" class="sub" text-anchor="middle">Redux 选择不随页面变化</text>
  <text x="350" y="376" class="code" text-anchor="middle">reportSelection.selectedIds = ["42"]</text>
  <text x="350" y="400" class="small" text-anchor="middle">第 2 页工具栏仍显示“已选 1 项”</text>
</svg>
