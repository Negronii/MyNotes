<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1038" viewBox="0 0 760 1038" role="img" aria-labelledby="title desc">
  <title id="title">React Router 排序导航中三个读取口的变化次序</title>
  <desc id="desc">三条泳道从上到下随时间变化：地址栏与历史、已提交的 useLoaderData 与屏幕、待定的 useNavigation。PUSH 时 useNavigation 先指向 oldest，loader 成功后地址与已提交数据一起变为 oldest；POP 时浏览器先把地址改回 recent，useNavigation 指向 recent，已提交数据仍是 oldest，loader 成功后才提交 recent。另一分支中 oldest loader 失败，地址仍提交 oldest，屏幕显示路由 ErrorBoundary。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#263b52"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b03a3a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172b3f; }
      .head { font-size: 19px; font-weight: 700; }
      .sub { font-size: 17px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 15px; fill: #44566a; }
      .code { font-family: Menlo, "SF Mono", Consolas, monospace; font-size: 15px; }
      .red { fill: #9e2f2f; }
      .arrow { fill: none; stroke: #263b52; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-red { fill: none; stroke: #b03a3a; stroke-width: 2.2; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect x="6" y="6" width="748" height="1026" rx="18" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
  <text x="380.0" y="42" class="head" text-anchor="middle">同一次排序导航中，三个读取口谁先变</text>
  <rect x="24" y="62" width="232" height="54" rx="12" fill="#ffffff" stroke="#c6d0da" stroke-width="2"/>
  <text x="140.0" y="95" class="sub" text-anchor="middle">地址栏与历史</text>
  <rect x="264" y="62" width="232" height="54" rx="12" fill="#ffffff" stroke="#c6d0da" stroke-width="2"/>
  <text x="380.0" y="84" class="sub" text-anchor="middle">已提交</text>
  <text x="380.0" y="106" class="body" text-anchor="middle">useLoaderData() 与屏幕</text>
  <rect x="504" y="62" width="232" height="54" rx="12" fill="#ffffff" stroke="#c6d0da" stroke-width="2"/>
  <text x="620.0" y="84" class="sub" text-anchor="middle">待定</text>
  <text x="620.0" y="106" class="body" text-anchor="middle">useNavigation()</text>
  <rect x="24" y="128" width="712" height="36" rx="8" fill="#e9edf2" stroke="#e9edf2" stroke-width="0"/>
  <text x="38" y="152" class="sub">① 直接打开 /reports/42?sort=recent#summary，首次 loader 等待</text>
  <rect x="24" y="170" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="140.0" y="196" class="sub" text-anchor="middle">recent</text>
  <text x="140.0" y="219" class="small" text-anchor="middle">初始文档的历史项</text>
  <rect x="264" y="170" width="232" height="62" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="380.0" y="196" class="sub" text-anchor="middle">尚无 loader 数据</text>
  <text x="380.0" y="219" class="small" text-anchor="middle">显示 HydrateFallback</text>
  <rect x="504" y="170" width="232" height="62" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="620.0" y="196" class="sub" text-anchor="middle">idle</text>
  <text x="620.0" y="219" class="small" text-anchor="middle">不反映首次读取</text>
  <rect x="24" y="244" width="712" height="36" rx="8" fill="#e9edf2" stroke="#e9edf2" stroke-width="0"/>
  <text x="38" y="268" class="sub">② 首次 loader 成功，提交</text>
  <rect x="24" y="286" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="140.0" y="323" class="sub" text-anchor="middle">recent</text>
  <rect x="264" y="286" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="380.0" y="312" class="sub" text-anchor="middle">recent</text>
  <text x="380.0" y="335" class="small" text-anchor="middle">May → April</text>
  <rect x="504" y="286" width="232" height="62" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="620.0" y="323" class="sub" text-anchor="middle">idle</text>
  <rect x="24" y="360" width="712" height="36" rx="8" fill="#e9edf2" stroke="#e9edf2" stroke-width="0"/>
  <text x="38" y="384" class="sub">③ 点“最早优先”（PUSH）：路由器先运行 oldest loader</text>
  <rect x="24" y="402" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="140.0" y="428" class="sub" text-anchor="middle">仍为 recent</text>
  <text x="140.0" y="451" class="small" text-anchor="middle">新历史项尚未写入</text>
  <rect x="264" y="402" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="380.0" y="428" class="sub" text-anchor="middle">仍为 recent：May → April</text>
  <text x="380.0" y="451" class="small" text-anchor="middle">提示“正在切换…”</text>
  <rect x="504" y="402" width="232" height="62" rx="10" fill="#fff4df" stroke="#bf8627" stroke-width="2"/>
  <text x="620.0" y="428" class="sub" text-anchor="middle">loading</text>
  <text x="620.0" y="451" class="small" text-anchor="middle">location 为 oldest</text>
  <rect x="24" y="476" width="712" height="36" rx="8" fill="#e9edf2" stroke="#e9edf2" stroke-width="0"/>
  <text x="38" y="500" class="sub">④ oldest loader 成功：路由器调用 pushState 并提交</text>
  <rect x="24" y="518" width="232" height="62" rx="10" fill="#fff4df" stroke="#bf8627" stroke-width="2"/>
  <text x="140.0" y="544" class="sub" text-anchor="middle">oldest</text>
  <text x="140.0" y="567" class="small" text-anchor="middle">新增历史项</text>
  <rect x="264" y="518" width="232" height="62" rx="10" fill="#fff4df" stroke="#bf8627" stroke-width="2"/>
  <text x="380.0" y="544" class="sub" text-anchor="middle">oldest</text>
  <text x="380.0" y="567" class="small" text-anchor="middle">April → May</text>
  <rect x="504" y="518" width="232" height="62" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="620.0" y="555" class="sub" text-anchor="middle">idle</text>
  <rect x="24" y="592" width="712" height="36" rx="8" fill="#e9edf2" stroke="#e9edf2" stroke-width="0"/>
  <text x="38" y="616" class="sub">⑤ 按 Back（POP）：浏览器先改地址并派发 popstate，路由器再运行 loader</text>
  <rect x="24" y="634" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="140.0" y="660" class="sub" text-anchor="middle">recent</text>
  <text x="140.0" y="683" class="small" text-anchor="middle">已回到旧历史项</text>
  <rect x="264" y="634" width="232" height="62" rx="10" fill="#fff4df" stroke="#bf8627" stroke-width="2"/>
  <text x="380.0" y="660" class="sub" text-anchor="middle">仍为 oldest：April → May</text>
  <text x="380.0" y="683" class="small" text-anchor="middle">提示“正在加载…”</text>
  <rect x="504" y="634" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="620.0" y="660" class="sub" text-anchor="middle">loading</text>
  <text x="620.0" y="683" class="small" text-anchor="middle">location 为 recent</text>
  <rect x="24" y="708" width="712" height="36" rx="8" fill="#e9edf2" stroke="#e9edf2" stroke-width="0"/>
  <text x="38" y="732" class="sub">⑥ recent loader 成功，提交（按旧 URL 重新读取）</text>
  <rect x="24" y="750" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="140.0" y="787" class="sub" text-anchor="middle">recent</text>
  <rect x="264" y="750" width="232" height="62" rx="10" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="380.0" y="776" class="sub" text-anchor="middle">recent</text>
  <text x="380.0" y="799" class="small" text-anchor="middle">May → April</text>
  <rect x="504" y="750" width="232" height="62" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="620.0" y="787" class="sub" text-anchor="middle">idle</text>
  <rect x="16" y="822" width="728" height="134" rx="14" fill="#ffffff" stroke="#b85c5c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="38" y="850" class="sub">另一分支：④ 处 oldest loader 失败</text>
  <rect x="24" y="868" width="232" height="62" rx="10" fill="#fff4df" stroke="#bf8627" stroke-width="2"/>
  <text x="140.0" y="894" class="sub" text-anchor="middle">oldest</text>
  <text x="140.0" y="917" class="small" text-anchor="middle">地址和历史项仍提交</text>
  <rect x="264" y="868" width="232" height="62" rx="10" fill="#fbebeb" stroke="#b85c5c" stroke-width="2"/>
  <text x="380.0" y="894" class="sub" text-anchor="middle">路由 ErrorBoundary</text>
  <text x="380.0" y="917" class="small" text-anchor="middle">替换列表</text>
  <rect x="504" y="868" width="232" height="62" rx="10" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="620.0" y="905" class="sub" text-anchor="middle">idle</text>
  <rect x="24" y="973" width="22" height="18" rx="4" fill="#eaf2fb" stroke="#4c78a8" stroke-width="2"/>
  <text x="54" y="988" class="small">sort=recent</text>
  <rect x="183" y="973" width="22" height="18" rx="4" fill="#fff4df" stroke="#bf8627" stroke-width="2"/>
  <text x="213" y="988" class="small">sort=oldest</text>
  <rect x="342" y="973" width="22" height="18" rx="4" fill="#f1f3f5" stroke="#8a97a5" stroke-width="2"/>
  <text x="372" y="988" class="small">无数据或 idle</text>
  <rect x="511" y="973" width="22" height="18" rx="4" fill="#fbebeb" stroke="#b85c5c" stroke-width="2"/>
  <text x="541" y="988" class="small">错误</text>
  <text x="24" y="1016" class="small">path 始终是 /reports/42，fragment 始终是 #summary；⑤ 发生在 ④ 成功之后。</text>
</svg>
