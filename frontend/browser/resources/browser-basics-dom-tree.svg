<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">报表示例的 DOM 父子树</title>
  <desc id="desc">main 直接包含 h1、img、排序控制 div 和 ol。按钮及列表项分别位于自己的父节点之下。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18283d; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 27px; }
    .small { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 23px; }
    .leaf { font-size: 25px; }
    .edge { fill: none; stroke: #53677e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .node { fill: #f2f6fa; stroke: #607990; stroke-width: 3; }
    .textnode { fill: #fff8e8; stroke: #b68b39; stroke-width: 3; }
  </style>
  <rect x="8" y="8" width="1484" height="634" rx="22" fill="#fff" stroke="#d7e0e8" stroke-width="2"/>

  <!-- main's four direct-child branches -->
  <path class="edge" d="M750 108 V140 H150 V170 M750 140 H480 V170 M750 140 H800 V170 M750 140 H1300 V170"/>
  <!-- h1 -> text -->
  <path class="edge" d="M150 238 V280"/>
  <!-- div -> its two button children -->
  <path class="edge" d="M800 238 V258 H660 V280 M800 258 H940 V280"/>
  <!-- recent button -> span -> text -->
  <path class="edge" d="M660 342 V390 M660 450 V490"/>
  <!-- oldest button -> svg and span; span -> text -->
  <path class="edge" d="M940 342 V365 H860 V390 M940 365 H1010 V390 M1010 450 V490"/>
  <!-- ol -> its two li children; each li -> text -->
  <path class="edge" d="M1300 238 V258 H1195 V280 M1300 258 H1380 V280 M1195 342 V390 M1380 342 V390"/>

  <rect class="node" x="625" y="38" width="250" height="70" rx="14"/>
  <text class="tag" x="750" y="82" text-anchor="middle">&lt;main&gt;</text>

  <rect class="node" x="40" y="170" width="220" height="68" rx="12"/>
  <text class="tag" x="150" y="213" text-anchor="middle">h1#summary</text>
  <rect class="textnode" x="35" y="280" width="230" height="66" rx="12"/>
  <text class="leaf" x="150" y="321" text-anchor="middle">“Recent reports”</text>

  <rect class="node" x="355" y="170" width="250" height="68" rx="12"/>
  <text class="tag" x="480" y="213" text-anchor="middle">&lt;img&gt;</text>

  <rect class="node" x="650" y="170" width="300" height="68" rx="12"/>
  <text class="tag" x="800" y="213" text-anchor="middle">div#sort-controls</text>
  <rect class="node" x="550" y="280" width="220" height="62" rx="12"/>
  <text class="small" x="660" y="319" text-anchor="middle">button · recent</text>
  <rect class="node" x="830" y="280" width="220" height="62" rx="12"/>
  <text class="small" x="940" y="319" text-anchor="middle">button · oldest</text>
  <rect class="node" x="570" y="390" width="180" height="60" rx="12"/>
  <text class="small" x="660" y="428" text-anchor="middle">&lt;span&gt;</text>
  <rect class="textnode" x="560" y="490" width="200" height="62" rx="12"/>
  <text class="small" x="660" y="529" text-anchor="middle">Most recent</text>
  <rect class="node" x="810" y="390" width="100" height="60" rx="12"/>
  <text class="small" x="860" y="428" text-anchor="middle">&lt;svg&gt;</text>
  <rect class="node" x="930" y="390" width="160" height="60" rx="12"/>
  <text class="small" x="1010" y="428" text-anchor="middle">&lt;span&gt;</text>
  <rect class="textnode" x="920" y="490" width="180" height="62" rx="12"/>
  <text class="small" x="1010" y="529" text-anchor="middle">Oldest first</text>

  <rect class="node" x="1180" y="170" width="240" height="68" rx="12"/>
  <text class="tag" x="1300" y="213" text-anchor="middle">ol#reports</text>
  <rect class="node" x="1110" y="280" width="170" height="62" rx="12"/>
  <text class="small" x="1195" y="319" text-anchor="middle">li · may</text>
  <rect class="node" x="1295" y="280" width="170" height="62" rx="12"/>
  <text class="small" x="1380" y="319" text-anchor="middle">li · april</text>
  <rect class="textnode" x="1105" y="390" width="180" height="62" rx="12"/>
  <text class="small" x="1195" y="429" text-anchor="middle">May report</text>
  <rect class="textnode" x="1290" y="390" width="180" height="62" rx="12"/>
  <text class="small" x="1380" y="429" text-anchor="middle">April report</text>
</svg>
