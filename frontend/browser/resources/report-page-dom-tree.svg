<svg xmlns="http://www.w3.org/2000/svg" width="640" height="832" viewBox="0 0 640 832" role="img" aria-labelledby="title desc">
  <title id="title">报表示例的 DOM 父子树</title>
  <desc id="desc">缩进树：main 直接包含 h1#summary、img、div#sort-controls 和 ol#reports 四个子元素。两个按钮位于 div 之下，Oldest first 按钮包含 svg（内有 path）和 span；ol 下两个 li 分别是 r-104 与 r-103，各含 May report、April report 文本。省略空白文本节点。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; fill: #18283d; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; }
    .muted { font-size: 15px; fill: #52657b; }
    .edge { fill: none; stroke: #8193a6; stroke-width: 2; }
    .node { fill: #f2f6fa; stroke: #607990; stroke-width: 2; }
    .textnode { fill: #fff8e8; stroke: #b68b39; stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="638" height="830" rx="14" fill="#fff" stroke="#d7e0e8" stroke-width="2"/>
  <rect class="node" x="36" y="26" width="34" height="22" rx="5"/><text x="80" y="43">元素节点</text>
  <rect class="textnode" x="180" y="26" width="34" height="22" rx="5"/><text x="224" y="43">文本节点</text>
  <text class="muted" x="330" y="43">省略标签间的空白文本节点</text>
  <path class="edge" d="M54 122 V147.0 H82 M100 162 V187.0 H128 M54 122 V227.0 H82 M54 122 V267.0 H82 M100 282 V307.0 H128 M146 322 V347.0 H174 M192 362 V387.0 H220 M100 282 V427.0 H128 M146 442 V467.0 H174 M192 482 V507.0 H220 M146 442 V547.0 H174 M192 562 V587.0 H220 M54 122 V627.0 H82 M100 642 V667.0 H128 M146 682 V707.0 H174 M100 642 V747.0 H128 M146 762 V787.0 H174"/>
  <rect class="node" x="36" y="92" width="70" height="30" rx="7"/>
  <text class="tag" x="49" y="113">main</text>
  <rect class="node" x="82" y="132" width="135" height="30" rx="7"/>
  <text class="tag" x="95" y="153">h1#summary</text>
  <rect class="textnode" x="128" y="172" width="184" height="30" rx="7"/>
  <text x="143" y="193">“Recent reports”</text>
  <rect class="node" x="82" y="212" width="59" height="30" rx="7"/>
  <text class="tag" x="95" y="233">img</text>
  <rect class="node" x="82" y="252" width="211" height="30" rx="7"/>
  <text class="tag" x="95" y="273">div#sort-controls</text>
  <rect class="node" x="128" y="292" width="288" height="30" rx="7"/>
  <text class="tag" x="141" y="313">button[data-sort=recent]</text>
  <rect class="node" x="174" y="332" width="70" height="30" rx="7"/>
  <text class="tag" x="187" y="353">span</text>
  <rect class="textnode" x="220" y="372" width="155" height="30" rx="7"/>
  <text x="235" y="393">“Most recent”</text>
  <rect class="node" x="128" y="412" width="288" height="30" rx="7"/>
  <text class="tag" x="141" y="433">button[data-sort=oldest]</text>
  <rect class="node" x="174" y="452" width="59" height="30" rx="7"/>
  <text class="tag" x="187" y="473">svg</text>
  <rect class="node" x="220" y="492" width="70" height="30" rx="7"/>
  <text class="tag" x="233" y="513">path</text>
  <rect class="node" x="174" y="532" width="70" height="30" rx="7"/>
  <text class="tag" x="187" y="553">span</text>
  <rect class="textnode" x="220" y="572" width="164" height="30" rx="7"/>
  <text x="235" y="593">“Oldest first”</text>
  <rect class="node" x="82" y="612" width="135" height="30" rx="7"/>
  <text class="tag" x="95" y="633">ol#reports</text>
  <rect class="node" x="128" y="652" width="211" height="30" rx="7"/>
  <text class="tag" x="141" y="673">li[data-id=r-104]</text>
  <rect class="textnode" x="174" y="692" width="145" height="30" rx="7"/>
  <text x="189" y="713">“May report”</text>
  <rect class="node" x="128" y="732" width="211" height="30" rx="7"/>
  <text class="tag" x="141" y="753">li[data-id=r-103]</text>
  <rect class="textnode" x="174" y="772" width="164" height="30" rx="7"/>
  <text x="189" y="793">“April report”</text>
</svg>
