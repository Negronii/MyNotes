<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">静态发布切换后两个版本页面的异步请求</title>
  <desc id="desc">左侧：切换后仍打开的 v41 页面继续运行 v41 入口 index-gRN8M4PG.js，它写着 editor-x2UHusWa.js；首次打开编辑抽屉时请求这个旧 URL，旧文件保留时返回 200，删除时返回 404、动态导入失败。右侧：取得 v42 HTML 的新标签运行 index-ClYpL0PO.js，首次打开时请求 editor-BLsXx8VX.js，返回 200。本例首次请求前没有可用的 editor 副本；静态服务对缺失的 v41 文件返回 404。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172033; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .old { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .new { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .ok { fill: #effaf3; stroke: #2f855a; stroke-width: 2; }
      .bad { fill: #fdeeee; stroke: #b83a3a; stroke-width: 2; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .rail { fill: none; stroke: #475569; stroke-width: 2.2; }
      .heading { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .title { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 15px; text-anchor: middle; fill: #475569; }
      .code { font-family: Menlo, "SF Mono", Consolas, monospace; font-size: 14px; text-anchor: middle; fill: #334155; }
      .label { font-size: 15px; fill: #334155; }
      .note { font-size: 15px; text-anchor: middle; fill: #475569; }
    </style>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>

  <rect class="panel" x="20" y="16" width="350" height="458" rx="16"/>
  <rect class="panel" x="390" y="16" width="350" height="458" rx="16"/>
  <text class="heading" x="195" y="48">切换后仍打开的旧标签</text>
  <text class="heading" x="565" y="48">取得 v42 HTML 的新标签</text>

  <rect class="old" x="48" y="66" width="294" height="54" rx="10"/>
  <text class="title" x="195" y="99">v41 页面仍在运行</text>
  <rect class="new" x="418" y="66" width="294" height="54" rx="10"/>
  <text class="title" x="565" y="99">页面从 v42 HTML 启动</text>

  <path class="edge" d="M195 120 V144"/>
  <path class="edge" d="M565 120 V144"/>

  <rect class="old" x="48" y="148" width="294" height="76" rx="10"/>
  <text class="title" x="195" y="174">v41 入口</text>
  <text class="code" x="195" y="196">index-gRN8M4PG.js</text>
  <text class="sub" x="195" y="215">写着 editor-x2UHusWa.js</text>
  <rect class="new" x="418" y="148" width="294" height="76" rx="10"/>
  <text class="title" x="565" y="174">v42 入口</text>
  <text class="code" x="565" y="196">index-ClYpL0PO.js</text>
  <text class="sub" x="565" y="215">写着 editor-BLsXx8VX.js</text>

  <path class="edge" d="M195 224 V264"/>
  <text class="label" x="207" y="249">首次打开编辑抽屉</text>
  <path class="edge" d="M565 224 V264"/>
  <text class="label" x="577" y="249">首次打开编辑抽屉</text>

  <rect class="old" x="48" y="268" width="294" height="64" rx="10"/>
  <text class="title" x="195" y="294">请求旧 editor chunk</text>
  <text class="code" x="195" y="317">editor-x2UHusWa.js</text>
  <rect class="new" x="418" y="268" width="294" height="64" rx="10"/>
  <text class="title" x="565" y="294">请求新 editor chunk</text>
  <text class="code" x="565" y="317">editor-BLsXx8VX.js</text>

  <path class="rail" d="M195 332 V346 H113 M195 346 H277"/>
  <path class="edge" d="M113 346 V384"/>
  <path class="edge" d="M277 346 V384"/>
  <text class="label" x="121" y="372">保留</text>
  <text class="label" x="285" y="372">已删</text>
  <path class="edge" d="M565 332 V384"/>

  <rect class="ok" x="40" y="388" width="146" height="70" rx="10"/>
  <text class="title" x="113" y="417">200</text>
  <text class="sub" x="113" y="440">可加载</text>
  <rect class="bad" x="204" y="388" width="146" height="70" rx="10"/>
  <text class="title" x="277" y="417">404</text>
  <text class="sub" x="277" y="440">动态导入失败</text>
  <rect class="ok" x="418" y="388" width="294" height="70" rx="10"/>
  <text class="title" x="565" y="417">200</text>
  <text class="sub" x="565" y="440">可加载</text>

  <text class="note" x="380" y="502">本例：首次请求前无可用 editor 副本；静态服务对缺失的 v41 文件返回 404</text>
</svg>
