<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">getBoundingClientRect 的 left 是布局视口坐标，不是宽度</title>
  <desc id="desc">布局视口坐标原点为左上角。一个 100 乘 40 CSS 像素内容盒、2 像素边框的元素以 left 100、top 100 定位，边框盒为 104 乘 44。以左上为 transform 原点，平移 20、12 并放大 1.5 倍后，返回矩形 left 120、top 112、width 156、height 66。图中水平量线从布局视口 x=0 到边框矩形左缘，长度对应 rect.left=120 CSS 像素。</desc>
  <defs>
    <marker id="axisArrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#647d9d"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", sans-serif; fill: #24344d; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #536783; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
      .viewport { fill: #ffffff; stroke: #bfcddd; stroke-width: 2; }
      .layout { fill: none; stroke: #8da1bb; stroke-width: 2; stroke-dasharray: 8 6; }
      .rect { fill: #eee8fa; fill-opacity: 0.75; stroke: #8b73bd; stroke-width: 3; }
      .axis { stroke: #647d9d; stroke-width: 2; }
      .measure { stroke: #7b68a8; stroke-width: 2; }
      .left { text-anchor: start; }
    </style>
  </defs>
  <rect width="700" height="420" fill="#f7f9fc"/>
  <text class="heading left" x="30" y="30">布局边框盒经 transform 后，rect 描述布局视口中的矩形</text>
  <rect class="viewport" x="40" y="48" width="620" height="264" rx="8"/>
  <text class="small left" x="54" y="72">布局视口局部坐标：CSS px；(0, 0) 在左上角</text>

  <line class="axis" x1="40" y1="48" x2="112" y2="48" marker-end="url(#axisArrow)"/>
  <line class="axis" x1="40" y1="48" x2="40" y2="105" marker-end="url(#axisArrow)"/>
  <text class="small left" x="117" y="54">x 向右</text>
  <text class="small left" x="46" y="124">y 向下</text>

  <rect class="layout" x="140" y="148" width="104" height="44" rx="2"/>
  <text class="small left" x="142" y="143">未变换：边框盒 104 × 44</text>

  <rect class="rect" x="160" y="160" width="156" height="66" rx="2"/>
  <text class="heading left" x="330" y="180">变换后边框矩形</text>
  <text class="body left" x="330" y="207">rect.width = 156px</text>
  <text class="body left" x="330" y="232">rect.height = 66px</text>
  <text class="body left" x="330" y="257">offsetWidth 仍为 104px</text>

  <line x1="160" y1="226" x2="160" y2="292" stroke="#9a8abe" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line class="measure" x1="40" y1="292" x2="160" y2="292" marker-end="url(#axisArrow)"/>
  <text class="heading left" x="45" y="283">从视口 x=0 量到左边缘：rect.left = 120px</text>

  <text class="mono left" x="46" y="340">布局：left/top 100px；content 100 × 40px；border 2px</text>
  <text class="mono left" x="46" y="365">变换：origin 0 0；translate(20px, 12px) scale(1.5)</text>
  <text class="small left" x="40" y="397">虚线为布局盒，实线为变换后矩形；教学坐标按 1 CSS px 对应 1 SVG 坐标绘制。</text>
</svg>
