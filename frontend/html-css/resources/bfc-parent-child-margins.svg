<svg xmlns="http://www.w3.org/2000/svg" width="700" height="370" viewBox="0 0 700 370" role="img" aria-labelledby="title desc">
  <title id="title">flow-root 隔开父级与首个子级的上 margin</title>
  <desc id="desc">按 1.5 倍绘制两个宽200像素的父盒，各有24像素上 margin；首个子盒宽150像素、高20像素、上 margin16像素。普通块父盒与子 margin 向外折叠成24像素，子盒贴父盒顶部，父自动高20像素。flow-root 父盒外侧仍是24像素，16像素子 margin 留在内部，父自动高36像素。</desc>
  <defs>
    <pattern id="outerMargin" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f4f6f8" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8999a8" stroke-width="2" />
    </pattern>
    <pattern id="innerMargin" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#eaf2f8" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8999a8" stroke-width="2" />
    </pattern>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #243548; }
      .heading { font-size: 19px; font-weight: 700; }
      .body { font-size: 16px; }
      .note { font-size: 15px; fill: #42566b; }
      .top { stroke: #8999a8; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .parent { fill: #eaf2f8; stroke: #345f7b; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .child { fill: #dcefe6; stroke: #628a75; stroke-width: 1.2; }
      .measure { stroke: #55758e; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="700" height="370" fill="#fff" />

  <text class="heading" x="25" y="30">普通块父级：父子 margin 向外折叠</text>
  <path class="top" d="M30 50 H350" />
  <rect x="40" y="50" width="300" height="36" fill="url(#outerMargin)" />
  <rect class="parent" x="40" y="86" width="300" height="30" />
  <rect class="child" x="40" y="86" width="225" height="30" />
  <text class="body" x="52" y="107">子盒</text>
  <path class="measure" d="M356 50 V86 M350 50 H362 M350 86 H362" />
  <text class="note" x="372" y="73">外侧 24px：父 24px 与子 16px 折叠</text>
  <path class="measure" d="M356 86 V116 M350 86 H362 M350 116 H362" />
  <text class="note" x="372" y="106">父 auto 高 20px：子盒贴父盒顶边</text>

  <text class="heading" x="25" y="166">flow-root：子 margin 留在父级内</text>
  <path class="top" d="M30 186 H350" />
  <rect x="40" y="186" width="300" height="36" fill="url(#outerMargin)" />
  <rect class="parent" x="40" y="222" width="300" height="54" />
  <rect x="41" y="223" width="224" height="23" fill="url(#innerMargin)" />
  <rect class="child" x="40" y="246" width="225" height="30" />
  <text class="body" x="52" y="267">子盒</text>
  <path class="measure" d="M356 186 V222 M350 186 H362 M350 222 H362" />
  <text class="note" x="372" y="209">父 margin 24px 仍在外侧</text>
  <path class="measure" d="M356 222 V246 M350 222 H362 M350 246 H362" />
  <text class="note" x="372" y="239">子 margin 16px 留在父盒内</text>
  <path class="measure" d="M356 246 V276 M350 246 H362 M350 276 H362" />
  <text class="note" x="372" y="266">子盒高 20px</text>
  <text class="body" x="40" y="304">父 auto 高 = 16 + 20 = 36px</text>

  <text class="note" x="25" y="348">按 1.5× 绘制；斜线为透明 margin，虚线框为父盒（宽 200px），绿色为子盒（宽 150px）。</text>
</svg>
