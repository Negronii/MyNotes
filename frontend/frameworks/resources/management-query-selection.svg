<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" role="img" aria-labelledby="title desc">
  <title id="title">列表查询到当前行</title>
  <desc id="desc">已提交的排序、筛选、页码与账户上下文合成列表查询键；GET 响应进入当前键缓存，然后按 report.id 渲染行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .node{fill:#f3efff;stroke:#7e61b3;stroke-width:2}
      .edge{fill:none;stroke:#334155;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow)}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px;fill:#1f2937;text-anchor:middle}
      .strong{font-weight:700}
    </style>
  </defs>
  <rect width="700" height="760" fill="#ffffff"/>

  <rect class="node" x="20" y="24" width="320" height="118" rx="7"/>
  <text x="180" y="56" class="strong"><tspan x="180">已提交 URL</tspan><tspan x="180" dy="27">sort=recent</tspan><tspan x="180" dy="27">status=published · page=1</tspan></text>
  <rect class="node" x="360" y="24" width="320" height="118" rx="7"/>
  <text x="520" y="66" class="strong"><tspan x="520">当前账户上下文</tspan><tspan x="520" dy="28">accountId = acct-a</tspan></text>

  <path class="edge" d="M 180 144 L 284 194"/>
  <path class="edge" d="M 520 144 L 416 194"/>
  <rect class="node" x="80" y="205" width="540" height="90" rx="7"/>
  <text x="350" y="241" class="strong"><tspan x="350">列表查询 key</tspan><tspan x="350" dy="27">accountId + sort + status + page</tspan></text>

  <path class="edge" d="M 350 295 L 350 343"/>
  <rect class="node" x="110" y="345" width="480" height="88" rx="7"/>
  <text x="350" y="380" class="strong"><tspan x="350">GET 当前页</tspan><tspan x="350" dy="27">queryFn 消费 signal</tspan></text>

  <path class="edge" d="M 350 433 L 350 481"/>
  <rect class="node" x="110" y="483" width="480" height="90" rx="7"/>
  <text x="350" y="519" class="strong"><tspan x="350">当前 key 的缓存</tspan><tspan x="350" dy="27">items = [17, 42]</tspan></text>

  <path class="edge" d="M 350 573 L 350 619"/>
  <rect class="node" x="110" y="621" width="480" height="90" rx="7"/>
  <text x="350" y="657" class="strong"><tspan x="350">按 report.id 渲染行</tspan><tspan x="350" dy="27">React key 只标识行身份</tspan></text>
</svg>
