<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#728aa2"/></marker></defs><rect width="900" height="980" rx="16" fill="#f8fafc"/><g font-family="Arial, PingFang SC, sans-serif" fill="#29384d"><text x="240" y="50" text-anchor="middle" font-size="23" fill="#566d87">首次打开文档</text><text x="660" y="50" text-anchor="middle" font-size="23" fill="#566d87">之后点 Oldest first</text><rect x="55" y="85" width="370" height="130" rx="13" fill="#eef5ff" stroke="#ccd9e7" stroke-width="2"/><text x="240.0" y="122.0" text-anchor="middle" font-size="23">服务端生成 RSC payload</text><text x="240.0" y="158.0" text-anchor="middle" font-size="23">再结合 Client Components</text><text x="240.0" y="194.0" text-anchor="middle" font-size="23">生成初始 HTML</text><rect x="475" y="85" width="370" height="130" rx="13" fill="#eef5ff" stroke="#ccd9e7" stroke-width="2"/><text x="660.0" y="122.0" text-anchor="middle" font-size="23">服务端读取 sort=oldest</text><text x="660.0" y="158.0" text-anchor="middle" font-size="23">得到 April、May</text><text x="660.0" y="194.0" text-anchor="middle" font-size="23">生成新的 RSC payload</text><polyline points="240,228 240,286" fill="none" stroke="#728aa2" stroke-width="3" marker-end="url(#a)"/><polyline points="660,228 660,286" fill="none" stroke="#728aa2" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="300" width="370" height="130" rx="13" fill="#fff4e5" stroke="#ccd9e7" stroke-width="2"/><text x="240.0" y="337.0" text-anchor="middle" font-size="23">浏览器显示该区域 HTML</text><text x="240.0" y="373.0" text-anchor="middle" font-size="23">May、April 与输入框</text><text x="240.0" y="409.0" text-anchor="middle" font-size="23">事件处理器尚未接上</text><rect x="475" y="300" width="370" height="130" rx="13" fill="#f2edfa" stroke="#ccd9e7" stroke-width="2"/><text x="660.0" y="337.0" text-anchor="middle" font-size="23">浏览器合入新载荷</text><text x="660.0" y="373.0" text-anchor="middle" font-size="23">不重新加载整个 HTML 文档</text><text x="660.0" y="409.0" text-anchor="middle" font-size="23">仍使用现有组件树</text><polyline points="240,444 240,506" fill="none" stroke="#728aa2" stroke-width="3" marker-end="url(#a)"/><polyline points="660,444 660,506" fill="none" stroke="#728aa2" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="520" width="370" height="150" rx="13" fill="#f2edfa" stroke="#ccd9e7" stroke-width="2"/><text x="240.0" y="549.0" text-anchor="middle" font-size="23">RSC payload 协调组件树</text><text x="240.0" y="585.0" text-anchor="middle" font-size="23">客户端 JS 加载后 hydrate</text><text x="240.0" y="621.0" text-anchor="middle" font-size="23">为 Client Components</text><text x="240.0" y="657.0" text-anchor="middle" font-size="23">接上状态与事件</text><rect x="475" y="520" width="370" height="150" rx="13" fill="#eef5ff" stroke="#ccd9e7" stroke-width="2"/><text x="660.0" y="567.0" text-anchor="middle" font-size="23">ReportSearch 树位置未变</text><text x="660.0" y="603.0" text-anchor="middle" font-size="23">收到新列表 April、May</text><text x="660.0" y="639.0" text-anchor="middle" font-size="23">保留已有 query = "April"</text><polyline points="240,684 240,746" fill="none" stroke="#728aa2" stroke-width="3" marker-end="url(#a)"/><polyline points="660,684 660,746" fill="none" stroke="#728aa2" stroke-width="3" marker-end="url(#a)"/><rect x="55" y="760" width="370" height="125" rx="13" fill="#eaf7f1" stroke="#ccd9e7" stroke-width="2"/><text x="240.0" y="812.5" text-anchor="middle" font-size="23">用户输入 April</text><text x="240.0" y="848.5" text-anchor="middle" font-size="23">本地过滤后只显示 April</text><rect x="475" y="760" width="370" height="125" rx="13" fill="#eaf7f1" stroke="#ccd9e7" stroke-width="2"/><text x="660.0" y="812.5" text-anchor="middle" font-size="23">新列表仍按 query 过滤</text><text x="660.0" y="848.5" text-anchor="middle" font-size="23">所以仍只显示 April</text><text x="450" y="940" text-anchor="middle" font-size="23" fill="#566d87">右侧以组件未卸载、key 未变为前提；整页重载不保留本地输入</text></g></svg>