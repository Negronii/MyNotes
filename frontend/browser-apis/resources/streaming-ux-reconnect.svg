<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="事件104后断线，保留报表版本10；同一EventSource URL带Last-Event-ID104重连，应用事件105版本11终态后关闭">
