<svg xmlns="http://www.w3.org/2000/svg" width="900" height="905" viewBox="0 0 900 905" role="img" aria-label="本例创建工单回执超时；原运行与工具卡保持effect_unknown，通过原操作身份只读对账，确认后更新原卡并结束运行">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7086a3"/></marker></defs>
<rect width="900" height="905" rx="14" fill="#f7f9fc"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24364c">
<rect x="80" y="25" width="740" height="140" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="450.0" y="60" text-anchor="middle" font-size="25" font-weight="600">seq=9–10：回执超时，结果未知</text>
<text x="450.0" y="98" text-anchor="middle" font-size="23">c2 与 run → effect_unknown</text>
<text x="450.0" y="130" text-anchor="middle" font-size="23">保留原写操作身份，不另建同效运行</text>
<path d="M450,177 L450,222" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="237" width="740" height="140" rx="12" fill="#f4effb" stroke="#daccf1" stroke-width="2"/>
<text x="450.0" y="272" text-anchor="middle" font-size="25" font-weight="600">运行服务只读对账</text>
<text x="450.0" y="310" text-anchor="middle" font-size="23">按原写操作的身份查询远端结果</text>
<text x="450.0" y="342" text-anchor="middle" font-size="23">核对工单与本次请求的关联，不只比较标题</text>
<path d="M450,389 L450,425 L240,425 L240,497" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M450,425 L670,425 L670,497" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="30" y="512" width="410" height="170" rx="12" fill="#ecf7f2" stroke="#b8dccc" stroke-width="2"/>
<text x="235.0" y="547" text-anchor="middle" font-size="25" font-weight="600">确认匹配：seq=11</text>
<text x="235.0" y="585" text-anchor="middle" font-size="23">更新原 c2 → completed</text>
<text x="235.0" y="617" text-anchor="middle" font-size="23">结果：ISSUE-842</text>
<text x="235.0" y="649" text-anchor="middle" font-size="23">不创建第二张工具卡</text>
<rect x="470" y="512" width="400" height="170" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="670.0" y="547" text-anchor="middle" font-size="25" font-weight="600">未确认：仍 effect_unknown</text>
<text x="670.0" y="585" text-anchor="middle" font-size="23">暂时查不到 ≠ 没有创建</text>
<text x="670.0" y="617" text-anchor="middle" font-size="23">保留原身份，继续对账</text>
<text x="670.0" y="649" text-anchor="middle" font-size="23">未排除迟到前不新建运行</text>
<path d="M235,694 L235,739" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="30" y="754" width="410" height="120" rx="12" fill="#ecf7f2" stroke="#b8dccc" stroke-width="2"/>
<text x="235.0" y="789" text-anchor="middle" font-size="25" font-weight="600">seq=12 → seq=13</text>
<text x="235.0" y="827" text-anchor="middle" font-size="23">确认文本 → run completed</text>
<text x="670" y="792" text-anchor="middle" font-size="22">旧写确定未发生且不能再迟到，</text>
<text x="670" y="828" text-anchor="middle" font-size="22">才可按用户新意图发起新运行。</text>
</g>
</svg>
