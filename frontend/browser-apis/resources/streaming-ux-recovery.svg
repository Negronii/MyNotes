<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1105" viewBox="0 0 900 1105" role="img" aria-label="报表连接仍重连时等待原EventSource；reset或坏数据或意外CLOSED则关闭旧流，预算允许才读一致快照，失败保留旧画面并等待手动重试">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7086a3"/></marker></defs>
<rect width="900" height="1105" rx="14" fill="#f7f9fc"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24364c">
<rect x="30" y="25" width="260" height="170" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="160.0" y="60" text-anchor="middle" font-size="25" font-weight="600">仍在重连</text>
<text x="160.0" y="98" text-anchor="middle" font-size="23">error + CONNECTING</text>
<text x="160.0" y="130" text-anchor="middle" font-size="23">保留最后有效画面</text>
<text x="160.0" y="162" text-anchor="middle" font-size="23">浏览器续连原对象</text>
<rect x="320" y="25" width="260" height="170" rx="12" fill="#eef5ff" stroke="#cbddf4" stroke-width="2"/>
<text x="450.0" y="60" text-anchor="middle" font-size="25" font-weight="600">内容不可继续</text>
<text x="450.0" y="98" text-anchor="middle" font-size="23">reset / 坏 JSON</text>
<text x="450.0" y="130" text-anchor="middle" font-size="23">无效字段</text>
<text x="450.0" y="162" text-anchor="middle" font-size="23">patch 出现版本缺口</text>
<rect x="610" y="25" width="260" height="170" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="740.0" y="60" text-anchor="middle" font-size="25" font-weight="600">传输已终止</text>
<text x="740.0" y="98" text-anchor="middle" font-size="23">error + CLOSED</text>
<text x="740.0" y="130" text-anchor="middle" font-size="23">例如收到 HTTP 204</text>
<text x="740.0" y="162" text-anchor="middle" font-size="23">浏览器不再重连</text>
<path d="M160,207 L160,265" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="30" y="280" width="260" height="140" rx="12" fill="#f1f3f6" stroke="#d5dbe4" stroke-width="2"/>
<text x="160.0" y="315" text-anchor="middle" font-size="25" font-weight="600">等待浏览器</text>
<text x="160.0" y="353" text-anchor="middle" font-size="23">不创建新对象</text>
<text x="160.0" y="385" text-anchor="middle" font-size="23">不消耗快照预算</text>
<path d="M450,207 L450,235 L740,235 L740,207" fill="none" stroke="#7086a3" stroke-width="3"/>
<path d="M615,235 L615,315" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="335" y="330" width="535" height="140" rx="12" fill="#eef5ff" stroke="#cbddf4" stroke-width="2"/>
<text x="602.5" y="365" text-anchor="middle" font-size="25" font-weight="600">应用恢复：关闭旧流，检查预算</text>
<text x="602.5" y="403" text-anchor="middle" font-size="23">预算允许 → 下面的 GET（本例最多一次）</text>
<text x="602.5" y="435" text-anchor="middle" font-size="23">预算耗尽 → 不可用，等待显式重试</text>
<path d="M615,482 L615,510 L450,510 L450,565" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="100" y="580" width="700" height="135" rx="12" fill="#f4effb" stroke="#daccf1" stroke-width="2"/>
<text x="450.0" y="615" text-anchor="middle" font-size="25" font-weight="600">GET 当前快照与同一读点的游标</text>
<text x="450.0" y="653" text-anchor="middle" font-size="23">实际请求期间显示恢复提示；结束即清除</text>
<text x="450.0" y="685" text-anchor="middle" font-size="23">新快照通过字段与版本校验前，保留旧画面</text>
<path d="M450,727 L450,770 L235,770 L235,815" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M450,770 L670,770 L670,815" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="30" y="830" width="410" height="170" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="235.0" y="865" text-anchor="middle" font-size="25" font-weight="600">GET 失败 / 快照无效或过旧</text>
<text x="235.0" y="903" text-anchor="middle" font-size="23">旧流已关闭，保留旧画面</text>
<text x="235.0" y="935" text-anchor="middle" font-size="23">显示不可用，只等显式重试</text>
<text x="235.0" y="967" text-anchor="middle" font-size="23">不留下“正在恢复”提示</text>
<rect x="470" y="830" width="400" height="170" rx="12" fill="#ecf7f2" stroke="#b8dccc" stroke-width="2"/>
<text x="670.0" y="865" text-anchor="middle" font-size="25" font-weight="600">快照与游标验证成功</text>
<text x="670.0" y="903" text-anchor="middle" font-size="23">替换画面，再看报表状态</text>
<text x="670.0" y="935" text-anchor="middle" font-size="23">running：用新游标续订</text>
<text x="670.0" y="967" text-anchor="middle" font-size="23">ready / failed / canceled：关闭</text>
<text x="450" y="1048" text-anchor="middle" font-size="22">只有应用较新的有效事件后，才重置自动快照恢复预算。</text>
<text x="450" y="1082" text-anchor="middle" font-size="22">本例事件是完整视图；依赖前序版本的 patch 必须连续。</text>
</g>
</svg>
