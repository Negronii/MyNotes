<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" role="img" aria-labelledby="title desc"><title id="title">tree-regression-route</title><desc id="desc">新记录B=3按2.5阈值进入右叶。两叶中的记录编号为训练样本，叶内统计给出预测。</desc><defs><marker id="a0" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#a7b4c7"/></marker><marker id="a1" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#3574b7"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27384e}</style><rect width="700" height="330" rx="12" fill="white"/><rect x="240" y="18" width="220" height="65" rx="12" fill="#eaf2ff" stroke="#3574b7" stroke-width="2.5"/><text x="350" y="59" text-anchor="middle" font-size="24" font-weight="600">B ≤ 2.5 ?</text><path d="M350 87 V112" fill="none" stroke="#3574b7" stroke-width="3"/><path d="M350 112 H155 V184" fill="none" stroke="#a7b4c7" stroke-width="2" marker-end="url(#a0)"/><text x="250" y="145" text-anchor="middle" font-size="19" font-weight="400">是</text><rect x="15" y="192" width="280" height="120" rx="12" fill="#f8faff" stroke="#a7b4c7" stroke-width="1.5"/><text x="155" y="224" text-anchor="middle" font-size="19" font-weight="400">记录 1、2：10、12</text><text x="155" y="256" text-anchor="middle" font-size="19" font-weight="400">均值：(10 + 12) / 2</text><text x="155" y="288" text-anchor="middle" font-size="19" font-weight="600">预测：11</text><path d="M350 112 H545 V184" fill="none" stroke="#3574b7" stroke-width="3" marker-end="url(#a1)"/><text x="450" y="145" text-anchor="middle" font-size="19" font-weight="600">否 · 本次走这里</text><rect x="405" y="192" width="280" height="120" rx="12" fill="#eaf2ff" stroke="#3574b7" stroke-width="2.5"/><text x="545" y="224" text-anchor="middle" font-size="19" font-weight="400">记录 3、4：20、22</text><text x="545" y="256" text-anchor="mid