<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="870" viewBox="0 0 1100 870" role="img" aria-labelledby="title desc">
  <title id="title">数据库缓冲池、操作系统页缓存与处理器缓存行</title>
  <desc id="desc">DBMS 缓冲池命中时直接使用数据库页。未命中后，I/O 路径可使用操作系统页缓存或绕过它；页缓存命中会返回页并填入 DBMS 缓冲池，页缓存未命中与绕过路径都会读控制器和设备，再填入 DBMS 缓冲池。下方另示页驻留主存后的 CPU 访问：处理器缓存命中直接返回所需字节，未命中才访问 DRAM 并取回缓存行。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#475569"/></marker>
    <marker id="arrowHit" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#15803d"/></marker>
    <marker id="arrowMiss" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#c2410c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .panel { font-size: 23px; font-weight: 700; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; }
      .arrow { stroke: #475569; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .hit { stroke: #15803d; stroke-width: 3; marker-end: url(#arrowHit); fill: none; }
      .miss { stroke: #c2410c; stroke-width: 3; marker-end: url(#arrowMiss); fill: none; }
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="868" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="34" y="46" class="title">数据库页 I/O 与处理器缓存是不同层次</text>

  <rect x="28" y="68" width="1044" height="490" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="104" class="panel">先看数据库页是否已在 DBMS 缓冲池</text>

  <rect x="52" y="132" width="226" height="88" rx="11" class="box"/>
  <text x="165" y="166" text-anchor="middle" class="head">查询计划</text>
  <text x="165" y="194" text-anchor="middle" class="body">请求索引页或表页</text>

  <path d="M286 176 H340" class="arrow"/>
  <rect x="342" y="132" width="260" height="88" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="472" y="166" text-anchor="middle" class="head">DBMS 缓冲池</text>
  <text x="472" y="194" text-anchor="middle" class="body">保存数据库页的主存区域</text>

  <path d="M606 154 H738" class="hit"/>
  <text x="667" y="145" text-anchor="middle" class="small" fill="#15803d">命中</text>
  <rect x="740" y="122" width="300" height="100" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="890" y="160" text-anchor="middle" class="head">页已在内存</text>
  <text x="890" y="190" text-anchor="middle" class="body">执行器继续，无需设备读</text>

  <path d="M472 222 V248 H274 V276" class="miss"/>
  <path d="M472 248 H840 V276" class="miss"/>
  <text x="490" y="235" text-anchor="start" class="small" fill="#9a3412">未命中后选 I/O 路径</text>

  <rect x="58" y="278" width="432" height="78" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="274" y="310" text-anchor="middle" class="head">采用操作系统页缓存</text>
  <text x="274" y="338" text-anchor="middle" class="small">普通文件缓存路径</text>

  <rect x="624" y="278" width="432" height="78" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="840" y="310" text-anchor="middle" class="head">绕过操作系统页缓存</text>
  <text x="840" y="338" text-anchor="middle" class="small">直接提交设备 I/O</text>

  <path d="M190 356 V408" class="hit"/>
  <text x="144" y="386" text-anchor="middle" class="small" fill="#15803d">OS 命中</text>
  <rect x="42" y="410" width="360" height="100" rx="11" fill="#ecfccb" stroke="#65a30d" stroke-width="2.5"/>
  <text x="222" y="448" text-anchor="middle" class="head">页缓存返回数据</text>
  <text x="222" y="480" text-anchor="middle" class="body">填入 DBMS 缓冲池</text>

  <path d="M448 356 V382 H710 V408" class="miss"/>
  <text x="575" y="376" text-anchor="middle" class="small" fill="#9a3412">OS 未命中</text>
  <path d="M900 356 V408" class="miss"/>
  <text x="970" y="376" text-anchor="middle" class="small" fill="#9a3412">绕过路径</text>
  <rect x="520" y="410" width="440" height="100" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="740" y="448" text-anchor="middle" class="head">控制器 / 设备读取</text>
  <text x="740" y="480" text-anchor="middle" class="body">读回页面后填入 DBMS 缓冲池</text>

  <rect x="28" y="578" width="1044" height="264" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="616" class="panel">页在主存后，CPU 按地址读取字节；缓存以 cache line 为单位</text>

  <rect x="48" y="654" width="280" height="76" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="188" y="684" text-anchor="middle" class="head">CPU 读取页内字节</text>
  <text x="188" y="712" text-anchor="middle" class="small">按主存地址发起访问</text>

  <path d="M336 692 H386" class="arrow"/>
  <rect x="388" y="654" width="300" height="76" rx="11" class="box"/>
  <text x="538" y="684" text-anchor="middle" class="head">处理器缓存查找</text>
  <text x="538" y="712" text-anchor="middle" class="small">保存由相邻字节组成的缓存行</text>

  <path d="M692 672 H762" class="hit"/>
  <text x="722" y="661" text-anchor="middle" class="small" fill="#15803d">命中</text>
  <rect x="764" y="646" width="280" height="88" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="904" y="681" text-anchor="middle" class="head">CPU 得到所需字节</text>
  <text x="904" y="711" text-anchor="middle" class="small">缓存行命中或从主存取回</text>

  <path d="M538 732 V772" class="miss"/>
  <text x="520" y="754" text-anchor="end" class="small" fill="#9a3412">未命中</text>
  <rect x="388" y="774" width="300" height="52" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="538" y="807" text-anchor="middle" class="head">访问 DRAM，返回缓存行</text>
  <path d="M688 800 H744 V720 H762" class="arrow"/>
</svg>
