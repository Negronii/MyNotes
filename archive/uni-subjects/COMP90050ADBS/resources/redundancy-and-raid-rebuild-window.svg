<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">第一次故障后，重建窗口内的额外失效风险</title>
  <desc id="desc">本算例假设重建用时固定为 r 小时。RAID1 两盘镜像在第一盘失效后进入降级状态；重建完成恢复冗余，剩余盘在 r 内失效则数据丢失。三盘 RAID3 在首盘失效后另外两盘中任一盘失效就会超出单校验容错。条件风险以指数公式计算，再在独立恒定故障率和 λr 远小于 1 时作一阶近似。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 21px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 18px; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="578" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="45" class="title">可修复模型：首盘故障后，重建窗口内仍可能丢失数据</text>

  <rect x="30" y="68" width="940" height="225" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="101" class="head">RAID 1：两盘镜像</text>
  <rect x="50" y="125" width="170" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="135" y="158" text-anchor="middle" class="head">冗余完整</text>
  <text x="135" y="187" text-anchor="middle" class="small">两份副本可读</text>
  <line x1="222" y1="167" x2="260" y2="167" class="arrow"/>
  <rect x="270" y="125" width="190" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="365" y="158" text-anchor="middle" class="head">首盘失效</text>
  <text x="365" y="187" text-anchor="middle" class="small">首盘失效率 2λ</text>
  <line x1="462" y1="167" x2="500" y2="167" class="arrow"/>
  <rect x="510" y="125" width="210" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="615" y="154" text-anchor="middle" class="head">降级并重建</text>
  <text x="615" y="180" text-anchor="middle" class="small">固定用时 r 小时</text>
  <text x="615" y="201" text-anchor="middle" class="small">条件风险 ≈ λr</text>
  <path d="M722 154 L760 140" class="arrow"/>
  <rect x="770" y="108" width="180" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="860" y="138" text-anchor="middle" class="head">重建完成</text>
  <text x="860" y="163" text-anchor="middle" class="small">恢复两份副本</text>
  <path d="M722 180 L760 220" class="arrow"/>
  <rect x="770" y="192" width="180" height="78" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="860" y="222" text-anchor="middle" class="head">另一盘在 r 内失效</text>
  <text x="860" y="251" text-anchor="middle" class="small">数据丢失</text>

  <rect x="30" y="307" width="940" height="225" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="340" class="head">RAID 3：两块数据盘 + 一块奇偶校验盘</text>
  <rect x="50" y="364" width="170" height="84" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="135" y="397" text-anchor="middle" class="head">冗余完整</text>
  <text x="135" y="426" text-anchor="middle" class="small">三盘均健康</text>
  <line x1="222" y1="406" x2="260" y2="406" class="arrow"/>
  <rect x="270" y="364" width="190" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="365" y="397" text-anchor="middle" class="head">首盘失效</text>
  <text x="365" y="426" text-anchor="middle" class="small">首盘失效率 3λ</text>
  <line x1="462" y1="406" x2="500" y2="406" class="arrow"/>
  <rect x="510" y="364" width="210" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="615" y="393" text-anchor="middle" class="head">降级并重建</text>
  <text x="615" y="419" text-anchor="middle" class="small">固定用时 r 小时</text>
  <text x="615" y="440" text-anchor="middle" class="small">条件风险 ≈ 2λr</text>
  <path d="M722 393 L760 379" class="arrow"/>
  <rect x="770" y="347" width="180" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="860" y="377" text-anchor="middle" class="head">重建完成</text>
  <text x="860" y="402" text-anchor="middle" class="small">恢复冗余</text>
  <path d="M722 419 L760 459" class="arrow"/>
  <rect x="770" y="431" width="180" height="78" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="860" y="455" text-anchor="middle" class="small" font-weight="700">另两盘任一</text>
  <text x="860" y="478" text-anchor="middle" class="small" font-weight="700">在 r 内失效</text>
  <text x="860" y="500" text-anchor="middle" class="small">数据丢失</text>

  <rect x="30" y="543" width="940" height="27" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="563" text-anchor="middle" class="small">全健康状态占多数时的近似数据丢失事件率：RAID1 2λ²r；三盘 RAID3 6λ²r（λr ≪ 1）</text>
</svg>
