<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">删除 Singh 和 Wu 后怎样重分配叶键并更新父边界</title>
  <desc id="desc">承接 Srinivasan 删除结果。右叶剩一项；两同父叶的 3+1 项超过容量，故将 Kim 从左叶重分配到右叶，父边界由 Mozart 改成 Kim，根 Gold 不变。</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#62758b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#2b6496"/></marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#287a58"/></marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#b84c45"/></marker>
    <style>
      text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#23344b}
      .title{font-size:28px;font-weight:700}
      .heading{font-size:24px;font-weight:700}
      .body{font-size:24px}
      .small{font-size:22px}
      .key{font-size:23px;font-weight:650}
      .muted{fill:#6c7c90}
      .panel{fill:#f7f9fc;stroke:#c8d3e0;stroke-width:2}
      .node{fill:#fff;stroke:#61758d;stroke-width:2.5}
      .focus{fill:#edf7f1;stroke:#287a58;stroke-width:3}
      .warm{fill:#fff6e7;stroke:#bc8a32;stroke-width:3}
      .dim{fill:#f2f4f7;stroke:#b8c1cc;stroke-width:2}
      .line-gray{fill:none;stroke:#62758b;stroke-width:3;marker-end:url(#arrow-gray)}
      .line-blue{fill:none;stroke:#2b6496;stroke-width:3;marker-end:url(#arrow-blue)}
      .line-green{fill:none;stroke:#287a58;stroke-width:3;marker-end:url(#arrow-green)}
      .line-red{fill:none;stroke:#b84c45;stroke-width:3;marker-end:url(#arrow-red)}
      .plain-gray{fill:none;stroke:#62758b;stroke-width:3}
      .plain-green{fill:none;stroke:#287a58;stroke-width:3}
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>
<text x="500" y="40" class="title" text-anchor="middle">续删 Singh、Wu：不能合页，于是重分配 Kim</text>
<text x="500" y="90" class="heading" text-anchor="middle">删除前（根 Gold；右内页分隔 Mozart）</text>
<rect x="58" y="126" width="405" height="90" rx="12" class="node"/>
<text x="260.5" y="179.0" class="small" text-anchor="middle">左叶：[Gold, Katz, Kim]</text>
<rect x="537" y="126" width="405" height="90" rx="12" class="warm"/>
<text x="739.5" y="179.0" class="small" text-anchor="middle">右叶：[Mozart, Singh, Wu]</text>
<text x="500" y="250" class="small" text-anchor="middle" fill="#8a641d">删掉 Singh、Wu 后：1 + 3 = 4 &gt; 叶容量 3，不能合并</text>
<path d="M465 170 L532 170" class="line-blue"/>
<rect x="58" y="330" width="405" height="90" rx="12" class="focus"/>
<text x="260.5" y="383.0" class="small" text-anchor="middle">重分配后：[Gold, Katz]</text>
<rect x="537" y="330" width="405" height="90" rx="12" class="focus"/>
<text x="739.5" y="383.0" class="small" text-anchor="middle">重分配后：[Kim, Mozart]</text>
<path d="M464 374 L531 374" class="line-green"/>
<text x="500" y="474" class="small" text-anchor="middle" fill="#287a58">Kim 从左叶移到右叶；叶链仍按键序相连</text>
<rect x="90" y="505" width="360" height="58" rx="12" class="focus"/>
<text x="270.0" y="542.0" class="small" text-anchor="middle">右内页分隔键：Mozart → Kim</text>
<rect x="550" y="505" width="360" height="58" rx="12" class="node"/>
<text x="730.0" y="542.0" class="small" text-anchor="middle">根分隔键：Gold（不变）</text>
</svg>
