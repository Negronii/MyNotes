<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">单盘在线与维修状态周期</title>
  <desc id="desc">时间线上交替出现在线运行段和维修停机段。各在线段是运行寿命样本，各停机段是修复时间样本。两状态周期模型的长期可用率等于平均在线时间除以平均周期时间。示意长度不按比例。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 20px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="358" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="32" y="45" class="title">单盘的长期可用率：在线与维修交替出现</text>
  <text x="868" y="74" text-anchor="end" class="small">示意长度不按真实时间比例</text>

  <rect x="42" y="112" width="200" height="72" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="142" y="143" text-anchor="middle" class="head">在线运行</text>
  <text x="142" y="169" text-anchor="middle" class="body">一次寿命样本</text>
  <rect x="242" y="112" width="100" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="292" y="143" text-anchor="middle" class="small" font-weight="700">维修</text>
  <text x="292" y="167" text-anchor="middle" class="small">停机</text>
  <rect x="342" y="112" width="200" height="72" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="442" y="143" text-anchor="middle" class="head">在线运行</text>
  <text x="442" y="169" text-anchor="middle" class="body">下一寿命样本</text>
  <rect x="542" y="112" width="100" height="72" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="592" y="143" text-anchor="middle" class="small" font-weight="700">维修</text>
  <text x="592" y="167" text-anchor="middle" class="small">停机</text>
  <rect x="642" y="112" width="216" height="72" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="750" y="143" text-anchor="middle" class="head">在线运行</text>
  <text x="750" y="169" text-anchor="middle" class="body">继续累积样本</text>

  <text x="142" y="213" text-anchor="middle" class="small">单次在线时间</text>
  <text x="292" y="213" text-anchor="middle" class="small">单次修复时间</text>
  <line x1="42" y1="229" x2="858" y2="229" stroke="#64748b" stroke-width="2"/>
  <path d="M42 222 V236 M858 222 V236" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="258" text-anchor="middle" class="small">长期可用率 = 所有在线时间 ÷（在线时间 + 维修停机时间）</text>
  <rect x="202" y="277" width="496" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="450" y="312" text-anchor="middle" class="head">A<tspan baseline-shift="sub" font-size="15">disk</tspan> = MTTF / (MTTF + MTTR)</text>
</svg>
