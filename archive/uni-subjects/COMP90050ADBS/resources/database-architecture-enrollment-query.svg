<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" role="img" aria-labelledby="title desc">
  <title id="title">选课查询经过数据库的哪些部件</title>
  <desc id="desc">选课应用向查询处理器提交按学生编号查询选课的请求。查询处理器选择计划，再向存储管理器发出页面访问请求；存储管理器按计划访问索引页或表页，经缓冲池读取，未命中时才读磁盘页。写入选课记录时，约束检查与事务和 WAL 恢复是共同作用于写路径的管理责任，不是串行的查询步骤。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,4 L8,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#ffffff"/>
  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 8; }
    .module { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 6; }
    .storage { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 9; }
    .write { fill: #faf5ff; stroke: #7e22ce; stroke-width: 1.4; rx: 6; }
    .label { font-size: 15px; font-weight: 600; }
    .sub { font-size: 13.5px; }
    .edge { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .both { stroke: #334155; stroke-width: 1.5; fill: none; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    .write-label { font-size: 14px; font-weight: 600; fill: #6b21a8; }
  </style>

  <rect class="box" x="20" y="62" width="155" height="76"/>
  <text class="label" x="97.5" y="90" text-anchor="middle">选课应用</text>
  <text class="sub" x="97.5" y="116" text-anchor="middle">按学号 101 查课</text>

  <rect class="box" x="235" y="62" width="160" height="76"/>
  <text class="label" x="315" y="90" text-anchor="middle">查询处理器</text>
  <text class="sub" x="315" y="116" text-anchor="middle">解析 SQL，选择计划</text>

  <rect class="storage" x="445" y="35" width="240" height="139"/>
  <text class="label" x="565" y="57" text-anchor="middle">存储管理器</text>
  <rect class="module" x="458" y="78" width="99" height="60"/>
  <text class="sub" x="507.5" y="102" text-anchor="middle">按计划访问</text>
  <text class="sub" x="507.5" y="123" text-anchor="middle">索引或表页</text>
  <rect class="module" x="600" y="78" width="72" height="60"/>
  <text class="label" x="636" y="113" text-anchor="middle">缓冲池</text>
  <path class="both" d="M558 108 H598"/>

  <path class="edge" d="M176 82 H233"/>
  <text class="sub" x="204" y="73" text-anchor="middle">SQL</text>
  <path class="edge" d="M235 118 H178"/>
  <text class="sub" x="205" y="137" text-anchor="middle">结果行</text>
  <path class="edge" d="M396 82 H443"/>
  <text class="sub" x="420" y="73" text-anchor="middle">页访问</text>
  <path class="edge" d="M445 126 H398"/>
  <text class="sub" x="418" y="146" text-anchor="middle">返回页</text>

  <rect class="box" x="445" y="232" width="240" height="45"/>
  <text class="label" x="565" y="251" text-anchor="middle">磁盘页</text>
  <text class="sub" x="565" y="269" text-anchor="middle">student / course / enrollment</text>
  <path class="both" d="M636 176 V230"/>
  <text class="sub" x="620" y="207" text-anchor="end">未命中读页 / 刷页</text>

  <rect class="storage" x="175" y="290" width="510" height="84"/>
  <text class="write-label" x="192" y="312">插入 enrollment 时共同适用的保证</text>
  <rect class="write" x="190" y="323" width="226" height="42"/>
  <text class="sub" x="303" y="340" text-anchor="middle">外键：学生、课程存在</text>
  <text class="sub" x="303" y="358" text-anchor="middle">唯一键：学生不重复选课</text>
  <rect class="write" x="430" y="323" width="240" height="42"/>
  <text class="sub" x="550" y="340" text-anchor="middle">事务原子提交</text>
  <text class="sub" x="550" y="358" text-anchor="middle">WAL 恢复已提交更新</text>
</svg>
