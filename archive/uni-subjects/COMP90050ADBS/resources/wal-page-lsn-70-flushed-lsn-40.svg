<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">WAL 日志持久边界与 P1 pageLSN：flushedLSN=40，pageLSN=70</title>
<desc id="desc">同一条从较早到较晚的合成日志轴。持久边界位于 LSN 40。LSN 70 是更新 P1 的日志记录，P1 页的 pageLSN=70 表示已应用该更新。P1 不可写：持久边界还未覆盖 LSN 70</desc>
<rect width="900" height="390" fill="#fff"/>
<rect x="48" y="58" width="20" height="20" rx="2" fill="#d9efe2" stroke="#397958" stroke-width="1.5"/>
<text x="78" y="75" font-family="system-ui,sans-serif" font-size="22" fill="#20252a">已持久日志前缀</text>
<rect x="305" y="58" width="20" height="20" rx="2" fill="#fae1df" stroke="#ad4b45" stroke-width="1.5"/>
<text x="335" y="75" font-family="system-ui,sans-serif" font-size="22" fill="#20252a">尚未持久的日志尾部</text>
<text x="48" y="105" font-family="system-ui,sans-serif" font-size="20" fill="#4b5563">合成 LSN 刻度只表示日志先后，不表示记录字节数；轴从早到晚。</text>
<rect x="90" y="116" width="280" height="48" fill="#d9efe2"/>
<rect x="370" y="116" width="420" height="48" fill="#fae1df"/>
<line x1="90" y1="140" x2="825" y2="140" stroke="#263238" stroke-width="3"/>
<path d="M 825 131 L 843 140 L 825 149 Z" fill="#263238"/>
<text x="850" y="146" font-family="system-ui,sans-serif" font-size="18" fill="#263238">晚</text>
<text x="74" y="146" text-anchor="end" font-family="system-ui,sans-serif" font-size="18" fill="#263238">早</text>
<line x1="90" y1="130" x2="90" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="90" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">0</text>
<line x1="160" y1="130" x2="160" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="160" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">10</text>
<line x1="230" y1="130" x2="230" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="230" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">20</text>
<line x1="300" y1="130" x2="300" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="300" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">30</text>
<line x1="370" y1="130" x2="370" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="370" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">40</text>
<line x1="440" y1="130" x2="440" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="440" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">50</text>
<line x1="510" y1="130" x2="510" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="510" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">60</text>
<line x1="580" y1="130" x2="580" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="580" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">70</text>
<line x1="650" y1="130" x2="650" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="650" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">80</text>
<line x1="720" y1="130" x2="720" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="720" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">90</text>
<line x1="790" y1="130" x2="790" y2="159" stroke="#263238" stroke-width="1.6"/>
<text x="790" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#20252a">100</text>
<line x1="370" y1="108" x2="370" y2="165" stroke="#bd5d13" stroke-width="4"/>
<text x="370" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#8d430c">flushedLSN = 40</text>
<line x1="580" y1="148" x2="580" y2="165" stroke="#6750a4" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="580" y1="205" x2="580" y2="246" stroke="#6750a4" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="580" cy="140" r="9" fill="#fff" stroke="#6750a4" stroke-width="4"/>
<text x="580" y="274" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#4c357e">LSN 70：更新 P1 的日志记录</text>
<text x="580" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#4c357e">P1 已应用此记录，故 pageLSN = 70</text>
<text x="450" y="341" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#a5322f">P1 不可写：持久边界还未覆盖 LSN 70</text>
<text x="450" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#374151">pageLSN 是页状态；先持久化对应 WAL，之后才可写该页。</text>
</svg>
