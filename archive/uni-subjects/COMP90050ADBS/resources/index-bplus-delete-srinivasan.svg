<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
  <title id="title">删除 Srinivasan 后为何叶页合并而内页重分配</title>
  <desc id="desc">先将同父叶页合并为三项，再因内部页合计有五个子指针超过四个容量而重分配。父分隔键 Mozart 下移，Gold 上升到根。</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#62758b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#2b6496"/></marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#287a58"/></marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#b84c45"/></marker>
    <style>
      text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#23344b}
      .title{font-size:28px;font-weight:700}
      .heading{font-size:24px;font-weight:700}
      .body{font-size:24px}
      .small{font-size:22px}
      .key{font-size:23px;font-weight:650}
      .muted{fill:#6c7c90}
      .panel{fill:#f7f9fc;stroke:#c8d3e0;stroke-width:2}
      .node{fill:#fff;stroke:#61758d;stroke-width:2.5}
      .focus{fill:#edf7f1;stroke:#287a58;stroke-width:3}
      .warm{fill:#fff6e7;stroke:#bc8a32;stroke-width:3}
      .dim{fill:#f2f4f7;stroke:#b8c1cc;stroke-width:2}
      .line-gray{fill:none;stroke:#62758b;stroke-width:3;marker-end:url(#arrow-gray)}
      .line-blue{fill:none;stroke:#2b6496;stroke-width:3;marker-end:url(#arrow-blue)}
      .line-green{fill:none;stroke:#287a58;stroke-width:3;marker-end:url(#arrow-green)}
      .line-red{fill:none;stroke:#b84c45;stroke-width:3;marker-end:url(#arrow-red)}
      .plain-gray{fill:none;stroke:#62758b;stroke-width:3}
      .plain-green{fill:none;stroke:#287a58;stroke-width:3}
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
<text x="500" y="40" class="title" text-anchor="middle">删除 Srinivasan：叶可合并，内页不能合并</text>
<text x="500" y="86" class="heading" text-anchor="middle">1 删 Srinivasan 后留下 [Wu]；同父两叶 1 + 2 = 3，可合并</text>
<rect x="48" y="115" width="250" height="78" rx="12" class="node"/>
<text x="173.0" y="162.0" class="small" text-anchor="middle">左叶：[Mozart, Singh]</text>
<rect x="360" y="115" width="190" height="78" rx="12" class="warm"/>
<text x="455.0" y="162.0" class="small" text-anchor="middle">右叶：[Wu]</text>
<rect x="665" y="115" width="285" height="78" rx="12" class="focus"/>
<text x="807.5" y="162.0" class="small" text-anchor="middle">合并：[Mozart, Singh, Wu]</text>
<polyline points="298,126 316,104 632,104 662,124" fill="none" stroke="#2b6496" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M552 180 L655 180" class="line-blue"/>
<text x="500" y="228" class="small" text-anchor="middle" fill="#287a58">叶链改为：前一叶 → [Mozart, Singh, Wu]；该叶没有后继</text>
<text x="500" y="302" class="heading" text-anchor="middle">2 同父内页只剩 1 个指针；与左页 4 个相加为 5 &gt; 容量 4</text>
<rect x="45" y="335" width="390" height="90" rx="12" class="node"/>
<text x="240.0" y="373.0" class="small" text-anchor="middle">左内页：[Califieri, Einstein, Gold]</text>
<text x="240.0" y="403.0" class="small" text-anchor="middle">4 个指针；末子树 [Gold, Katz, Kim]</text>
<rect x="565" y="335" width="390" height="90" rx="12" class="warm"/>
<text x="760.0" y="373.0" class="small" text-anchor="middle">右内页：1 个指针</text>
<text x="760.0" y="403.0" class="small" text-anchor="middle">接收合并后的 [Mozart, Singh, Wu]</text>
<path d="M440 378 L558 378" class="line-blue" stroke-dasharray="9 7"/>
<text x="500" y="460" class="small" text-anchor="middle">把左页末子树 [Gold, Katz, Kim] 移到右页；两页变成 3 / 2 个指针</text>
<text x="500" y="525" class="heading" text-anchor="middle">3 更新边界：根的 Mozart 下移到右内页；Gold 上升为新的根分隔键</text>
<rect x="390" y="548" width="220" height="65" rx="12" class="focus"/>
<text x="500.0" y="588.5" class="heading" text-anchor="middle">根：[Gold]</text>
<path d="M430 615 L245 646" class="line-green"/>
<path d="M570 615 L755 646" class="line-green"/>
<rect x="55" y="650" width="380" height="90" rx="12" class="node"/>
<text x="245.0" y="688.0" class="small" text-anchor="middle">左内页：[Califieri, Einstein]</text>
<text x="245.0" y="718.0" class="small" text-anchor="middle">3 个指针</text>
<rect x="565" y="650" width="380" height="90" rx="12" class="focus"/>
<text x="755.0" y="688.0" class="small" text-anchor="middle">右内页：[Mozart]</text>
<text x="755.0" y="718.0" class="small" text-anchor="middle">2 个指针；叶为 Gold… → Mozart…</text>
</svg>
