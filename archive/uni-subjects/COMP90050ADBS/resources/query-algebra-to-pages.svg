<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
  <title id="title">从关系代数到数据页读取</title>
  <desc id="desc">SQL先翻译为关系表达式；优化器比较等价逻辑计划并按统计信息估算，选择物理计划；执行引擎运行连接算子，通过缓冲管理器、文件管理器读取数据页或索引页，缓存命中则直接返回内存页。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#365f85"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#26734d"/>
    </marker>
    <marker id="arrow-start" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#365f85"/>
    </marker>
  </defs>
  <rect width="900" height="1010" fill="#fff"/>
  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#18324b">
    <text x="450" y="48" text-anchor="middle" font-size="31" font-weight="700">从关系代数到数据页读取</text>
    <text x="450" y="82" text-anchor="middle" font-size="21" fill="#526679">课程中的概念路径；具体 DBMS 的模块边界和缓存策略会不同</text>

    <g stroke="#607d96" stroke-width="2.5" fill="#f2f7fb">
      <rect x="20" y="122" width="200" height="156" rx="14"/>
      <rect x="240" y="122" width="200" height="156" rx="14"/>
      <rect x="460" y="122" width="200" height="156" rx="14"/>
      <rect x="680" y="122" width="200" height="156" rx="14"/>
      <rect x="460" y="320" width="200" height="100" rx="14" fill="#fff8e9" stroke="#b9872f"/>
      <rect x="250" y="470" width="400" height="140" rx="14" fill="#edf7f1" stroke="#438162"/>
      <rect x="45" y="735" width="250" height="170" rx="14"/>
      <rect x="370" y="735" width="245" height="170" rx="14"/>
      <rect x="685" y="735" width="195" height="170" rx="14" fill="#f7f2fb" stroke="#80679d"/>
    </g>

    <g stroke="#365f85" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
      <path d="M220 140 H240"/>
      <path d="M440 140 H460"/>
      <path d="M660 140 H680"/>
      <path d="M780 278 V450 H620 V470"/>
      <path d="M330 610 V670 L170 735"/>
    </g>
    <g stroke="#b9872f" stroke-width="3" fill="none" marker-end="url(#arrow-green)">
      <path d="M560 320 V278"/>
    </g>
    <g stroke="#26734d" stroke-width="3" fill="none" marker-end="url(#arrow-green)">
      <path d="M110 735 C86 668, 105 628, 266 610"/>
    </g>
    <g stroke="#365f85" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow-start)">
      <path d="M295 820 H370"/>
      <path d="M615 820 H685"/>
    </g>

    <g text-anchor="middle">
      <text x="120" y="163" font-size="25" font-weight="700">SQL 查询</text>
      <text x="120" y="202" font-size="21">声明要哪些行、列</text>
      <text x="120" y="236" font-size="20" fill="#526679">以及怎样匹配</text>

      <text x="340" y="163" font-size="24" font-weight="700">关系代数表达式</text>
      <text x="340" y="202" font-size="22">σ 选择 · Π 投影</text>
      <text x="340" y="236" font-size="22">⋈ 连接逻辑</text>

      <text x="560" y="163" font-size="25" font-weight="700">查询优化器</text>
      <text x="560" y="202" font-size="21">改写等价逻辑计划</text>
      <text x="560" y="236" font-size="20" fill="#526679">估算结果行数和页数</text>

      <text x="780" y="163" font-size="25" font-weight="700">物理计划</text>
      <text x="780" y="202" font-size="21">扫描方式、连接算法</text>
      <text x="780" y="236" font-size="20" fill="#526679">含外表 / 内表顺序</text>

      <text x="560" y="359" font-size="24" font-weight="700">统计信息</text>
      <text x="560" y="392" font-size="20">元组、不同值和页数</text>

      <text x="450" y="518" font-size="27" font-weight="700">查询执行引擎</text>
      <text x="450" y="557" font-size="21">运行选定的算子，并请求所需数据页</text>
      <text x="450" y="589" font-size="20" fill="#526679">实际处理候选元组对还会消耗 CPU</text>

      <text x="170" y="785" font-size="25" font-weight="700">缓冲管理器</text>
      <text x="170" y="824" font-size="21" fill="#26734d">命中：直接返回内存页</text>
      <text x="170" y="864" font-size="20">未命中：向文件管理器取页</text>

      <text x="492" y="785" font-size="25" font-weight="700">文件管理器</text>
      <text x="492" y="824" font-size="21">定位文件并读出所需页</text>
      <text x="492" y="864" font-size="20" fill="#526679">将页送回缓冲区</text>

      <text x="782" y="785" font-size="24" font-weight="700">存储页</text>
      <text x="782" y="824" font-size="21">数据页 / 索引页</text>
      <text x="782" y="864" font-size="20" fill="#526679">按页统计传输量</text>
    </g>
    <text x="450" y="950" text-anchor="middle" font-size="20" fill="#526679">页传输、寻道、缓存命中和 CPU 比较是不同成本项</text>
    <text x="450" y="979" text-anchor="middle" font-size="19" fill="#526679">上排是逻辑计划流；下排是执行器请求、缓存 / 存储读页与返回路径</text>
    <text x="450" y="1005" text-anchor="middle" font-size="18" fill="#526679">这是课程抽象，不表示所有产品模块或设备级 I/O 时序</text>
  </g>
</svg>
