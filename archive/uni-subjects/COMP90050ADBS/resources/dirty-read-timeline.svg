<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" role="img" aria-labelledby="title desc">
  <title id="title">脏读时序</title>
  <desc id="desc">两条事务泳道 T1、T2 和共享数据项 x；时间向下。T2 将 x 写为 20 但尚未提交，T1 在此时读到 20，之后 T2 中止并撤销未提交写入，x 回到 10。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#225b8f"/>
    </marker>
    <style>
      text { font-family:"PingFang SC","Noto Sans CJK SC",sans-serif; fill:#17212f; }
      .head { font-size:20px; font-weight:700; }
      .action { font-size:19px; font-weight:600; }
      .state { font-size:18px; fill:#34465f; }
      .lane { stroke:#a9b8c9; stroke-width:2; stroke-dasharray:7 7; }
      .data { stroke:#6d7f92; stroke-width:2; stroke-dasharray:4 6; }
      .arrow { stroke:#225b8f; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .pill { fill:#fff2e9; stroke:#b96b3d; stroke-width:2; }
      .statebox { fill:#f4f7fa; stroke:#6d7f92; stroke-width:2; }
      .time { stroke:#52677d; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="700" height="390" fill="#fff"/>
  <text class="head" x="130" y="42" text-anchor="middle">T1</text>
  <text class="head" x="350" y="42" text-anchor="middle">共享项 x</text>
  <text class="head" x="570" y="42" text-anchor="middle">T2</text>
  <text class="state" x="27" y="68">时间</text>
  <path class="time" d="M42 78 L42 369"/>
  <path class="lane" d="M130 68 L130 374 M570 68 L570 374"/>
  <path class="data" d="M350 68 L350 374"/>

  <rect class="statebox" x="298" y="79" width="104" height="34" rx="17"/>
  <text class="action" x="350" y="102" text-anchor="middle">初始 x=10</text>

  <text class="action" x="460" y="132" text-anchor="middle">W₂(x:=20)</text>
  <path class="arrow" d="M563 143 L357 143"/>
  <text class="state" x="363" y="166">x=20，T2 未提交</text>

  <text class="action" x="240" y="198" text-anchor="middle">R₁(x)=20</text>
  <path class="arrow" d="M343 209 L137 209"/>
  <text class="state" x="363" y="232">T1 读时，T2 未提交</text>

  <rect class="pill" x="510" y="250" width="120" height="31" rx="15"/>
  <text class="action" x="570" y="272" text-anchor="middle">T2 abort</text>
  <text class="action" x="460" y="322" text-anchor="middle">撤销未提交写入</text>
  <path class="arrow" d="M563 335 L357 335"/>
  <text class="state" x="363" y="361">回滚后 x=10</text>
</svg>
