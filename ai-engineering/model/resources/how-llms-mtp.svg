<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc"><title id="title">真实右移词元如何作为 MTP 下一步的输入</title><desc id="desc">DeepSeek-V3 MTP 深度 D=1：位置 1 的 RMSNorm(h1) 与真实 t2=c 的 RMSNorm(Emb(c)) 拼接成 2d，经 M1 投影回 d、附加块 TRM1 和共享 output head 预测 t3=a；位置 2 用同一模块以 h2 与真实 t3=a 预测 t4=c。总损失为 L_next 加已含 λ 的 L_MTP。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="760" fill="#FAFBFE"/>
<text x="450" y="36" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">DeepSeek-V3 · MTP 深度 D=1 · 训练串 [abab, c, a, c]</text>
<rect x="40" y="56" width="150" height="56" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="115.0" y="90.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₁ = abab</text>
<rect x="250" y="56" width="150" height="56" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="325.0" y="90.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₂ = c</text>
<rect x="460" y="56" width="150" height="56" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="535.0" y="90.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₃ = a</text>
<rect x="670" y="56" width="150" height="56" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="745.0" y="90.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₄ = c</text>
<text x="450" y="150" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">主模型：每个位置预测下一个词元</text>
<rect x="35" y="168" width="215" height="70" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="142.5" y="199.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">h₁ → shared head</text>
<text x="142.5" y="223.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">预测 t₂ = c</text>
<path d="M252 203 L282 203" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="290" y="168" width="150" height="70" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/>
<text x="365.0" y="199.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">L<tspan baseline-shift="sub" font-size="82%">next</tspan></text>
<text x="365.0" y="223.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">监督 t₂</text>
<text x="450" y="282" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">MTP 模块 1：已知真实下一个词元，再预测更远一个（两位置共用同一模块）</text>
<text x="30" y="310" font-size="15" font-weight="600" text-anchor="start" fill="#65748B">位置 1</text>
<rect x="30" y="318" width="190" height="62" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="125.0" y="345.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">RMSNorm(h₁)</text>
<text x="125.0" y="369.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">1 × d</text>
<rect x="30" y="396" width="190" height="62" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/>
<text x="125.0" y="423.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">RMSNorm(Emb(c))</text>
<text x="125.0" y="447.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">真实 t₂ = c</text>
<rect x="256" y="318" width="106" height="140" rx="12" fill="#FFFFFF" stroke="#DCD1EA" stroke-width="2"/>
<text x="309.0" y="384" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">Concat</text>
<text x="309.0" y="408" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">1 × 2d</text>
<path d="M222 349 L252 349" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M222 427 L252 427" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M364 388 L384 388" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="389" y="350" width="130" height="76" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/>
<text x="454.0" y="384.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">× M₁</text>
<text x="454.0" y="408.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">2d×d → 1×d</text>
<path d="M521 388 L545 388" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="553" y="350" width="120" height="76" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/>
<text x="613.0" y="384.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">TRM₁</text>
<text x="613.0" y="408.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">附加块</text>
<path d="M675 388 L699 388" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="707" y="350" width="165" height="76" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/>
<text x="789.5" y="384.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">shared head</text>
<text x="789.5" y="408.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">预测 t₃ = a</text>
<text x="30" y="492" font-size="15" font-weight="600" text-anchor="start" fill="#65748B">位置 2</text>
<rect x="30" y="500" width="190" height="62" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/>
<text x="125.0" y="527.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">RMSNorm(h₂)</text>
<text x="125.0" y="551.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">1 × d</text>
<rect x="30" y="578" width="190" height="62" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/>
<text x="125.0" y="605.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">RMSNorm(Emb(a))</text>
<text x="125.0" y="629.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">真实 t₃ = a</text>
<rect x="256" y="500" width="106" height="140" rx="12" fill="#FFFFFF" stroke="#DCD1EA" stroke-width="2"/>
<text x="309.0" y="566" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">Concat</text>
<text x="309.0" y="590" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">1 × 2d</text>
<path d="M222 531 L252 531" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M222 609 L252 609" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M364 570 L384 570" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="389" y="532" width="130" height="76" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/>
<text x="454.0" y="566.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">× M₁</text>
<text x="454.0" y="590.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">2d×d → 1×d</text>
<path d="M521 570 L545 570" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="553" y="532" width="120" height="76" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/>
<text x="613.0" y="566.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">TRM₁</text>
<text x="613.0" y="590.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">附加块</text>
<path d="M675 570 L699 570" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="707" y="532" width="165" height="76" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/>
<text x="789.5" y="566.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">shared head</text>
<text x="789.5" y="590.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">预测 t₄ = c</text>
<rect x="35" y="670" width="830" height="72" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/>
<text x="450.0" y="702.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">L<tspan baseline-shift="sub" font-size="82%">total</tspan> = L<tspan baseline-shift="sub" font-size="82%">next</tspan> + L<tspan baseline-shift="sub" font-size="82%">MTP</tspan></text>
<text x="450.0" y="726.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">L<tspan baseline-shift="sub" font-size="82%">MTP</tspan> 已含 λ · V3：前 10T token λ = 0.3；后 4.8T λ = 0.1</text>
</svg>
