<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc"><title id="title">一条请求的 TTFT 与 ITL：prefill 一次，decode 每步一个词元</title><desc id="desc">请求到达后先分词、排队，再做 prefill：位置 1–7 一起计算并写入 K/V，位置 7 给出 y1，y1 返回时 TTFT 结束。之后每一步 decode 把上一步的输出作为新位置输入：y1 作为位置 8 写入 K/V 并给出 y2，依此类推；相邻输出之间是 ITL。缓存始终比已生成的输出少一个位置。</desc><defs><marker id="a2C5F99" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2C5F99"/></marker><marker id="s2C5F99" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#2C5F99"/></marker><marker id="a5B6F8C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6F8C"/></marker><marker id="s5B6F8C" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5B6F8C"/></marker><marker id="aC0392B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C0392B"/></marker><marker id="sC0392B" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#C0392B"/></marker><marker id="aE08A1E" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E08A1E"/></marker><marker id="sE08A1E" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#E08A1E"/></marker></defs><rect width="1000" height="395" fill="#FAFBFE"/><text x="40.0" y="62.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#27364D">一条请求在 GPU 上的时间线（示意宽度，非实测比例）</text><rect x="40.0" y="120.0" width="120.0" height="64.0" rx="8" fill="#F2F4F7" stroke="#C9D2DE" stroke-width="1.5" stroke-dasharray="5 4"/><text x="100.0" y="148.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="400" text-anchor="middle" fill="#27364D">分词、排队</text><text x="100.0" y="168.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="400" text-anchor="middle" fill="#65748B">等调度</text><rect x="160.0" y="120.0" width="270.0" height="64.0" rx="8" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="295.0" y="147.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="600" text-anchor="middle" fill="#27364D">Prefill：位置 1–7 一起逐层计算</text><text x="295.0" y="168.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="400" text-anchor="middle" fill="#65748B">写入 K/V 1–7，位置 7 给出 y<tspan baseline-shift="sub" font-size="82%">1</tspan></text><rect x="440.0" y="120.0" width="150.0" height="64.0" rx="8" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="515.0" y="147.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="600" text-anchor="middle" fill="#27364D">Decode：输入 y<tspan baseline-shift="sub" font-size="82%">1</tspan></text><text x="515.0" y="168.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="400" text-anchor="middle" fill="#65748B">写入位置 8 → y<tspan baseline-shift="sub" font-size="82%">2</tspan></text><rect x="600.0" y="120.0" width="150.0" height="64.0" rx="8" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="675.0" y="147.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="600" text-anchor="middle" fill="#27364D">Decode：输入 y<tspan baseline-shift="sub" font-size="82%">2</tspan></text><text x="675.0" y="168.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="400" text-anchor="middle" fill="#65748B">写入位置 9 → y<tspan baseline-shift="sub" font-size="82%">3</tspan></text><rect x="760.0" y="120.0" width="150.0" height="64.0" rx="8" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="835.0" y="147.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="600" text-anchor="middle" fill="#27364D">Decode：输入 y<tspan baseline-shift="sub" font-size="82%">3</tspan></text><text x="835.0" y="168.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="400" text-anchor="middle" fill="#65748B">写入位置 10 → y<tspan baseline-shift="sub" font-size="82%">4</tspan></text><text x="945.0" y="158.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#8396B0">…</text><circle cx="430.0" cy="152.0" r="0"/><path d="M430.0 118.0 L430.0 94.0" fill="none" stroke="#E08A1E" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aE08A1E)"/><text x="430.0" y="88.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#A35E0B">y<tspan baseline-shift="sub" font-size="82%">1</tspan> 返回</text><circle cx="590.0" cy="152.0" r="0"/><path d="M590.0 118.0 L590.0 94.0" fill="none" stroke="#E08A1E" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aE08A1E)"/><text x="590.0" y="88.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#A35E0B">y<tspan baseline-shift="sub" font-size="82%">2</tspan> 返回</text><circle cx="750.0" cy="152.0" r="0"/><path d="M750.0 118.0 L750.0 94.0" fill="none" stroke="#E08A1E" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aE08A1E)"/><text x="750.0" y="88.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#A35E0B">y<tspan baseline-shift="sub" font-size="82%">3</tspan> 返回</text><circle cx="910.0" cy="152.0" r="0"/><path d="M910.0 118.0 L910.0 94.0" fill="none" stroke="#E08A1E" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aE08A1E)"/><text x="910.0" y="88.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#A35E0B">y<tspan baseline-shift="sub" font-size="82%">4</tspan> 返回</text><path d="M40.0 188.0 L40.0 94.0" fill="none" stroke="#5B6F8C" stroke-width="2" stroke-linecap="round"/><text x="40.0" y="88.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#5B6F8C">请求到达</text><path d="M43.0 214.0 L427.0 214.0" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" marker-end="url(#aC0392B)" marker-start="url(#sC0392B)"/><text x="235.0" y="234.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="600" text-anchor="middle" fill="#C0392B">TTFT：主要是排队 + prefill</text><path d="M433.0 214.0 L587.0 214.0" fill="none" stroke="#2C5F99" stroke-width="2" stroke-linecap="round" marker-end="url(#a2C5F99)" marker-start="url(#s2C5F99)"/><text x="510.0" y="234.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#2C5F99">ITL：一步 decode</text><path d="M593.0 214.0 L747.0 214.0" fill="none" stroke="#2C5F99" stroke-width="2" stroke-linecap="round" marker-end="url(#a2C5F99)" marker-start="url(#s2C5F99)"/><text x="670.0" y="234.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#2C5F99">ITL：一步 decode</text><path d="M753.0 214.0 L907.0 214.0" fill="none" stroke="#2C5F99" stroke-width="2" stroke-linecap="round" marker-end="url(#a2C5F99)" marker-start="url(#s2C5F99)"/><text x="830.0" y="234.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#2C5F99">ITL：一步 decode</text><text x="40.0" y="290.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="600" text-anchor="start" fill="#27364D">各步结束时的 KV 缓存</text><text x="40.0" y="310.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#65748B">（已生成的词元数总比已缓存的输出位置多 1）</text><rect x="370.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="381.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="392.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="403.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="414.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="425.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="436.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="447.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><rect x="458.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><rect x="469.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><rect x="480.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><text x="430.0" y="318.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#4F5D73">缓存 1–7</text><text x="430.0" y="336.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#4F5D73">已生成 1 个</text><rect x="530.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="541.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="552.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="563.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="574.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="585.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="596.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" stroke="#B5C2D3" stroke-width="1"/><rect x="607.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#4F8FD0" stroke="#B5C2D3" stroke-width="1"/><rect x="618.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><rect x="629.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><rect x="640.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#FFFFFF" stroke="#B5C2D3" stroke-width="1"/><text x="590.0" y="318.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#4F5D73">缓存 1–8</text><text x="590.0" y="336.0" font-family="Helvetica Neue, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#4F5D73">已生成 2 个</text><rect x="690.0" y="280.0" width="10.0" height="16.0" rx="2" fill="#9C86CC" strok