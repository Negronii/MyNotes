<svg xmlns="http://www.w3.org/2000/svg" width="700" height="590" viewBox="0 0 700 590" role="img" aria-labelledby="title desc">
  <title id="title">HNSW 六点分层示意</title>
  <desc id="desc">插入 X 前的六点玩具图。A、B 和 C 在其所属的多层间竖直对齐；层内边是双向可走边，竖向虚线仅表示同一向量存在于不同层。</desc>
  <defs>
    <marker id="edgeBoth" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#486782"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#20364b}
      .row{fill:#f7f9fc;stroke:#d7e0e9;stroke-width:1.5}
      .layer{font-size:16px;font-weight:700;fill:#63758a}
      .minor{font-size:14px;fill:#68798b}
      .nodeLabel{font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .blue{fill:#e5f1fb;stroke:#5685ab;stroke-width:2.5}
      .red{fill:#fbe9e8;stroke:#c76b69;stroke-width:2.5}
      .edge{fill:none;stroke:#486782;stroke-width:2.5;marker-start:url(#edgeBoth);marker-end:url(#edgeBoth)}
      .same{fill:none;stroke:#8796a6;stroke-width:2;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="700" height="590" fill="#ffffff"/>
  <text x="25" y="29" class="minor">六点示意图 · X 插入前</text>

  <rect class="row" x="20" y="48" width="660" height="100" rx="14"/>
  <rect class="row" x="20" y="167" width="660" height="105" rx="14"/>
  <rect class="row" x="20" y="291" width="660" height="190" rx="14"/>
  <text class="layer" x="38" y="103">L2</text>
  <text class="layer" x="38" y="223">L1</text>
  <text class="layer" x="38" y="352">L0</text>
  <text class="minor" x="38" y="374">底层</text>

  <!-- Dashed vertical links mean same-vector layer membership, not graph edges. -->
  <path class="same" d="M125 98 V218 M125 218 V350 M245 218 V350 M350 218 V350"/>

  <!-- Bidirectional links within each layer. -->
  <path class="edge" d="M149 218 H221"/>
  <path class="edge" d="M269 218 H326"/>
  <path class="edge" d="M149 350 H221"/>
  <path class="edge" d="M269 350 H326"/>
  <path class="edge" d="M374 350 H461"/>
  <path class="edge" d="M509 350 H581"/>
  <path class="edge" d="M350 374 V421"/>

  <!-- L2 -->
  <circle class="blue" cx="125" cy="98" r="23"/><text class="nodeLabel" x="125" y="99">A</text>
  <!-- L1 -->
  <circle class="blue" cx="125" cy="218" r="23"/><text class="nodeLabel" x="125" y="219">A</text>
  <circle class="red" cx="245" cy="218" r="23"/><text class="nodeLabel" x="245" y="219">B</text>
  <circle class="blue" cx="350" cy="218" r="23"/><text class="nodeLabel" x="350" y="219">C</text>
  <!-- L0 -->
  <circle class="blue" cx="125" cy="350" r="23"/><text class="nodeLabel" x="125" y="351">A</text>
  <circle class="red" cx="245" cy="350" r="23"/><text class="nodeLabel" x="245" y="351">B</text>
  <circle class="blue" cx="350" cy="350" r="23"/><text class="nodeLabel" x="350" y="351">C</text>
  <circle class="red" cx="485" cy="350" r="23"/><text class="nodeLabel" x="485" y="351">D</text>
  <circle class="red" cx="605" cy="350" r="23"/><text class="nodeLabel" x="605" y="351">E</text>
  <circle class="blue" cx="350" cy="445" r="23"/><text class="nodeLabel" x="350" y="446">F</text>

  <circle cx="48" cy="520" r="10" class="blue"/><text x="65" y="525" class="minor">蓝租户</text>
  <circle cx="145" cy="520" r="10" class="red"/><text x="162" y="525" class="minor">红租户</text>
  <path class="edge" d="M254 520 H302"/><text x="312" y="525" class="minor">层内双向边</text>
  <path class="same" d="M451 509 V531"/><text x="463" y="525" class="minor">同一向量跨层</text>
  <text x="25" y="570" class="minor">颜色只用于租户过滤示例；分层框区分层级，节点位置不表示距离。</text>
</svg>
