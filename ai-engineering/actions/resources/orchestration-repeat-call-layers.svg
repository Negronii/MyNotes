<text x="16" y="688" font-size="17" text-anchor="start" fill="#40546e">着色格：这一事件在该层留下了可核对的变化；“—”：该层没有变化。</text>
<text x="16" y="716" font-size="17" text-anchor="start" fill="#40546e">进展只看观察集合、验收阶段和计划约束是否变化，新的调用 ID 不算。</text>
<text x="16" y="744" font-size="17" text-anchor="start" fill="#40546e">五个事件共用同一运行 ID 和同一图 thread。</text>
<text x="16" y="772" font-size="17" text-anchor="start" fill="#40546e">“连续 2 轮”是本合成运行的停止门槛，不是通用默认值。</text>
