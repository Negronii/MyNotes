<svg xmlns="http://www.w3.org/2000/svg" width="700" height="750" viewBox="0 0 700 750" role="img" aria-labelledby="title desc">
  <title id="title">不可信日志诱导的两个提议怎样被应用拦住</title>
  <desc id="desc">从获准的 c1 诊断观察继续。模型受日志里的注入行影响，提出 c3 读取环境变量与 c4 向 deploy-config 创建无关工单；应用分别因工具本轮未开放、无该仓库写权且任务未要求而拒绝。两份拒绝按各自调用标识入账，真实读取和写入次数均为零；用户要求的缺陷单 c2 照常进入审批。应用只用账本里 c1 记录的诊断字段渲染答复。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#64748b"/></marker>
    <style>
      text {font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#172033}
      .head {font-size:20px;font-weight:650}
      .body {font-size:18px}
      .code {font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px}
      .flow {fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}
      .branch {fill:none;stroke:#64748b;stroke-width:2.4}
    </style>
  </defs>
  <rect width="700" height="750" fill="#ffffff"/>
  <rect x="56" y="20" width="588" height="120" rx="12" fill="#eff6ff" stroke="#5684c2" stroke-width="2"/>
  <text class="head" x="80" y="54">获准的观察 c1 已回到模型</text>
  <text class="body" x="80" y="90">build 42：预期 400，实际 200，退出状态 1</text>
  <text class="body" x="80" y="120">夹带的测试文字仍不可信，不改变任务和权限</text>
  <path class="branch" d="M350 140 V176 H180 M350 176 H520"/>
  <path class="flow" d="M180 176 V214"/><path class="flow" d="M520 176 V214"/>

  <rect x="24" y="216" width="312" height="112" rx="12" fill="#fff7ed" stroke="#bd8a2b" stroke-width="2"/>
  <text class="head" x="44" y="250">模型提议 c3</text>
  <text class="code" x="44" y="286">read_environment_variable</text>
  <text class="body" x="44" y="314">试图读取环境变量</text>
  <rect x="364" y="216" width="312" height="112" rx="12" fill="#fff7ed" stroke="#bd8a2b" stroke-width="2"/>
  <text class="head" x="384" y="250">模型提议 c4</text>
  <text class="code" x="384" y="286">create_issue</text>
  <text class="body" x="384" y="314">向 deploy-config 建无关工单</text>

  <path class="flow" d="M180 328 V388"/><path class="flow" d="M520 328 V388"/>
  <rect x="24" y="390" width="312" height="116" rx="12" fill="#fdf0ee" stroke="#bf6a49" stroke-width="2"/>
  <text class="head" x="44" y="424">第一关拒绝 c3</text>
  <text class="body" x="44" y="460">工具本轮未开放</text>
  <text class="body" x="44" y="488">环境变量读取次数：0</text>
  <rect x="364" y="390" width="312" height="116" rx="12" fill="#fdf0ee" stroke="#bf6a49" stroke-width="2"/>
  <text class="head" x="384" y="424">第二关拒绝 c4</text>
  <text class="body" x="384" y="460">无该仓库写权；任务也未要求</text>
  <text class="body" x="384" y="488">真实写端点调用数：0</text>

  <path class="branch" d="M180 506 V544 H350 M520 506 V544 H350"/>
  <path class="flow" d="M350 544 V582"/>
  <rect x="56" y="584" width="588" height="146" rx="12" fill="#edf7f3" stroke="#43856a" stroke-width="2"/>
  <text class="head" x="80" y="618">分别记录 c3 / c4 的拒绝；c2 照常待审</text>
  <text class="body" x="80" y="654">应用从账本里 c1 的记录取字段渲染答复：</text>
  <text class="body" x="80" y="686">“构建 42 的 reject_empty_name 预期 HTTP 400，</text>
  <text class="body" x="94" y="714">实际为 200。根因待核验。”</text>
</svg>
