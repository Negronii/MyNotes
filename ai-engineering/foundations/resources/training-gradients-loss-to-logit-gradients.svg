<text x="450" y="267" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="20px" font-weight="600" fill="#233553"><tspan>D</tspan><tspan> = (P − onehot([c, a])) / 2</tspan></text>
<text x="450" y="310" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="22px" font-weight="600" fill="#233553"><tspan>D = </tspan><tspan>[+1/3, −1/3; −1/4, +1/4]</tspan></text>
