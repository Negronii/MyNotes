<text x="109" y="57" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="20px" font-weight="600" fill="#233553" >Y：logits 2×2</text>
<text x="53" y="96" text-anchor="start" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="600" fill="#63748F" >位置</text>
<text x="131" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="400" fill="#63748F" >a</text>
<text x="184" y="96" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="400" fill="#63748F" >c</text>
<text x="53" y="133" text-anchor="start" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="600" fill="#63748F"><tspan>t</tspan><tspan baseline-shift="sub" font-size="15.2px">1</tspan></text>
<text x="131" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="400" fill="#233553" >ln2</text>
<text x="184" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="400" fill="#233553" >0</text>
<text x="53" y="169" text-anchor="start" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="600" fill="#63748F"><tspan>t</tspan><tspan baseline-shift="sub" font-size="15.2px">2</tspan></text>
<text x="131" y="169" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="400" fill="#233553" >0</text>
<text x="184" y="169" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="19px" font-weight="400" fill="#233553" >0</text>
<text x="329" y="57" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="20px" font-weight="600" fill="#233553" >P（a,c）与目标</text>
<text x="329" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="400" fill="#233553"><tspan>t</tspan><tspan baseline-shift="sub" font-size="14.4px">1</tspan><tspan>：[2/3, 1/3] → c</tspan></text>
<text x="329" y="141" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="400" fill="#233553"><tspan>t</tspan><tspan baseline-shift="sub" font-size="14.4px">2</tspan><tspan>：[1/2, 1/2] → a</tspan></text>
<text x="549" y="57" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="20px" font-weight="600" fill="#233553" >逐位置损失</text>
<text x="549" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="18px" font-weight="400" fill="#233553"><tspan x="549" dy="0px">−ln(1/3) = ln3</tspan><tspan x="549" dy="26.099999999999998px">−ln(1/2) = ln2</tspan><tspan x="549" dy="26.099999999999998px">两项取平均</tspan></text>
<text x="769" y="57" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="20px" font-weight="600" fill="#233553" >标量 L</text>
<text x="769" y="112" text-anchor="middle" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="23px" font-weight="600" fill="#233553"><tspan x="769" dy="0px">ln6 / 2</tspan><tspan x="769" dy="34.5px">≈ 0.895880</tspan></text>
