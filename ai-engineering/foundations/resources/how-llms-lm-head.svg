<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">最后位置如何变成词表 logits</title><desc id="desc">Final Norm 保持三行形状，末行与 8×258 词表权重相乘，得到每个 ID 一个 logit。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="440" fill="#FAFBFE"/><text x="450" y="40" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">T=3 · d=8 · N=258</text><rect x="28" y="82" width="168" height="214" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="112" y="113" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">最后层状态</text><rect x="58" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="75" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="92" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="109" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="126" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="143" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="160" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="177" y="139" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".9"/><rect x="58" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="75" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="92" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="109" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="126" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="143" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="160" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="177" y="156" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="58" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="75" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="92" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="109" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="126" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="143" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="160" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="177" y="173" width="13" height="13" rx="2" fill="#74A7DC" fill-opacity=".62"/><rect x="58" y="173" width="132" height="13" rx="3" fill="#A58BD1" stroke="#A58BD1" stroke-width="1"/><text x="112" y="266" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">3 × 8</text><path d="M201 188 L230 188" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="238" y="145" width="130" height="88" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="303.0" y="186.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">Final Norm</text><text x="303.0" y="211.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M373 188 L400 188" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="408" y="145" width="120" height="88" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="468.0" y="186.0" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">取第 3 行</text><text x="468.0" y="210.0" font-size="14" font-weight="