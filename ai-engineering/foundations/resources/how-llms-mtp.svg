<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" role="img" aria-labelledby="title desc"><title id="title">真实右移词元如何作为 MTP 下一步的输入</title><desc id="desc">V3 深度1的 h 与真实前序 embedding 分别归一化后拼接；两位置路径独立进入同一 MTP 模块，分别预测 t3 和 t4。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="750" fill="#FAFBFE"/><text x="450" y="38" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">DeepSeek-V3 · D=1 · 训练串 [abab,c,a,c]</text><rect x="40" y="70" width="150" height="66" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="115.0" y="108.78" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₁ = abab</text><rect x="250" y="70" width="150" height="66" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/><text x="325.0" y="108.78" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₂ = c</text><rect x="460" y="70" width="150" height="66" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="535.0" y="108.78" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₃ = a</text><rect x="670" y="70" width="150" height="66" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="745.0" y="108.78" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">t₄ = c</text><text x="450" y="166" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">主模型</text><rect x="35" y="184" width="205" height="75" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="137.5" y="218.5" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">h₁ → shared head</text><text x="137.5" y="243.5" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">预测真实 t₂ = c<