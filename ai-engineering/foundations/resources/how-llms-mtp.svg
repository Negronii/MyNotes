t-weight="400" text-anchor="middle" fill="#65748B">2d</text><path d="M349 611 L386 611" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="394" y="576" width="146" height="70" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="467.0" y="608.0" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">同一 MTP₁</text><text x="467.0" y="631.0" font-size="13" font-weight="400" text-anchor="middle" fill="#65748B">投影 → TRM₁</text><path d="M543 611 L579 611" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="587" y="576" width="200" height="70" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="687.0" y="608.0" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">shared head</text><text x="687.0" y="632.0" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">预测 t₄ = c</text><rect x="35" y="658" width="830" height="72" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/><text x="450" y="687" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">L<tspan baseline-shift="sub" font-size="72%">total</tspan> = L<tspan baseline-shift="sub" font-size="72%">next</tspan> + L<tspan baseline-shift="sub" font-size="72%">MTP</tspan></text><text x="450" y="715" font-size="15" font-weight="500" text-anchor="middle" fill="#27364D">L<tspan baseline-shift="sub" font-size="72%">MTP</tspan> 已含 λ · V3：前 10T token = 0.3；后 4.8T = 0.1</text></svg>