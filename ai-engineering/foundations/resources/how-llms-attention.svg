<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">双头因果注意力的局部计算与输出形状</title><desc id="desc">head 1 位置2的实际算例从未掩码分数经因果掩码、softmax 与 PV；两头再拼接、投影并加回原状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="610" fill="#FAFBFE"/><rect x="28" y="30" width="135" height="74" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="95.5" y="64.0" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">U</text><text x="95.5" y="90.0" font-size="16" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M167 67 L193 67" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="201" y="30" width="203" height="74" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="302" y="58" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">U × W<tspan baseline-shift="sub" font-size="72%">Q</tspan>, U × W<tspan baseline-shift="sub" font-size="72%">K</tspan>, U × W<tspan baseline-shift="sub" font-size="72%">V</tspan></text><text x="302" y="84" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">W: 8×8 each · 2 heads of 4</text><path d="M408 67 L421 67" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="429" y="30" width="151" height="74" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="504.5" y="64.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">RoPE(Q, K)</text><text x="504.5" y="89.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">V 不变</text><path d="M584 67 L608 67" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="616" y="30" width="254" height="74" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="743.0" y="64.0" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">Q, K, V</text><text x="743.0" y="89.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">每项 3 × 2 × 4</text><text x="450" y="142" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">head 1 · query 位置 2 · key 位置 1–3</text><rect x="28" y="174" width="254" height="104" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="155" y="198" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">Q<tspan baseline-shift="sub" font-size="72%">2,1</tspan> · K<tspan baseline-shift="sub" font-size="72%">1:3,1</tspan>ᵀ</text><text x="155" y="225" font-size="16" font-weight="500" text-anchor="middle" fill="#27364D">[2, 0, 4] ÷ √4</text><text x="155" y="252" font-size="16" font-weight="600" text-anchor="middle" fill="#6A5594">S<tspan baseline-shift="sub" font-size="72%">raw,2,:</tspan> = [1, 0, 2]</text><path d="M284 226 L319 226" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="326" y="174" width="254" height="104" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="453" y="198" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">S<tspan baseline-shift="sub" font-size="72%">2,:</tspan> = S<tspan baseline-shift="sub" font-size="72%">raw,2,:</tspan> + M<tspan baseline-shift="sub" font-size="72%">2,:</tspan></text><text x="453" y="225" font-size="16" font-weight="500" text-anchor="middle" fill="#9A5C58">M<tspan baseline-shift="sub" font-size="72%">2,:</tspan> = [0, 0, −∞]</text><text x="453" y="252" font-size="14" font-weight="600" text-anchor="middle" fill="#6A5594">[1, 0, 2] + M → [1, 0, −∞]</text><path d="M582 226 L617 226" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="624" y="174" width="246" height="104" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="747" y="201" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">P<tspan baseline-shift="sub" font-size="72%">2,:</tspan> = softmax(S<tspan baseline-shift="sub" font-size="72%">2,:</tspan>)</text><text x="747" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="#347E70">P<tspan baseline-shift="sub" font-size="72%">2,:</tspan> = [.731, .269, 0]</text><rect x="176" y="297" width="548" height="48" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="450" y="327" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">P<tspan baseline-shift="sub" font-size="72%">2,:</tspan> × V₁:₃ = Z<tspan baseline-shift="sub" font-size="72%">2,1</tspan> = [.731, .538, 0, 0]</text><text x="450" y="370" font-size="15" font-weight="500" text-anchor="middle" fill="#65748B">Q,K: 3 × 4 · Sraw,S,M,P: 3 × 3 · V,Z: 3 × 4</text><rect x="32" y="398" width="104" height="72" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="84.0" y="431.0" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">Z₁</text><text x="84.0" y="456.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">3 × 4</text><rect x="32" y="490" width="104" height="72" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="84.0" y="523.0" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">Z₂</text><text x="84.0" y="548.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">3 × 4</text><path d="M136 434 L170 434 L170 468 L188 468" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M136 526 L170 526 L170 492 L188 492" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="188" y="414" width="154" height="133" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="265" y="448" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">Concat(Z₁,Z₂)</text><text x="265" y="482" font-size="16" font-weight="500" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M342 480 L398 480" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="398" y="414" width="173" height="133" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="484" y="447" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">Concat(Z₁,Z₂) × W<tspan baseline-shift="sub" font-size="72%">O</tspan></text><text x="484" y="481" font-size="15" font-weight="500" text-anchor="middle" fill="#65748B">3 × 8 · 8 × 8</text><text x="484" y="516" font-size="16" font-weight="600" text-anchor="middle" fill="#347E70">O: 3 × 8</text><path d="M575 480 L620 480" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="642" cy="480" r="21" fill="#FFFFFF" stroke="#AB97C9" stroke-width="2.5"/><text x="642" y="489.52" font-size="28" font-weight="600" text-anchor="middle" fill="#27364D">+</text><rect x="590" y="385" width="104" height="52" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="642.0" y="408.0" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">X_b</text><text x="642.0" y="432.0" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M642 437 L642 456" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M663 480 L720 480" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="720" y="424" width="155" height="112" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="797.5" y="477.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">Y_b = X_b + O</text>