<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">生成新位置时按层续算 K/V cache 并检查停止条件</title><desc id="desc">选中 ID 后先判停；继续时嵌入新位置，当前层输入依次生成本层 Q/K/V、追加并读取本层缓存、完成 attention 与残差和 FFN 与残差，再把更新后的隐藏状态交给下一层。L 层完成后才预测下一个 ID 并回到同一停止判定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="700" fill="#FAFBFE"/><rect x="20" y="127" width="130" height="76" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="85.0" y="162.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">前缀 ID</text><text x="85.0" y="187.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">[257,99,97]</text><path d="M150 165 L185 165" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="185" y="127" width="180" height="76" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="275.0" y="162.0" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">Prefill · L 层</text><text x="275.0" y="186.0" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">各层缓存 K/V: [3,2,4]</text><path d="M365 165 L400 165" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="400" y="127" width="185" height="76" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/><text x="492.5" y="162.0" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">Final Norm → LM head</text><text x="492.5" y="186.0" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">选出 ID<tspan baseline-shift="sub" font-size="72%">4</tspan>=99</text><path d="M585 165 L620 165" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><polygon points="620,165 735,95 850,165 735,235" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="735" y="154" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">需要停止？</text><text x="735" y="175" font-size="14" font-weight="500" text-anchor="middle" fill="#27364D">EOS · stop · 上限</text><text x="735" y="195" font-size="14" font-weight="500" text-anchor="middle" fill="#27364D">或取消</text><path d="M735 95 L735 52" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="640" y="4" width="190" height="48" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="735.0" y="25.0" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">停止 → 解码已选 ID</text><text x="735.0" y="48.0" font-size="13" font-weight="400" text-anchor="middle" fill="#65748B">输出生成文本</text><path d="M735 235 L735 265 L95 265 L95 319" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="755" y="257" font-size="14" font-weight="500" text-anchor="start" fill="#65748B">继续：嵌入已选 ID</text><rect x="20" y="320" width="145" height="72" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="92.5" y="353.0" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">E[ID<tspan baseline-shift="sub" font-size="72%">t</tspan>] · 新位置 t</text><text x="92.5" y="376.0" font-size="13" font-weight="400" text-anchor="middle" fill="#65748B">首次 t=4，随后 t=5…</text><rect x="195" y="276" width="695" height="140" rx="12" fill="#FFFFFF" stroke="#BCC9D9" stroke-width="2"/><text x="542" y="299" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">对每层 ℓ=1…L 依次重复（沿用前文 pre-norm）</text><path d="M165 356 L205 356" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="205" y="320" width="110" height="72" 