ne-shift="super" font-size="72%">ℓ</tspan> → h<tspan baseline-shift="sub" font-size="72%">t</tspan><tspan baseline-shift="super" font-size="72%">ℓ+1</tspan></text><polygon points="790,445 865,492 790,539 715,492" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="790" y="488" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">ℓ &lt; L ?</text><text x="790" y="508" font-size="13" font-weight="500" text-anchor="middle" fill="#27364D">再进下一层？</text><path d="M805 400 L805 430 L790 445" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M715 492 L260 492 L260 389" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="465" y="483" font-size="14" font-weight="500" text-anchor="middle" fill="#65748B">是：ℓ←ℓ+1，带入 h<tspan baseline-shift="sub" font-size="72%">t</tspan><tspan baseline-shift="super" font-size="72%">ℓ+1</tspan></text><path d="M790 539 L790 574 L530 574 L530 612" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="808" y="564" font-size="14" font-weight="500" text-anchor="start" fill="#65748B">否：ℓ=L</text><rect x="420" y="612" width="220" height="66" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="530.0" y="642.0" font-size="16" font-weight="600" text-anchor="middle" fill="#27364D">Final Norm → LM head</text><text x="530.0" y="667.0" font-size="15" font-weight="400" text-anchor="middle" fill="#65748B">选出 ID<tspan baseline-shift="sub" font-size="72%">t+1</tspan></text><path d="M640 633 L885 633 L885 165 L850 165" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></svg>