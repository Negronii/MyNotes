<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">一个 block 的两次残差更新</title><desc id="desc">第一次把 Attention 输出 O 加到 Xb 得到 Yb；第二次把 SwiGLU 更新 Fb 加回 Yb，得到 Xb+1。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="490" fill="#FAFBFE"/><text x="450" y="40" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">单流 pre-norm block · 每次更新与当前状态相加</text><rect x="25" y="102" width="145" height="82" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="97.5" y="140.0" font-size="20" font-weight="600" text-anchor="middle" fill="#27364D">X<tspan baseline-shift="sub" font-size="72%">b</tspan></text><text x="97.5" y="167.0" font-size="17" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M175 143 L205 143" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="212" y="102" width="145" height="82" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="284.5" y="140.0" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">Norm₁</text><text x="284.5" y="167.0" font-size="17" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M362 143 L392 143" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="400" y="102" width="160" height="82" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="480.0" y="140.0" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">Attention<tspan baseline-shift="sub" font-size="72%">b</tspan></text><text x="480.0" y="166.0" font-size="16" font-weight="400" text-anchor="middle" fill="#65748B">O: 3 × 8</text><path d="M565 143 L590 143" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="615" cy="143" r="21" fill="#FFFFFF" stroke="#AB97C9" stroke-width="2.5"/><text x="615" y="152.52" font-size="28" font-weight="600" text-anchor="middle" fill="#27364D">+</text><path d="M639 143 L664 143" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="672" y="102" width="205" height="82" rx="12" fill="#EDF8F3" stroke="#C8E3D7" stroke-width="2"/><text x="774.5" y="140.0" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">Y<tspan baseline-shift="sub" font-size="72%">b</tspan> = X<tspan baseline-shift="sub" font-size="72%">b</tspan> + O</text><text x="774.5" y="166.0" font-size="16" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M97 188 L97 224 L615 224 L615 166" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="355" y="216" font-size="15" font-weight="500" text-anchor="middle" fill="#65748B">X<tspan baseline-shift="sub" font-size="72%">b</tspan> 残差旁路</text><path d="M774 184 L774 320" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="712" y="325" width="165" height="82" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="794.5" y="363.0" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">Norm₂</text><text x="794.5" y="390.0" font-size="17" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M707 366 L665 366" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="490" y="325" width="165" height="82" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/><text x="572.5" y="363.0" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">SwiGLU FFN</text><text x="572.5" y="389.0" font-size="16" font-weight="400" text-anchor="middle" fill="#65748B">F<tspan baseline-shift="sub" font-size="72%">b</tspan>: 3 × 8</text><path d="M485 366 L440 366" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="414" cy="366" r="21" fill="#FFFFFF" stroke="#AB97C9" stroke-width="2.5"/><text x="414" y="375.52" font-size="28" font-weight="600" text-anchor="middle" fill="#27364D">+</text><path d="M389 366 L350 366" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="145" y="325" width="200" height="82" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="245.0" y="363.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">X<tspan baseline-shift="sub" font-size="72%">b+1</tspan> = Y<tspan baseline-shift="sub" font-size="72%">b</tspan> + F<tspan baseline-shift="sub" font-size="72%">b</tspan></text><text x="245.0" y="389.0" font-size="16" font-weight="400" text-anchor="middle" fill="#65748B">3 × 8</text><path d="M774 184 L774 264 L414 264 L414 342" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="587" y="252" font-size="15" font-weight="500" text-anchor="middle" fill="#65748B">Y<tspan baseline-shift="sub" font-size="72%">b</tspan> 未归一化旁路</text></svg>