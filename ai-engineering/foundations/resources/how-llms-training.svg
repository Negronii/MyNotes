<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">右移标签如何形成主目标与梯度</title><desc id="desc">三位置完整词表训练、独立三类 logit 导数小例和完整 8×258 词表头矩阵梯度分开呈现；SGD 行只示意梯度如何进入参数更新。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="590" fill="#FAFBFE"/><text x="450" y="39" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">训练样本 · [abab, c, a, c]</text><rect x="35" y="70" width="160" height="72" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="115.0" y="112.12" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">t₁ = abab</text><rect x="250" y="70" width="160" height="72" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="330.0" y="112.12" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">t₂ = c</text><rect x="465" y="70" width="160" height="72" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="545.0" y="112.12" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">t₃ = a</text><rect x="680" y="70" width="160" height="72" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="760.0" y="112.12" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">t₄ = c</text><path d="M115 148 L115 177 L250 177 L250 150" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="182.5" y="203" font-size="15" font-weight="500" text-anchor="middle" fill="#27364D">位置1 → c</text><path d="M330 148 L330 177 L465 177 L465 150" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="397.5" y="203" font-size="15" font-weight="500" text-anchor="middle" fill="#27364D">位置2 → a</text><path d="M545 148 L545 177 L680 177 L680 150" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="612.5" y="203" font-size="15" font-weight="500" text-anchor="middle" fill="#27364D">位置3 → c</text><rect x="30" y="225" width="840" height="104" rx="12" fill="#FFFFFF" stroke="#DCD1EA" stroke-width="2"/><text x="450" y="260" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">N=258 · 全词表 softmax · 平均 next-token loss</text><text x="450" y="297" font-size="16" font-weight="500" text-anchor="middle" fill="#27364D">L = [−log p(c|abab) − log p(a|abab,c) − log p(c|abab,c,a)] / 3</text><rect x="30" y="355" width="300" height="196" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="180" y="388" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">局部导数 · 3 类</text><text x="180" y="421" font-size="16" font-weight="500" text-anchor="middle" fill="#27364D">p=[.7,.2,.1] · y=2</text><text x="180" y="461" font-size="16" font-weight="500" text-anchor="middle" fill="#27364D">δ = p − onehot(y)</text><text x="180" y="505" font-size="17" font-weight="600" text-anchor="middle" fill="#6A5594">[.7, −.8, .1]</text><rect x="350" y="355" width="520" height="196" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="610" y="387" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">主配置 · 完整词表</text><text x="610" y="418" font-size="16" font-weight="500" text-anchor="middle" fill="#27364D">H: 3×8   ·   Δ: 3×258</text><text x="610" y="447" font-size="15" font-weight="500" text-anchor="middle" fill="#27364D">Z = H W<tspan baseline-shift="sub" font-size="72%">LM</tspan>   ·   Δᵢ = pᵢ − onehot(yᵢ)</text><text x="610" y="479" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">∇W<tspan baseline-shift="sub" font-size="72%">LM</tspan> = HᵀΔ / 3   →   8×258</text><text x="610" y="511" font-size="16" font-weight="500" text-anchor="middle" fill="#27364D">∇H = Δ W<tspan baseline-shift="sub" font-size="72%">LM</tspan>ᵀ / 3   →   3×8</text><text x="610" y="537" font-size="15" font-weight="500" text-anchor="middle" fill="#347E70">W<tspan baseline-shift="sub" font-size="72%">LM</tspan> ← W<tspan baseline-shift="sub" font-size="72%">LM</tspan> − η∇W<tspan baseline-shift="sub" font-size="72%">LM</tspan></text></svg>