<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">mHC 的读取、残差混合与更新写回</title><desc id="desc">X 是 A 与 B 的状态操作数；单独的 A、B、C 矩阵输入各自进入乘法，B X 与 C u 两个结果相加。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8396B0"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27364D}</style></defs><rect x="0" y="0" width="900" height="650" fill="#FAFBFE"/><text x="450" y="32" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">两流教学算例 · 行是残差流，列为特征</text><rect x="25" y="105" width="150" height="90" rx="12" fill="#EEF5FE" stroke="#CDE0F4" stroke-width="2"/><text x="100.0" y="147.0" font-size="19" font-weight="600" text-anchor="middle" fill="#27364D">X<tspan baseline-shift="sub" font-size="72%">l</tspan></text><text x="100.0" y="173.0" font-size="16" font-weight="400" text-anchor="middle" fill="#65748B">[[1,2],[3,0]]</text><path d="M175 150 L195 150" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 150 L245 150 L270 194" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M195 150 L195 430 L270 430" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="220" y="42" width="145" height="72" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="292.5" y="75.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">A<tspan baseline-shift="sub" font-size="72%">l</tspan></text><text x="292.5" y="99.0" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">[.5,.5] · 矩阵 1×2</text><path d="M292 114 L292 192" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="290" cy="215" r="22" fill="#FFFFFF" stroke="#AB97C9" stroke-width="2.5"/><text x="290" y="222.82" font-size="23" font-weight="600" text-anchor="middle" fill="#27364D">×</text><path d="M313 215 L325 215" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="325" y="177" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#DAE3EF" stroke-width="2"/><text x="400.0" y="212.0" font-size="17" font-weight="600" text-anchor="middle" fill="#27364D">A<tspan baseline-shift="sub" font-size="72%">l</tspan> X<tspan baseline-shift="sub" font-size="72%">l</tspan></text><text x="400.0" y="236.0" font-size="14" font-weight="400" text-anchor="middle" fill="#65748B">1×2 = [2,1]</text><path d="M475 215 L500 215" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="500" y="177" width="190" height="76" rx="12" fill="#FFF5E7" stroke="#E9D6B5" stroke-width="2"/><text x="595.0" y="212.0" font-size="15" font-weight="600" text-anchor="middle" fill="#27364D">整段子层 F<tspan baseline-shift="sub" font-size="72%">l</tspan></text><text x="595.0" y="235.0" font-size="13" font-weight="400" text-anchor="middle" fill="#65748B">取第 t 行 u<tspan baseline-shift="sub" font-size="72%">l,t</tspan>=[.1,−.2]</text><text x="450" y="273" font-size="14" font-weight="500" text-anchor="middle" fill="#65748B">图仅画当前位置的读出；其余位置省略</text><rect x="220" y="294" width="145" height="78" rx="12" fill="#F5F1FB" stroke="#DCD1EA" stroke-width="2"/><text x="292" y="320" font-size="18" font-weight="600" text-anchor="middle" fill="#27364D">B<tspan baseline-shift="sub" font-size="72%">l</tspan></text><text x="292" y="344" font-size="14" font-weight="500" text-anchor="middle" fill="#65748B">矩阵 2×2</text><text x="292" y="363" font-size="13" font-weight="500" text-anchor="middle" fill="#27364D">[[.75,.25],[.25,.75]]</text><path d="M292 372 L292 408" fill="none" stroke="#8396B0" stroke-width="3" stroke-linecap="round" marker-end="url