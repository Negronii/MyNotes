<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270" role="img" aria-labelledby="title"><title id="title">中段手册变化后，相同后段不能继续算入共同前缀</title><style>text{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#20334d;font-size:16px} .row{font-weight:600} .same{fill:#eaf6ef;stroke:#79aa8a} .diff{fill:#fff0e5;stroke:#d49062} .suffix{fill:#f2f4f7;stroke:#9aa8b7;stroke-dasharray:5 4} rect{stroke-width:1.5} .brace{fill:none;stroke:#417252;stroke-width:2}</style><rect width="700" height="270" rx="12" fill="#f7f9fc" stroke="none"/><text x="201.0" y="28" text-anchor="middle">相同前段</text><text x="414.0" y="28" text-anchor="middle">存在差异</text><text x="597.0" y="28" text-anchor="middle">相同后段</text><text class="row" x="14" y="79">输入 A</text><rect class="same" x="86" y="49" width="230" height="48" rx="7"/><text x="201.0" y="79" text-anchor="middle">应用指令 + 当前问题</text><rect class="diff" x="344" y="49" width="140" height="48" rx="7"/><text x="414.0" y="79" text-anchor="middle">CI 手册 v2</text><rect class="suffix" x="512" y="49" width="170" height="48" rx="7"/><text x="597.0" y="79" text-anchor="middle">历史 c1</text><text class="row" x="14" y="167">输入 B</text><rect class="same" x="86" y="137" width="230" height="48" rx="7"/><text x="201.0" y="167" text-anchor="middle">应用指令 + 当前问题</text><rect class="diff" x="344" y="137" width="140" height="48" rx="7"/><text x="414.0" y="167" text-anchor="middle">CI 手册 v3</text><rect class="suffix" x="512" y="137" width="170" height="48" rx="7"/><text x="597.0" y="167" text-anchor="middle">历史 c1</text><path class="brace" d="M86 204 V216 H316 V204"/><text x="201" y="244" text-anchor="middle">这部分完整相同</text></svg>
