<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc"><title id="title">在 L1 插入 X=(3.4,0)：多样化选邻与 B 的重筛</title><desc id="desc">按真实横坐标画出 C(1)、B(3)、X(3.4)、A(6)，纵坐标都为 0。插入前 A、B、C 两两相邻的边双向可走。X 选邻时先接受 B；C 到 B 的距离 2 不大于到 X 的 2.4，跳过；A 到 B 的距离 3 大于 2.6，接受。插入后 B 超容量重筛，保留 X 和 C，剪掉 B→A；A→B 仍在。上方弧是向右的边，下方弧是向左的边。</desc><defs>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#486782"/></marker>
<marker id="ahR" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker>
