<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240" role="img" aria-labelledby="title"><title id="title">删除末尾无关对话后，前缀保持不变</title><style>text{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#20334d;font-size:16px} .row{font-weight:600} .same{fill:#eaf6ef;stroke:#79aa8a} .diff{fill:#fff0e5;stroke:#d49062} .suffix{fill:#f2f4f7;stroke:#9aa8b7;stroke-dasharray:5 4} rect{stroke-width:1.5} .brace{fill:none;stroke:#417252;stroke-width:2}</style><rect width="700" height="240" rx="12" fill="#f7f9fc" stroke="none"/><text class="row" x="14" y="58">裁剪前</text><rect class="same" x="86" y="28" width="100" height="48" rx="7"/><text x="136.0" y="58" text-anchor="middle">应用指令</text><rect class="same" x="204" y="28" width="100" height="48" rx="7"/><text x="254.0" y="58" text-anchor="middle">当前问题</text><rect class="same" x="322" y="28" width="100" height="48" rx="7"/><text x="372.0" y="58" text-anchor="middle">CI 手册 v3</text><rect class="same" x="440" y="28" width="100" height="48" rx="7"/><text x="490.0" y="58" text-anchor="middle">历史 c1</text><rect class="suffix" x="558" y="28" width="124" height="48" rx="7"/><text x="620.0" y="58" text-anchor="middle">无关旧对话</text><text class="row" x="14" y="142">裁剪后</text><rect class="same" x="86" y="112" width="100" height="48" rx="7"/><text x="136.0" y="142" text-anchor="middle">应用指令</text><rect class="same" x="204" y="112" width="100" height="48" rx="7"/><text x="254.0" y="142" text-anchor="middle">当前问题</text><rect class="same" x="322" y="112" width="100" height="48" rx="7"/><text x="372.0" y="142" text-anchor="middle">CI 手册 v3</text><rect class="same" x="440" y="112" width="100" height="48" rx="7"/><text x="490.0" y="142" text-anchor="middle">历史 c1</text><text x="620" y="142" text-anchor="middle">不再传入</text><path class="brace" d="M86 178 V190 H540 V178"/><text x="313" y="216" text-anchor="middle">仍连续相同的前缀</text></svg>
