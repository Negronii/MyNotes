  <text x="585" y="107" font-size="28" font-weight="500" text-anchor="middle">h<tspan baseline-shift="-7px" font-size="70%">last</tspan>
  </text>
  <path class="edge" d="M585 220 L585 287" />
  <rect x="395" y="306" width="380" height="140" rx="14" fill="#FFF" stroke="#DAE3EF" stroke-width="2" />
  <text x="585" y="351" font-size="28" font-weight="500" text-anchor="middle">h = Norm(h<tspan baseline-shift="-7px" font-size="70%">last</tspan>)</text>
  <text x="585" y="418" font-size="25" font-weight="400" text-anchor="middle" style="fill:#27364D">1 × 8</text>
  <path class="edge" d="M585 465 L585 530" />
  <rect x="345" y="550" width="480" height="190" rx="12" fill="#F5F0FB" stroke="#DCD0EC" stroke-width="2" />
  <text x="585" y="588" font-size="28" font-weight="600" text-anchor="middle" style="fill:#27364D">LM head</text>
  <text x="585" y="639" font-size="30" font-weight="500" text-anchor="middle">z = h · W<tspan baseline-shift="-7px" font-size="70%">LM</tspan>
  </text>
  <text x="585" y="706" font-size="25" font-weight="400" text-anchor="middle" style="fill:#27364D">(1 × 8) · (8 × N) = 1 × N</text>
  <path class="edge" d="M585 760 L585 825" />
  <rect x="425" y="845" width="320" height="80" rx="12" fill="#FFF5E5" stroke="#EAD7B5" stroke-width="2" />
  <text x="585" y="880" font-size="28" font-weight="600" text-anchor="middle" style="fill:#27364D">Logits  z</text>
  <text x="585" y="912" font-size="25" font-weight="400" text-anchor="middle" style="fill:#27364D">1 × N</text>
</svg>