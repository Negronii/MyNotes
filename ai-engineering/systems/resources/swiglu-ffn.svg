<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1000" viewBox="0 0 860 1000" role="img" aria-labelledby="title desc">
  <title id="title">SwiGLU FFN 怎样逐行生成更新</title>
  <desc id="desc">第二次Norm后的4×8输入分别乘8×16的门控和特征矩阵。门控分支经SiLU后与特征分支逐元素相乘，保持4×16，再乘16×8矩阵得到4×8更新。此处未含残差相加。</desc>
