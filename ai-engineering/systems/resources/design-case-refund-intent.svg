<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" role="img" aria-label="完整退款方案获得确认后，按订单串行核验、一次消费确认并保存READY；条件记发送意图后发送，中断仍可恢复">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7086a3"/></marker></defs>
<rect width="900" height="1030" rx="14" fill="#f7f9fc"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24364c">
<rect x="80" y="25" width="740" height="140" rx="12" fill="#eef5ff" stroke="#cbddf4" stroke-width="2"/>
<text x="450.0" y="60" text-anchor="middle" font-size="25" font-weight="600">Q-204：待确认的不可变方案</text>
<text x="450.0" y="98" text-anchor="middle" font-size="23">订单 O-73 · 原 Charge P-73 · 20.00 USD</text>
<text x="450.0" y="130" text-anchor="middle" font-size="23">客户与订单、当前退款资格已经核验</text>
<path d="M450,176 L450,219" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="470" y="205" text-anchor="start" font-size="22">客户明确确认该版本</text>
<rect x="80" y="235" width="740" height="175" rx="12" fill="#f4effb" stroke="#daccf1" stroke-width="2"/>
<text x="450.0" y="270" text-anchor="middle" font-size="25" font-weight="600">确认事务：锁住同一订单行，再核验</text>
<text x="450.0" y="308" text-anchor="middle" font-size="23">检查资格与未结束操作；未知结果也占位</text>
<text x="450.0" y="340" text-anchor="middle" font-size="23">重复 Q 返回原 R；条件不满足 → 不发送</text>
<text x="450.0" y="372" text-anchor="middle" font-size="23">只消费一次 Q-204，与下一框一起提交</text>
<path d="M450,422 L450,467" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="482" width="740" height="175" rx="12" fill="#f4effb" stroke="#daccf1" stroke-width="2"/>
<text x="450.0" y="517" text-anchor="middle" font-size="25" font-weight="600">同一事务：保存 R-204 / READY 与请求身份</text>
<text x="450.0" y="555" text-anchor="middle" font-size="23">账户 + charge=P-73 + amount=2000</text>
<text x="450.0" y="587" text-anchor="middle" font-size="23">metadata: operation_id=R-204 · Key=K-R204</text>
<text x="450.0" y="619" text-anchor="middle" font-size="23">本地方案币种 usd 用于确认与结果核对</text>
<path d="M450,669 L450,714" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="470" y="697" text-anchor="start" font-size="22">事务提交成功后</text>
<rect x="80" y="730" width="740" height="176" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="450.0" y="765" text-anchor="middle" font-size="25" font-weight="600">发送器：条件改为 SUBMITTED</text>
<text x="450.0" y="803" text-anchor="middle" font-size="23">持久化首次发送意图时间 → 提交 → 发请求</text>
<text x="450.0" y="835" text-anchor="middle" font-size="23">READY 留存：重启后仍可扫描发送</text>
<text x="450.0" y="867" text-anchor="middle" font-size="23">SUBMITTED 长期未决 / 超时 / 500 → 核对</text>
<text x="450" y="957" text-anchor="middle" font-size="22">SUBMITTED 是意图，不证明网络送达或退款成功。</text>
<text x="450" y="994" text-anchor="middle" font-size="22">本例每订单最多一个未结束操作；实际 POST 字段见正文。</text>
</g>
</svg>
