<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img" aria-label="build 42 代码根因调查：两个独立只读任务并行，主运行校验同一提交后形成有来源结论，人工审批后应用才创建工单">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#345A78"/>
    </marker>
    <style>
      .text { font-family: sans-serif; fill: #17324D; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 15px; }
      .arrow { fill: none; stroke: #345A78; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 16; }
    </style>
  </defs>
  <rect width="700" height="1000" fill="#FFFFFF"/>

  <rect class="box" x="125" y="28" width="450" height="86" fill="#EAF3FB" stroke="#6E9CC2"/>
  <text class="text label" x="350" y="57" text-anchor="middle">P2 输入：同一主运行中的状态</text>
  <text class="text body" x="350" y="84" text-anchor="middle">run-r42-7 · c2：预期 400，实际 200</text>
  <text class="text body" x="350" y="104" text-anchor="middle">用户已追加“查代码根因”</text>

  <path class="arrow" d="M350 114 L350 146"/>
  <rect class="box" x="105" y="146" width="490" height="78" fill="#FFF5DD" stroke="#D5A23A"/>
  <text class="text label" x="350" y="176" text-anchor="middle">应用限定只读来源与版本</text>
  <text class="text body" x="350" y="205" text-anchor="middle">build 42 · target commit a17d92e</text>

  <path class="arrow" d="M350 224 L350 246 L180 246 L180 270"/>
  <path class="arrow" d="M350 246 L520 246 L520 270"/>
  <rect class="box" x="28" y="270" width="304" height="126" fill="#EAF6EF" stroke="#69A483"/>
  <text class="text label" x="180" y="300" text-anchor="middle">只读任务 A · 测试契约</text>
  <text class="text small" x="180" y="329" text-anchor="middle">tests/test_reject_empty_name.py</text>
  <text class="text body" x="180" y="357" text-anchor="middle">name="" → 预期 HTTP 400</text>
  <text class="text small" x="180" y="382" text-anchor="middle">只报告原文与断言</text>

  <rect class="box" x="368" y="270" width="304" height="126" fill="#F3EFFB" stroke="#9A87C6"/>
  <text class="text label" x="520" y="300" text-anchor="middle">只读任务 B · 同提交差异</text>
  <text class="text small" x="520" y="329" text-anchor="middle">旧：name is None or not name.strip()</text>
  <text class="text body" x="520" y="357" text-anchor="middle">新：name is None</text>
  <text class="text small" x="520" y="382" text-anchor="middle">空 / 纯空白：旧拒绝，新放行</text>

  <path class="arrow" d="M180 396 L180 428 L350 428 L350 453"/>
  <path class="arrow" d="M520 396 L520 428 L350 428 L350 453"/>
  <rect class="box" x="100" y="453" width="500" height="112" fill="#FFF0E6" stroke="#D68142"/>
  <text class="text label" x="350" y="483" text-anchor="middle">主运行汇合并核对证据</text>
  <text class="text body" x="350" y="512" text-anchor="middle">A、B 与构建目标都指向 a17d92e？</text>
  <text class="text body" x="350" y="540" text-anchor="middle">同版本差异能解释 c2 的 200？</text>

  <path class="arrow" d="M350 565 L350 590 L177 590 L177 617"/>
  <path class="arrow" d="M350 590 L523 590 L523 617"/>
  <text class="text small" x="205" y="587" text-anchor="middle" fill="#8D4D43">否</text>
  <text class="text small" x="495" y="587" text-anchor="middle" fill="#397451">是</text>
  <rect class="box" x="28" y="617" width="304" height="132" fill="#F8ECEB" stroke="#C98279"/>
  <text class="text label" x="180" y="647" text-anchor="middle">证据不足以确认根因</text>
  <text class="text small" x="180" y="676" text-anchor="middle">版本不符 / 差异未解释 200</text>
  <text class="text small" x="180" y="696" text-anchor="middle">保留 c2；最多补证一次</text>
  <text class="text small" x="180" y="716" text-anchor="middle">仍无法确认：根因未知</text>
  <text class="text small" x="180" y="738" text-anchor="middle">草稿可写未知→P3；否则停止</text>

  <rect class="box" x="368" y="617" width="304" height="108" fill="#EAF6EF" stroke="#69A483"/>
  <text class="text label" x="520" y="647" text-anchor="middle">两来源与 c2 对上</text>
  <text class="text body" x="520" y="676" text-anchor="middle">支持这条测试失败的直接原因</text>
  <text class="text small" x="520" y="704" text-anchor="middle">结论限于本测试与本提交</text>

  <path class="arrow" d="M520 725 L520 762"/>
  <path class="arrow" d="M180 749 L180 755 L350 755 L350 810 L368 810"/>
  <rect class="box" x="368" y="762" width="304" height="96" fill="#EAF3FB" stroke="#6E9CC2"/>
  <text class="text label" x="520" y="792" text-anchor="middle">P3 · 形成有来源的草稿</text>
  <text class="text body" x="520" y="821" text-anchor="middle">人工审核准确的草稿版本</text>
  <text class="text small" x="520" y="846" text-anchor="middle">拒绝：P3 停止；不进入 P4</text>

  <path class="arrow" d="M520 858 L520 891"/>
  <text class="text small" x="418" y="879" text-anchor="middle">批准且权限仍有效</text>
  <rect class="box" x="368" y="891" width="304" height="88" fill="#FFF5DD" stroke="#D5A23A"/>
  <text class="text label" x="520" y="920" text-anchor="middle">P4 · 应用执行已批准写入</text>
  <text class="text small" x="520" y="947" text-anchor="middle">重新核权限；结果未知按原键对账</text>
  <text class="text small" x="520" y="970" text-anchor="middle">不另造操作键重试</text>
</svg>
