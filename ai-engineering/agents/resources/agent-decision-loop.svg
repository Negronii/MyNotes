<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-label="build 42 首轮日志读取经过运行时核验，模型检查观察后答复或提出新一轮只读请求">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#345A78"/>
    </marker>
    <style>
      .text { font-family: sans-serif; fill: #17324D; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 15px; }
      .arrow { fill: none; stroke: #345A78; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 16; }
    </style>
  </defs>
  <rect width="760" height="900" fill="#FFFFFF"/>

  <rect class="box" x="180" y="28" width="340" height="66" fill="#EAF3FB" stroke="#6E9CC2"/>
  <text class="text label" x="350" y="54" text-anchor="middle">用户目标</text>
  <text class="text body" x="350" y="78" text-anchor="middle">解释 build 42 为什么失败</text>

  <path class="arrow" d="M350 94 L350 126"/>
  <rect class="box" x="120" y="126" width="460" height="76" fill="#EAF3FB" stroke="#6E9CC2"/>
  <text class="text label" x="350" y="155" text-anchor="middle">模型提出下一步</text>
  <text class="text body" x="350" y="182" text-anchor="middle">首轮示例：read_build_log(build_id=42)</text>

  <path class="arrow" d="M350 202 L350 242"/>
  <rect class="box" x="100" y="242" width="500" height="98" fill="#FFF5DD" stroke="#D5A23A"/>
  <text class="text label" x="350" y="270" text-anchor="middle">运行时授权与执行门</text>
  <text class="text body" x="350" y="298" text-anchor="middle">核对调用者、参数、资源范围与预算</text>
  <text class="text small" x="350" y="323" text-anchor="middle">通过后才执行；否则拒绝、等待审批或停止</text>

  <path class="arrow" d="M350 340 L350 380"/>
  <text class="text small" x="370" y="365" text-anchor="start">通过</text>
  <path class="arrow" d="M100 291 L50 291 L50 362"/>
  <rect class="box" x="25" y="374" width="150" height="66" fill="#F8ECEB" stroke="#C98279"/>
  <text class="text small" x="100" y="401" text-anchor="middle">拒绝 / 等待审批</text>
  <text class="text small" x="100" y="425" text-anchor="middle">不调用工具</text>
  <rect class="box" x="205" y="380" width="290" height="64" fill="#F1F4F7" stroke="#9AA9B6"/>
  <text class="text label" x="350" y="408" text-anchor="middle">工具执行本轮只读请求</text>
  <text class="text body" x="350" y="432" text-anchor="middle">首轮：读取 build 42 日志</text>

  <path class="arrow" d="M350 444 L350 482"/>
  <rect class="box" x="75" y="482" width="550" height="112" fill="#FFF0E6" stroke="#D68142"/>
  <text class="text label" x="350" y="509" text-anchor="middle">运行时保存本轮观察与调用 ID</text>
  <text class="text body" x="350" y="536" text-anchor="middle">首轮 c1：unit-tests · reject_empty_name</text>
  <text class="text body" x="350" y="560" text-anchor="middle">expected 400 · actual 200</text>
  <text class="text body" x="350" y="584" text-anchor="middle">unit-tests exit status 1</text>

  <path class="arrow" d="M350 594 L350 624"/>
  <rect class="box" x="120" y="624" width="460" height="76" fill="#EAF3FB" stroke="#6E9CC2"/>
  <text class="text label" x="350" y="653" text-anchor="middle">模型将观察与用户目标比较</text>
  <text class="text body" x="350" y="680" text-anchor="middle">提出回答、澄清，或新一轮工具请求</text>

  <path class="arrow" d="M350 700 L350 724 L180 724 L180 750"/>
  <path class="arrow" d="M350 724 L520 724 L520 750"/>
  <rect class="box" x="30" y="750" width="300" height="104" fill="#EAF6EF" stroke="#69A483"/>
  <text class="text label" x="180" y="780" text-anchor="middle">证据已足够回答当前目标</text>
  <text class="text body" x="180" y="808" text-anchor="middle">首轮：报告 400 / 200 与退出 1</text>
  <text class="text body" x="180" y="834" text-anchor="middle">模型提出答复；运行时交付或停止</text>

  <rect class="box" x="370" y="750" width="300" height="104" fill="#F3EFFB" stroke="#9A87C6"/>
  <text class="text label" x="520" y="780" text-anchor="middle">当前目标仍有证据缺口</text>
  <text class="text body" x="520" y="808" text-anchor="middle">根因请求：c1 还缺代码证据</text>
  <text class="text small" x="520" y="834" text-anchor="middle">有获准来源则补查；否则说明缺口</text>

  <path d="M670 802 L750 802 L750 164 L584 164" fill="none" stroke="#8B72B5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="text small" x="646" y="490" text-anchor="start" fill="#604C83">下一轮</text>
  <text class="text small" x="646" y="512" text-anchor="start" fill="#604C83">新只读</text>
  <text class="text small" x="646" y="534" text-anchor="start" fill="#604C83">证据请求</text>
</svg>
