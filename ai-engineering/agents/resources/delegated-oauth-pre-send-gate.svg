<path id="edge-v-no" class="flow" d="M420 148H490"/>
<text class="edge-label" x="455" y="141">否</text>
<path id="edge-v-yes-preview" class="flow" d="M225 186V215"/>
<text class="edge-label" x="248" y="202">是</text>
<path id="edge-preview-approval" class="flow" d="M225 287V315"/>
<path id="edge-approval-no" class="flow" d="M420 347H490"/>
<text class="edge-label" x="455" y="340">拒绝</text>
<path id="edge-approval-yes" class="flow" d="M225 379V415"/>
<text class="edge-label" x="248" y="400">批准</text>
<path id="edge-refresh-cancel" class="flow" d="M420 435H490"/>
<text class="edge-label" x="455" y="427">取消</text>
<path id="edge-refresh-stale" class="flow" d="M420 475H455V500H490"/>
<text class="edge-label" x="455" y="466">失效/不匹配</text>
<path id="edge-refresh-pass" class="flow" d="M225 493V520"/>
<text class="edge-label" x="248" y="508">通过</text>
<path id="edge-lease-fail" class="flow" d="M420 559H455V573H490"/>
<text class="edge-label" x="455" y="552">否</text>
<path id="edge-lease-pass" class="flow" d="M225 598V625"/>
<text class="edge-label" x="248" y="614">是</text>
<path id="edge-persist-output" class="flow" d="M225 695V730"/>
</svg>
