<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
<title id="title">c1 的运行时与 resource 令牌检查</title><desc id="desc">host runtime 放行模型提出的 c1 后，MCP client 携带面向日志 resource 的 T_mcp 发 tools/call。runtime、协议/传输或未恢复的令牌失败都交给图 3；令牌通过后把同一 c1 交给图 2b。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71839d"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26364e;text-anchor:middle;font-size:18px}.small{font-size:16px}.edge-label{font-size:16px;fill:#526782;paint-order:stroke;stroke:#f8faff;stroke-width:6px;stroke-linejoin:round}.box{stroke-width:1.5;rx:12}.flow{fill:none;stroke:#71839d;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="700" height="500" rx="12" fill="#f8faff"/>
<g id="R" data-old-node="R"><rect class="box" x="30" y="25" width="390" height="70" fill="#fff6e7" stroke="#e8d2aa"/>
<text class="small" x="240.0" y="55.44">host runtime 放行这次 c1？</text>
<text class="small" x="240.0" y="75.44">用户、run、build 42 与工具策略</text>
</g>
<g id="FAIL_RUNTIME" data-old-node="FAIL_RUNTIME"><rect class="box" x="485" y="32" width="190" height="58" fill="#f3effb" stroke="#d6c7ee"/>
<text class="small" x="582.5" y="56.44">拒绝 → c1 失败</text>
<text class="small" x="582.5" y="76.44">交图 3</text>
</g>
<g id="CALL" data-old-node="CALL"><rect class="box" x="30" y="150" width="390" height="70" fill="#eef5ff" stroke="#c7daf5"/>
<text class="small" x="240.0" y="180.44">MCP client 发 tools/call</text>
<text class="small" x="240.0" y="200.44">携带面向该 resource 的 T_mcp</text>
</g>
<g id="FAIL_TRANSPORT" data-old-node="FAIL_TRANSPORT"><rect class="box" x="485" y="144" width="190" height="82" fill="#f3effb" stroke="#d6c7ee"/>
<text class="small" x="580" y="170.44">协议 / 传输失败</text>
<text class="small" x="580" y="190.44">作为 c1 终态</text>
<text class="small" x="580" y="210.44">交图 3；保留来源</text>
</g>
<g id="AUTH" data-old-node="AUTH"><rect class="box" x="30" y="275" width="390" height="70" fill="#fff6e7" stroke="#e8d2aa"/>
<text class="small" x="240.0" y="315.44">server 接受本 resource 的令牌？</text>
</g>
<g id="FAIL_AUTH" data-old-node="FAIL_AUTH"><rect class="box" x="485" y="278" width="190" height="68" fill="#f3effb" stroke="#d6c7ee"/>
<text class="small" x="582.5" y="307.44">401 未恢复授权</text>
<text class="small" x="582.5" y="327.44">c1 失败 → 图 3</text>
</g>
<g id="OK" data-old-node="OK"><rect class="box" x="30" y="395" width="390" height="60" fill="#edf7f3" stroke="#b9d9cc"/>
<text class="small" x="240.0" y="430.44">令牌通过；同一 c1 → 图 2b</text>
</g>
<path id="edge-runtime-allow" class="flow" d="M225 95V150"/>
<text class="edge-label" x="260" y="127">是</text>
<path id="edge-runtime-deny" class="flow" d="M420 60H485"/>
<text class="edge-label" x="452" y="43">否</text>
<path id="edge-call-response" class="flow" d="M225 220V275"/>
<path id="edge-call-error" class="flow" d="M420 185H485"/>

<path id="edge-token-accepted" class="flow" d="M225 345V395"/>
<text class="edge-label" x="260" y="373">是</text>
<path id="edge-token-denied" class="flow" d="M420 310H485"/>
<text class="edge-label" x="452" y="294">否</text>
</svg>
