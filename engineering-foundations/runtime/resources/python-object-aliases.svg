<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">Report 实例及其行数据中的对象引用</title>
  <desc id="desc">report 指向 Report 实例。source_rows、report.rows 和 rows_alias 指向同一列表 list A；copied_rows 是 copy() 新建的外层列表，但它的第 0 项与 list A 的第 0 项是同一个事件字典，字典的 tags 指向同一个列表。最后 rows_alias = [] 只改绑这一个名字。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#344054"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172033; }
    .label { font-size: 18px; font-weight: 600; }
    .boxhead { font-size: 19px; font-weight: 700; }
    .detail { font-size: 17px; font-weight: 400; }
    .note { font-size: 16px; fill: #475467; }
    .arrow { stroke: #344054; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="700" height="420" fill="#ffffff"/>

  <rect x="18" y="45" width="150" height="42" rx="9" fill="#e9f2ff" stroke="#5276a7" stroke-width="1.5"/>
  <text class="label" x="93" y="72" text-anchor="middle">report</text>
  <rect x="18" y="160" width="150" height="42" rx="9" fill="#e9f2ff" stroke="#5276a7" stroke-width="1.5"/>
  <text class="label" x="93" y="187" text-anchor="middle">source_rows</text>
  <rect x="18" y="214" width="150" height="42" rx="9" fill="#e9f2ff" stroke="#5276a7" stroke-width="1.5"/>
  <text class="label" x="93" y="241" text-anchor="middle">rows_alias</text>
  <rect x="18" y="300" width="150" height="42" rx="9" fill="#e9f2ff" stroke="#5276a7" stroke-width="1.5"/>
  <text class="label" x="93" y="327" text-anchor="middle">copied_rows</text>

  <rect x="210" y="20" width="180" height="104" rx="11" fill="#f2edff" stroke="#7862a8" stroke-width="1.6"/>
  <text class="boxhead" x="300" y="48" text-anchor="middle">Report 实例</text>
  <text class="detail" x="226" y="78">title: November</text>
  <text class="detail" x="226" y="108">rows → list A</text>

  <rect x="210" y="170" width="180" height="76" rx="11" fill="#e9f6ef" stroke="#528266" stroke-width="1.6"/>
  <text class="boxhead" x="300" y="200" text-anchor="middle">list A</text>
  <text class="detail" x="300" y="228" text-anchor="middle">[0] → 事件字典</text>

  <rect x="210" y="284" width="180" height="76" rx="11" fill="#f4f6f8" stroke="#7a8796" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="boxhead" x="300" y="314" text-anchor="middle">copy() 新列表</text>
  <text class="detail" x="300" y="342" text-anchor="middle">[0] → 同一事件字典</text>

  <rect x="450" y="150" width="230" height="96" rx="11" fill="#fff8e8" stroke="#a2833f" stroke-width="1.6"/>
  <text class="boxhead" x="565" y="179" text-anchor="middle">事件字典</text>
  <text class="detail" x="466" y="208">id: evt-1</text>
  <text class="detail" x="466" y="234">tags → list B</text>

  <rect x="450" y="276" width="230" height="84" rx="11" fill="#e9f6ef" stroke="#528266" stroke-width="1.6"/>
  <text class="boxhead" x="565" y="302" text-anchor="middle">list B</text>
  <text class="detail" x="565" y="326" text-anchor="middle">new, priority,</text>
  <text class="detail" x="565" y="348" text-anchor="middle">reviewed, shared</text>

  <path class="arrow" d="M170 66 H208"/>
  <path class="arrow" d="M300 126 V168"/>
  <path class="arrow" d="M170 181 L208 196"/>
  <path class="arrow" d="M170 235 L208 222"/>
  <path class="arrow" d="M170 321 H208"/>
  <path class="arrow" d="M392 208 H448"/>
  <path class="arrow" d="M392 312 L448 236"/>
  <path class="arrow" d="M565 248 V274"/>

  <text class="note" x="18" y="398">状态取在 rows_alias = [] 之前；改绑后只有 rows_alias 改指新列表，其余引用不变。</text>
</svg>
