<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1046" viewBox="0 0 960 1046" role="img" aria-labelledby="title desc">
  <title id="title">导出管线的完成信号各证明什么</title>
  <desc id="desc">Source Readable end, gzip trailing output, file Writable finish and file stream close each prove only their own stage; FileHandle.sync is a separate optional durability request. pipeline() fulfilling proves the pipeline completed normally but not publication. After the pipeline, rename places the artifact at the attempt path, and only the coordinator's conditional commit of the result reference for the current attempt decides task success.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#49627D"/></marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #24364B; }
      .main { font-size: 18px; font-weight: 650; }
      .sub { font-size: 16px; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 15px; }
      .yes { font-size: 16px; fill: #2E7D4F; font-weight: 600; }
      .no { font-size: 16px; fill: #6B7785; }
      .head { font-size: 18px; font-weight: 650; fill: #526B85; }
      .warn { font-size: 16px; font-weight: 700; fill: #B5651D; }
      .arrow { fill: none; stroke: #49627D; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="1046" fill="#FFFFFF"/>
  <text x="36" y="40" class="head">管线内：每个信号只证明它那一段</text>
  <rect x="60" y="62" width="300" height="78" rx="12" fill="#EAF2FB" stroke="#526B85" stroke-width="2"/>
  <text x="210.0" y="108.0" text-anchor="middle" class="main">源 Readable：end</text>
  <text x="394" y="94" class="yes">证明：所有源输入都已被消费</text>
  <text x="394" y="122" class="no">不证明：gzip 已结束、下游已写完、文件已持久化</text>
  <path d="M210.0 142V180" class="arrow"/>
  <rect x="60" y="184" width="300" height="78" rx="12" fill="#F4F6F9" stroke="#526B85" stroke-width="2"/>
  <text x="210.0" y="230.0" text-anchor="middle" class="main">gzip 产出尾块</text>
  <text x="394" y="216" class="sub">输入结束后 gzip 还要产出尾块，输出块数不必等于输入块数</text>
  <text x="394" y="244" class="no">所以“最后一行已送进 gzip”不说明文件完整</text>
  <path d="M210.0 264V302" class="arrow"/>
  <rect x="60" y="306" width="300" height="78" rx="12" fill="#EAF2FB" stroke="#526B85" stroke-width="2"/>
  <text x="210.0" y="352.0" text-anchor="middle" class="main">文件 Writable：finish</text>
  <text x="394" y="338" class="yes">证明：end() 之后写入的数据都已交给底层系统</text>
  <text x="394" y="366" class="no">不证明：断电后仍可恢复；HTTP 客户端已收到完整正文</text>
  <path d="M210.0 386V424" class="arrow" stroke-dasharray="6 5"/>
  <rect x="60" y="428" width="300" height="78" rx="12" fill="#FFFFFF" stroke="#526B85" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="210.0" y="474.0" text-anchor="middle" class="main">可选：FileHandle.sync()</text>
  <text x="394" y="460" class="sub">需要崩溃持久性时，关闭前另行按平台与文件系统契约请求</text>
  <text x="394" y="488" class="no">finish 和 close 都不报告这项保证</text>
  <path d="M210.0 508V546" class="arrow" stroke-dasharray="6 5"/>
  <rect x="60" y="550" width="300" height="78" rx="12" fill="#EAF2FB" stroke="#526B85" stroke-width="2"/>
  <text x="210.0" y="596.0" text-anchor="middle" class="main">文件流：close</text>
  <text x="394" y="582" class="yes">证明：流和文件描述符等底层资源已关闭</text>
  <text x="394" y="610" class="no">不证明：内容已满足所需的崩溃持久性</text>
  <rect x="36" y="672" width="888" height="64" rx="10" fill="#F4F6F9" stroke="#8BA3BD" stroke-width="1.5"/>
  <text x="60" y="699" class="sub"><tspan class="code">pipeline()</tspan> 的 Promise fulfilled：证明整条管线按正常路径完成</text>
  <text x="60" y="723" class="no">不证明：报表已成功发布；对象存储已持久接受</text>
  <text x="36" y="778" class="head">管线之后：由 worker 里的协调者推进</text>
  <rect x="60" y="792" width="300" height="78" rx="12" fill="#EAF2FB" stroke="#526B85" stroke-width="2"/>
  <text x="210.0" y="838.0" text-anchor="middle" class="main">rename 到 attempt 路径</text>
  <text x="394" y="824" class="yes">证明：产物已在最终路径就位（Linux 同一文件系统内原子）</text>
  <text x="394" y="852" class="no">不证明：任务成功</text>
  <path d="M210.0 872V910" class="arrow"/>
  <rect x="60" y="914" width="300" height="78" rx="12" fill="#E7F3EA" stroke="#526B85" stroke-width="2"/>
  <text x="210.0" y="960.0" text-anchor="middle" class="main">协调者条件提交结果引用</text>
  <text x="394" y="946" class="yes">证明：任务成功——以当前 attempt 为条件，</text>
  <text x="394" y="974" class="yes">迟到的旧 attempt 写不进去</text>
  <text x="226.0" y="898.0" class="warn">本地发布 ≠ 任务成功</text>
</svg>
