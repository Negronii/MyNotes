<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
  <title id="title">Node.js 服务关停与外部硬截止</title>
  <desc id="desc">收到 SIGTERM 或 SIGINT 后先同步关闸并关闭新连接，再并行等待 HTTP server 和 handler Promise。handler 结束后补关新近空闲的 keep-alive 连接。内部截止时间到期只通知请求协作取消并关闭 HTTP 活动连接，仍须等待实际清理。两项等待都结算、且生产中资源 owner 确认释放后才关闭依赖；任一项失败则保留依赖并记录失败退出码。只有 supervisor 自己的硬截止在进程仍未退出时才会强杀进程。已持久接受的 job 由队列与协调者管理。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b42318"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #101828; text-anchor: middle; }
      .box { stroke: #667085; stroke-width: 2; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.5; marker-end: url(#arrow); }
      .outer { fill: none; stroke: #b42318; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .label { font-size: 24px; font-weight: 650; }
      .small { font-size: 21px; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 19px; }
      .note { font-size: 19px; fill: #475467; }
      .tag { font-size: 19px; font-weight: 650; fill: #9a5b00; }
      .red { fill: #b42318; }
    </style>
  </defs>
  <rect width="1000" height="1010" fill="#ffffff"/>

  <!-- 1. Signal, synchronous gate, listener close, two waits -->
  <rect class="box" x="20" y="30" width="170" height="120" rx="14" fill="#eef4ff"/>
  <text class="label" x="105" y="84">SIGTERM</text>
  <text class="label" x="105" y="116">/ SIGINT</text>
  <path class="arrow" d="M192 90 H228"/>
  <rect class="box" x="230" y="30" width="220" height="120" rx="14" fill="#e6f4ea"/>
  <text class="label" x="340" y="68">同步关闸</text>
  <text class="mono" x="340" y="102">draining = true</text>
  <text class="mono" x="340" y="130">readiness = false</text>
  <path class="arrow" d="M452 90 H488"/>
  <rect class="box" x="490" y="30" width="210" height="120" rx="14" fill="#f2f4f7"/>
  <text class="label" x="595" y="80">server.close()</text>
  <text class="small" x="595" y="116">停止接新连接</text>
  <path class="arrow" d="M702 90 H738"/>
  <rect class="box" x="740" y="30" width="240" height="120" rx="14" fill="#f2f4f7"/>
  <text class="label" x="860" y="80">并行等待</text>
  <text class="small" x="860" y="116">HTTP 关闭 + 应用工作</text>

  <!-- 2a. Normal path -->
  <path class="arrow" d="M865 152 V208"/>
  <rect x="745" y="210" width="240" height="110" rx="12" fill="#f8fafc" stroke="#98a2b3" stroke-width="2"/>
  <text class="note" x="865" y="242">handler 都结束后</text>
  <text class="mono" x="865" y="272" style="font-size:17px">closeIdleConnections()</text>
  <text class="note" x="865" y="302">补关刚空闲的连接</text>
  <path class="arrow" d="M865 322 V578"/>

  <!-- 2b. Internal deadline path -->
  <path class="arrow" d="M790 152 C770 200 690 220 640 248"/>
  <rect x="436" y="176" width="200" height="36" rx="10" fill="#fff4e5" stroke="#e7b36f" stroke-width="1.5"/>
  <text class="tag" x="536" y="201">内部截止时间到</text>
  <rect class="box" x="430" y="250" width="300" height="110" rx="14" fill="#fff4e5"/>
  <text class="small" x="580" y="290">先通知在途请求取消</text>
  <text class="mono" x="580" y="324">再 closeAllConnections()</text>
  <path class="arrow" d="M580 362 V398"/>
  <rect class="box" x="430" y="400" width="300" height="110" rx="14" fill="#fff4e5"/>
  <text class="label" x="580" y="446">继续等待清理</text>
  <text class="small" x="580" y="484">查询 / worker / 写流</text>
  <path class="arrow" d="M580 512 V578"/>

  <!-- 3. Join, owner release, close dependencies -->
  <rect class="box" x="430" y="580" width="550" height="100" rx="14" fill="#e6f4ea"/>
  <text class="small" x="705" y="622">HTTP close 回调已到</text>
  <text class="small" x="705" y="656">且全部 handler Promise 已结算</text>
  <path class="arrow" d="M705 682 V718"/>
  <rect class="box" x="510" y="720" width="390" height="90" rx="14" fill="#eef4ff"/>
  <text class="small" x="705" y="756">生产还要等资源 owner</text>
  <text class="small" x="705" y="790">确认释放成功</text>
  <path class="arrow" d="M705 812 V848"/>
  <rect class="box" x="510" y="850" width="390" height="70" rx="14" fill="#f2f4f7"/>
  <text class="small" x="705" y="893">关闭共享依赖，进程自然退出</text>

  <path class="arrow" d="M428 630 H382"/>
  <rect x="20" y="590" width="360" height="80" rx="12" fill="#f8fafc" stroke="#98a2b3" stroke-width="2"/>
  <text class="note" x="200" y="623">任一项失败：保留依赖</text>
  <text class="note" x="200" y="651">记录失败退出码</text>

  <!-- Supervisor hard deadline covers the whole shutdown -->
  <path class="outer" d="M105 152 V258" marker-end="url(#arrow-red)"/>
  <rect x="20" y="260" width="370" height="90" rx="14" fill="#fef3f2" stroke="#b42318" stroke-width="2"/>
  <text class="small red" x="205" y="296">supervisor 独立计时</text>
  <text class="small red" x="205" y="330">覆盖整个关停过程</text>
  <path class="outer" d="M205 352 V398" marker-end="url(#arrow-red)"/>
  <rect x="20" y="400" width="370" height="110" rx="14" fill="#fef3f2" stroke="#b42318" stroke-width="2.5"/>
  <text class="small red" x="205" y="442">外部硬截止时仍未退出</text>
  <text class="label red" x="205" y="482">supervisor 发 SIGKILL</text>

  <!-- Durable jobs remain owned by the queue and coordinator -->
  <rect x="20" y="940" width="960" height="54" rx="12" fill="#f9fafb" stroke="#98a2b3" stroke-width="1.5"/>
  <text class="note" x="500" y="974">job-demo-731 这类持久 job 归队列与协调者：取消 attempt、等清理后不确认，交给恢复路径。</text>
</svg>
