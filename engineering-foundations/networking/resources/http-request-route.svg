<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550" role="img" aria-labelledby="title desc"><title id="title">报表读取的请求与响应路径</title><desc id="desc">上排由浏览器向报表服务发送需要验证的GET，下排把线上响应经过HTTP缓存交回页面。304验证成功时页面得到200及旧正文，撤权时不回退成功正文。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8296ae"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27384e;font-size:17px}.head{font-size:20px;font-weight:600}.small{font-size:16px}</style><rect width="700" height="550" rx="12" fill="#f8faff"/><rect x="10" y="20" width="200" height="240" rx="10" fill="#fff6e8" stroke="#cbd8e7" stroke-width="1.5"/><text x="110" y="53" text-anchor="middle" class="head">浏览器请求</text><text x="110" y="86" text-anchor="middle" class="small">GET /api/reports/42</text><text x="110" y="114" text-anchor="middle" class="small">默认 Fetch 缓存模式</text><text x="110" y="142" text-anchor="middle" class="small">Service Worker 转发</text><text x="110" y="170" text-anchor="middle" class="small">Cookie 按策略附加</text><text x="110" y="198" text-anchor="middle" class="small">已存响应为 no-cache</text><text x="110" y="226" text-anchor="middle" class="small">ETag → 验证请求字段</text><rect x="250" y="20" width="200" height="240" rx="10" fill="#edf4ff" stroke="#cbd8e7" stroke-width="1.5"/><text x="350" y="53" text-anchor="middle" class="head">连接与传输</text><text x="350" y="86" text-anchor="middle" class="small">可用连接：直接复用</text><text x="350" y="114" text-anchor="middle" class="small">否则先准备连接</text><text x="350" y="142" text-anchor="middle" class="small">TCP + TLS 或 QUIC</text><rect x="490" y="20" width="200" height="240" rx="10" fill="#edf4ff" stroke="#cbd8e7" stroke-width="1.5"/><text x="590" y="53" text-anchor="middle" class="head">报表服务</text><text x="590" y="86" text-anchor="middle" class="small">确认当前主体</text><text x="590" y="114" text-anchor="middle" class="small">检查报表 42 的权限</text><text x="590" y="142" text-anchor="middle" class="small">获准后再比较 ETag</text><path d="M215 125 H245" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M455 125 H485" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M590 265 V340" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="345" width="200" height="185" rx="10" fill="#f3eefb" stroke="#cbd8e7" stroke-width="1.5"/><text x="590" y="380" text-anchor="middle" class="head">线上响应</text><text x="590" y="416" text-anchor="middle" class="small">获准且未变：304</text><text x="590" y="445" text-anchor="middle" class="small">获准且已变：200</text><text x="590" y="474" text-anchor="middle" class="small">撤权：403 或 404</text><rect x="250" y="345" width="200" height="185" rx="10" fill="#fff6e8" stroke="#cbd8e7" stroke-width="1.5"/><text x="350" y="380" text-anchor="middle" class="head">HTTP 缓存处理</text><text x="350" y="416" text-anchor="middle" class="small">304：更新字段</text><text x="350" y="445" text-anchor="middle" class="small">并取已存正文</text><text x="350" y="474" text-anchor="middle" class="small">200：保存新的表示</text><text x="350" y="503" text-anchor="middle" class="small">错误：不退回旧成功正文</text><rect x="10" y="345" width="200" height="185" rx="10" fill="#edf8f2" stroke="#cbd8e7" stroke-width="1.5"/><text x="110" y="380" text-anchor="middle" class="head">页面看到的响应</text><text x="110" y="416" text-anchor="middle" class="small">验证成功：200 + v8</text><text x="110" y="445" text-anchor="middle" class="small">已更新：200 + 新 JSON</text><text x="110" y="474" text-anchor="middle" class="small">撤权：403 / 404</text><text x="110" y="503" text-anchor="middle" class="small">正文仍需完整读取</text><path d="M485 435 H455" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M245 435 H215" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/></svg>