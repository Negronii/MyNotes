<svg xmlns="http://www.w3.org/2000/svg" width="700" height="531" viewBox="0 0 700 531" role="img" aria-labelledby="title desc"><title id="title">同一HTTP语义的三种承载方式</title><desc id="desc">三行分别对比HTTP/1.1文本消息和TCP、HTTP/2二进制流帧和TCP、HTTP/3帧和QUIC。三者承载同一GET及JSON响应。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8296ae"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27384e;font-size:17px}.head{font-size:20px;font-weight:600}.small{font-size:16px}</style><rect width="700" height="531" rx="12" fill="#f8faff"/><rect x="12" y="12" width="676" height="158" rx="10" fill="#edf4ff" stroke="#cbd8e7" stroke-width="1.5"/><text x="36" y="42" text-anchor="start" class="head">HTTP/1.1</text><text x="36" y="76" text-anchor="start" class="small">文本起始行与字段</text><text x="36" y="107" text-anchor="start" class="small">正文可以是二进制</text><text x="36" y="138" text-anchor="start" class="small">长度、分块或关闭定界</text><text x="419" y="76" text-anchor="start" class="small">TCP + TLS（本例 HTTPS）</text><text x="419" y="107" text-anchor="start" class="small">持久连接可复用</text><text x="419" y="138" text-anchor="start" class="small">流水线响应按请求顺序</text><path d="M324 103 H402" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="185" width="676" height="158" rx="10" fill="#f3eefb" stroke="#cbd8e7" stroke-width="1.5"/><text x="36" y="215" text-anchor="start" class="head">HTTP/2</text><text x="36" y="249" text-anchor="start" class="small">二进制 HEADERS / DATA</text><text x="36" y="280" text-anchor="start" class="small">流 ID 区分请求，帧可交错</text><text x="36" y="311" text-anchor="start" class="small">HPACK 压缩字段块</text><text x="419" y="249" text-anchor="start" class="small">TCP + TLS</text><text x="419" y="280" text-anchor="start" class="small">一条连接承载多条流</text><text x="419" y="311" text-anchor="start" class="small">字节缺口阻塞后续交付</text><path d="M324 276 H402" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="358" width="676" height="158" rx="10" fill="#edf8f2" stroke="#cbd8e7" stroke-width="1.5"/><text x="36" y="388" text-anchor="start" class="head">HTTP/3</text><text x="36" y="422" text-anchor="start" class="small">二进制 HTTP 帧放入 QUIC 流</text><text x="36" y="453" text-anchor="start" class="small">QPACK 压缩字段块</text><text x="36" y="484" text-anchor="start" class="small">逐流可靠交付</text><text x="419" y="422" text-anchor="start" class="small">QUIC（经 UDP）+ TLS 1.3</text><text x="419" y="453" text-anchor="start" class="small">各流独立按序交付</text><text x="419" y="484" text-anchor="start" class="small">同连接仍共享拥塞和流控</text><path d="M324 449 H402" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/></svg>