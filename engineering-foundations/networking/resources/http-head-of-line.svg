<svg xmlns="http://www.w3.org/2000/svg" width="700" height="538" viewBox="0 0 700 538" role="img" aria-labelledby="title desc"><title id="title">TCP跨流等待与QUIC逐流交付</title><desc id="desc">HTTP/2的TCP片段丢失会阻止交付后续字节，HTTP/3图片流有缺口但报表流完整到达且字段依赖可解码时，可以先交付报表。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8296ae"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27384e;font-size:17px}.head{font-size:20px;font-weight:600}.small{font-size:16px}</style><rect width="700" height="538" rx="12" fill="#f8faff"/><rect x="12" y="12" width="676" height="224" rx="10" fill="#fff0ee" stroke="#cbd8e7" stroke-width="1.5"/><text x="36" y="44" text-anchor="start" class="head">HTTP/2：共享一个有序 TCP 字节流</text><text x="36" y="75" text-anchor="start" class="small">报表帧和图片帧交错传输；片段 2 丢失。</text><rect x="30" y="96" width="140" height="64" rx="10" fill="#edf4ff" stroke="#cbd8e7" stroke-width="1.5"/><text x="100" y="121" text-anchor="middle" class="small">片段 1</text><text x="100" y="146" text-anchor="middle" class="small">报表帧</text><rect x="196" y="96" width="140" height="64" rx="10" fill="#fff0ee" stroke="#cbd8e7" stroke-width="1.5"/><text x="266" y="121" text-anchor="middle" class="small">片段 2 丢失</text><text x="266" y="146" text-anchor="middle" class="small">图片帧</text><rect x="362" y="96" width="140" height="64" rx="10" fill="#edf4ff" stroke="#cbd8e7" stroke-width="1.5"/><text x="432" y="121" text-anchor="middle" class="small">片段 3 已到</text><text x="432" y="146" text-anchor="middle" class="small">报表帧</text><rect x="528" y="96" width="140" height="64" rx="10" fill="#edf4ff" stroke="#cbd8e7" stroke-width="1.5"/><text x="598" y="121" text-anchor="middle" class="small">片段 4 已到</text><text x="598" y="146" text-anchor="middle" class="small">图片帧</text><text x="266" y="199" text-anchor="middle" class="small">等待重传</text><path d="M362 175 V183 H668 V175" fill="none" stroke="#8296ae" stroke-width="2.5"/><text x="515" y="213" text-anchor="middle" class="small">缺口后的字节等待补齐</text><rect x="12" y="256" width="676" height="266" rx="10" fill="#edf8f2" stroke="#cbd8e7" stroke-width="1.5"/><text x="36" y="290" text-anchor="start" class="head">HTTP/3：QUIC 按流可靠交付</text><text x="36" y="321" text-anchor="start" class="small">报表流已收齐（含 FIN）；所需 QPACK 字段可解码。</text><text x="65" y="377" text-anchor="middle" class="small">图片流</text><rect x="130" y="348" width="142" height="58" rx="10" fill="#ffffff" stroke="#cbd8e7" stroke-width="1.5"/><text x="201" y="383" text-anchor="middle" class="small">图片块 A</text><rect x="313" y="348" width="142" height="58" rx="10" fill="#fff0ee" stroke="#cbd8e7" stroke-width="1.5"/><text x="384" y="383" text-anchor="middle" class="small">图片块 B 缺失</text><rect x="496" y="348" width="142" height="58" rx="10" fill="#ffffff" stroke="#cbd8e7" stroke-width="1.5"/><text x="567" y="383" text-anchor="middle" class="small">C 已到，等 B</text><path d="M278 377 H307" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M461 377 H490" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="469" text-anchor="middle" class="small">报表流</text><rect x="130" y="440" width="142" height="58" rx="10" fill="#ffffff" stroke="#cbd8e7" stroke-width="1.5"/><text x="201" y="475" text-anchor="middle" class="small">报表帧 1</text><rect x="313" y="440" width="142" height="58" rx="10" fill="#ffffff" stroke="#cbd8e7" stroke-width="1.5"/><text x="384" y="475" text-anchor="middle" class="small">报表帧 2</text><rect x="496" y="440" width="142" height="58" rx="10" fill="#ffffff" stroke="#cbd8e7" stroke-width="1.5"/><text x="567" y="475" text-anchor="middle" class="small">可先交付</text><path d="M278 469 H307" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M461 469 H490" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/></svg>