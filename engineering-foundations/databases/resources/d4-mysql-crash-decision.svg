<svg xmlns="http://www.w3.org/2000/svg" width="700" height="422" viewBox="0 0 700 422" role="img" aria-labelledby="title desc"><title id="title">崩溃后的事务决策</title><desc id="desc">以独立初态库存1且只有B修改为前提，按可恢复的有效持久binlog XID完成已准备提交或回滚，最终库存及预留记录保持原子。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#8296ae"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27384e}</style><rect width="700" height="422" fill="white"/><rect x="24" y="18" width="652" height="98" rx="12" fill="#edf4ff" stroke="#b6c7da" stroke-width="1.5"/><text x="350" y="50" text-anchor="middle" font-size="20" font-weight="600">redo 恢复页和可恢复的事务状态后</text><text x="350" y="83" text-anchor="middle" font-size="18" font-weight="400">检查 binlog 是否留下完整、有效且持久的 XID</text><path d="M350 121 V153" fill="none" stroke="#8296ae" stroke-width="2.5"/><path d="M350 153 H180 V195" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M350 153 H520 V195" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="207" width="310" height="196" rx="12" fill="#fff6e8" stroke="#b6c7da" stroke-width="1.5"/><text x="42" y="240" text-anchor="start" font-size="18" font-weight="600">无完整有效的持久 XID</text><text x="42" y="272" text-anchor="start" font-size="17" font-weight="400">含步骤 4 期间未留下有效 XID</text><text x="42" y="305" text-anchor="start" font-size="17" font-weight="400">undo 回滚未提交事务</text><text x="42" y="338" text-anchor="start" font-size="17" font-weight="400">包含仍 prepared 的事务</text><text x="42" y="371" text-anchor="start" font-size="17" font-weight="600">available = 1；无预留行</text><rect x="366" y="207" width="310" height="196" rx="12" fill="#edf8f2" stroke="#b6c7da" stroke-width="1.5"/><text x="384" y="240" text-anchor="start" font-size="18" font-weight="600">完整有效的 XID 已持久</text><text x="384" y="272" text-anchor="start" font-size="17" font-weight="400">例如步骤 4 的 binlog 同步已完成</text><text x="384" y="305" text-anchor="start" font-size="17" font-weight="400">仍 prepared：完成提交</text><text x="384" y="338" text-anchor="start" font-size="17" font-weight="400">已提交：保持提交结果</text><text x="384" y="371" text-anchor="start" font-size="17" font-weight="600">available = 0；预留行存在</text></svg>