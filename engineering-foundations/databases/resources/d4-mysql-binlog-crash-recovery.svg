<svg xmlns="http://www.w3.org/2000/svg" width="700" height="688" viewBox="0 0 700 688" role="img" aria-labelledby="title desc"><title id="title">一次事务的正常提交顺序</title><desc id="desc">更新与预留写入后，prepare先入缓冲，组提交先持久redo，再写并同步binlog与XID，最后引擎提交。</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#8296ae"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#27384e}</style><rect width="700" height="688" fill="white"/><rect x="24" y="18" width="652" height="92" rx="12" fill="#edf4ff" stroke="#b6c7da" stroke-width="1.5"/><text x="44" y="47" text-anchor="start" font-size="20" font-weight="600">1. 更新库存并写入预留记录</text><text x="44" y="74" text-anchor="start" font-size="17" font-weight="400">available：1 → 0；同一事务保存操作键与指纹</text><text x="44" y="99" text-anchor="start" font-size="17" font-weight="400">修改产生相应 redo / undo</text><path d="M350 115 V148" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="158" width="652" height="92" rx="12" fill="#f3eefb" stroke="#b6c7da" stroke-width="1.5"/><text x="44" y="187" text-anchor="start" font-size="20" font-weight="600">2. InnoDB PREPARE</text><text x="44" y="214" text-anchor="start" font-size="17" font-weight="400">准备记录追加到 redo log buffer</text><text x="44" y="239" text-anchor="start" font-size="17" font-weight="400">此调用本身还不表示已持久化</text><path d="M350 255 V288" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="298" width="652" height="92" rx="12" fill="#fff6e8" stroke="#b6c7da" stroke-width="1.5"/><text x="44" y="327" text-anchor="start" font-size="20" font-weight="600">3. 组提交持久化 InnoDB redo</text><text x="44" y="354" text-anchor="start" font-size="17" font-weight="400">先持久化 prepare 记录及此前的 redo</text><text x="44" y="379" text-anchor="start" font-size="17" font-weight="400">本例 innodb_flush_log_at_trx_commit = 1</text><path d="M350 395 V428" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="438" width="652" height="92" rx="12" fill="#fff6e8" stroke="#b6c7da" stroke-width="1.5"/><text x="44" y="467" text-anchor="start" font-size="20" font-weight="600">4. 写入并同步完整 binlog 事务与 XID</text><text x="44" y="494" text-anchor="start" font-size="17" font-weight="400">本例 sync_binlog = 1</text><text x="44" y="519" text-anchor="start" font-size="17" font-weight="400">完整、有效的提交证据已持久化</text><path d="M350 535 V568" fill="none" stroke="#8296ae" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="578" width="652" height="92" rx="12" fill="#edf8f2" stroke="#b6c7da" stroke-width="1.5"/><text x="44" y="607" text-anchor="start" font-size="20" font-weight="600">5. InnoDB COMMIT</text><text x="44" y="634" text-anchor="start" font-size="17" font-weight="400">引擎完成提交</text><text x="44" y="659" text-anchor="start" font-size="17" font-weight="400">客户端仍可能没有收到 COMMIT 响应</text></svg>