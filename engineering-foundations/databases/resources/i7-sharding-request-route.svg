<svg xmlns="http://www.w3.org/2000/svg" width="980" height="810" viewBox="0 0 980 810" role="img" aria-labelledby="title desc">
  <title id="title">Account-key write routing</title>
  <desc id="desc">Resolve the account, authorize the principal, route using owner and epoch, then check the local ownership row in the business transaction. A matching open row accepts; authoritative route mismatch is stale; closed, frozen, or uncertain state pauses.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#334155"/></marker>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:3; rx:16; }
      .main { fill:#eaf2ff; stroke:#315c9b; }
      .good { fill:#e7f6ec; stroke:#34734a; }
      .warn { fill:#fff6df; stroke:#9a6a12; }
      .bad { fill:#fff0ed; stroke:#a54838; }
      .line { fill:none; stroke:#334155; stroke-width:5; marker-end:url(#arrow); }
      .rail { fill:none; stroke:#334155; stroke-width:5; }
      .t { font-family:Arial, "PingFang SC", "Heiti SC", sans-serif; font-size:28px; fill:#172033; text-anchor:middle; dominant-baseline:middle; }
      .small { font-family:Arial, "PingFang SC", "Heiti SC", sans-serif; font-size:25px; fill:#334155; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="810" fill="#ffffff"/>
  <rect class="box main" x="25" y="20" width="930" height="102"/>
  <text class="t" x="490" y="53">写请求：acct-17 / report-42 / op-9</text>
  <text class="small" x="490" y="91">只有 report_id 时先解析账户；不广播到所有分片</text>
  <path class="line" d="M490 122 L490 160"/>

  <rect class="box" x="25" y="164" width="930" height="94"/>
  <text class="t" x="490" y="195">验证认证主体对 acct-17 / report-42 的权限</text>
  <text class="small" x="490" y="230">授权独立于路由缓存和分片位置</text>
  <path class="line" d="M490 258 L490 296"/>

  <rect class="box main" x="25" y="300" width="930" height="102"/>
  <text class="t" x="490" y="335">权威目录当前为 owner=B，epoch=7</text>
  <text class="small" x="490" y="372">缓存仅提示位置；请求携带目标 B 与代次 7</text>
  <path class="line" d="M490 402 L490 440"/>

  <rect class="box main" x="25" y="444" width="930" height="108"/>
  <text class="t" x="490" y="478">B 在业务事务内锁定并检查本地 ownership 行</text>
  <text class="small" x="490" y="516">account、目标、owner、epoch、state 必须完全匹配</text>
  <path class="rail" d="M490 552 L490 588 M185 588 L795 588"/>
  <path class="line" d="M180 588 L180 626"/>
  <path class="line" d="M490 588 L490 626"/>
  <path class="line" d="M800 588 L800 626"/>

  <rect class="box good" x="40" y="632" width="280" height="158"/>
  <text class="t" x="180" y="663">完全匹配且 open</text>
  <text class="small" x="180" y="704">提交业务写</text>
  <text class="small" x="180" y="744">效果与代次账同事务</text>
  <text class="small" x="180" y="774">同键重试读既有结果</text>

  <rect class="box bad" x="350" y="632" width="280" height="158"/>
  <text class="t" x="490" y="663">owner / epoch 已变</text>
  <text class="small" x="490" y="704">权威目录已确认</text>
  <text class="small" x="490" y="744">例如 B/7 → B/8</text>
  <text class="small" x="490" y="774">stale-route 后刷新重试</text>

  <rect class="box warn" x="660" y="632" width="280" height="158"/>
  <text class="t" x="800" y="663">closed / frozen / 未知</text>
  <text class="small" x="800" y="704">本地不证明路由已变</text>
  <text class="small" x="800" y="744">暂停并查权威目录</text>
  <text class="small" x="800" y="774">未确认不换库重放</text>
</svg>
