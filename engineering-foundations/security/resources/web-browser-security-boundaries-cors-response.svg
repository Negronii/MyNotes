<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title desc"><title id="title">实际响应的业务结果与脚本读取权限</title><desc id="desc">通过预检的实际GET可按Cookie条件带凭据；API自行验证身份和资源权限形成业务响应。CORS字段匹配时脚本可读200或业务404，不匹配时Fetch TypeError，即使服务已经完成请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627c9e"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#26374d;font-size:22px}.label{font-size:24px;font-weight:600}.code{font-family:Menlo,monospace;font-size:20px}.edge{fill:none;stroke:#627c9e;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}</style></defs><rect width="900" height="850" rx="14" fill="#f8fafc"/><rect x="30" y="24" width="840" height="130" rx="14" fill="#edf4ff" stroke="#c6d9f5" stroke-width="2"/><text x="54" y="62" class="label">接上图：浏览器发送实际 GET</text><text x="54" y="102" class="">credentials=include，按目标 URL 和 Cookie 政策附带 Cookie</text><path class="edge" d="M450 154V204"/><rect x="30" y="210" width="840" height="175" rx="14" fill="#ffffff" stroke="#ccd7e5" stroke-width="2"/><text x="54" y="248" class="label">API 验证身份，再按主体、租户与资源授权</text><text x="54" y="288" class="">确认身份与 report:read 后，才读取租户甲报表 42</text><text x="54" y="322" class="">业务结果可为 200；无资源访问权按本例隐藏为 404</text><text x="54" y="356" class="">无有效身份则按认证合同返回错误</text><path class="edge" d="M450 385V435"/><rect x="30" y="441" width="840" height="140" rx="14" fill="#ffffff" stroke="#ccd7e5" stroke-width="2"/><text x="54" y="479" class="label">浏览器检查实际响应的 CORS 字段</text><text x="54" y="519" class="">允许来源须精确匹配 console 的 origin</text><text x="54" y="553" class="">include 模式还要求 Allow-Credentials: true</text><path class="edge" d="M450 581V621H235V661"/><path class="edge" d="M450 621H665V661"/><rect x="30" y="667" width="410" height="155" rx="14" fill="#eef8f3" stroke="#a8d5c2" stroke-width="2"/><text x="54" y="705" class="label">字段匹配：取得 Response</text><text x="54" y="745" class="">脚本可读 HTTP 状态与正文</text><text x="54" y="779" class="">业务 404：ok=false，并非拒读</text><rect x="460" y="667" width="410" height="155" rx="14" fill="#fff2ef" stroke="#e2b3a9" stroke-width="2"/><text x="484" y="705" class="label">字段不匹配：Fetch 拒绝</text><text x="484" y="745" class="">TypeError；没有可读 Response</text><text x="484" y="779" class="">API 可能已经处理请求</text></svg>
