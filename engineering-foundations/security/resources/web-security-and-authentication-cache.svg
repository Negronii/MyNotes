<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 900 1110" role="img" aria-label="当前授权通过后按租户主体对象查缓存；未命中时按tenant和report复合键查询；命中与未命中都遵守对象生命周期前提">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7086a3"/></marker></defs>
<rect width="900" height="1110" rx="14" fill="#f7f9fc"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24364c">
<rect x="65" y="25" width="770" height="139" rx="12" fill="#eef5ff" stroke="#cbddf4" stroke-width="2"/>
<text x="450.0" y="60" text-anchor="middle" font-size="25" font-weight="600">输入：本次当前授权已通过</text>
<text x="450.0" y="98" text-anchor="middle" font-size="23">user-17 · tenant-a · report:read · report 42</text>
<text x="450.0" y="130" text-anchor="middle" font-size="23">本例缓存期内不删除、迁移对象或复用编号</text>
<path d="M450,176 L450,220" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="65" y="236" width="770" height="105" rx="12" fill="#f4effb" stroke="#daccf1" stroke-width="2"/>
<text x="450.0" y="271" text-anchor="middle" font-size="25" font-weight="600">查应用缓存</text>
<text x="450.0" y="309" text-anchor="middle" font-size="23">key = (tenant-a, user-17, 42)</text>
<path d="M450,353 L450,395 L240,395 M450,395 L670,395" fill="none" stroke="#7086a3" stroke-width="3"/>
<path d="M240,395 L240,449" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M670,395 L670,449" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="240" y="383" text-anchor="middle" font-size="22">命中</text>
<text x="670" y="383" text-anchor="middle" font-size="22">未命中</text>
<rect x="35" y="465" width="410" height="140" rx="12" fill="#ecf7f2" stroke="#b8dccc" stroke-width="2"/>
<text x="240.0" y="500" text-anchor="middle" font-size="25" font-weight="600">返回该范围的缓存副本</text>
<text x="240.0" y="538" text-anchor="middle" font-size="23">report 42 → 200</text>
<text x="240.0" y="570" text-anchor="middle" font-size="23">本次授权已检查，不由键授权</text>
<rect x="475" y="465" width="390" height="140" rx="12" fill="#eef5ff" stroke="#cbddf4" stroke-width="2"/>
<text x="670.0" y="500" text-anchor="middle" font-size="25" font-weight="600">按复合身份查询</text>
<text x="670.0" y="538" text-anchor="middle" font-size="23">tenant_id = tenant-a</text>
<text x="670.0" y="570" text-anchor="middle" font-size="23">id = 42（分别参数绑定）</text>
<path d="M670,617 L670,680 L240,680" fill="none" stroke="#7086a3" stroke-width="3"/>
<path d="M240,680 L240,735" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M670,680 L670,735" fill="none" stroke="#7086a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="240" y="665" text-anchor="middle" font-size="22">没有匹配行</text>
<text x="648" y="665" text-anchor="end" font-size="22">查询得到匹配行</text>
<rect x="35" y="751" width="410" height="174" rx="12" fill="#fff5e9" stroke="#e8cda7" stroke-width="2"/>
<text x="240.0" y="786" text-anchor="middle" font-size="25" font-weight="600">404：该租户内不存在</text>
<text x="240.0" y="824" text-anchor="middle" font-size="23">不返回 tenant-a 以外的对象</text>
<text x="240.0" y="856" text-anchor="middle" font-size="23">本例隐藏错误策略</text>
<text x="240.0" y="888" text-anchor="middle" font-size="23">不是自动去其他租户查找</text>
<rect x="475" y="751" width="390" height="174" rx="12" fill="#ecf7f2" stroke="#b8dccc" stroke-width="2"/>
<text x="670.0" y="786" text-anchor="middle" font-size="25" font-weight="600">填充同一缓存范围 → 200</text>
<text x="670.0" y="824" text-anchor="middle" font-size="23">tenant-a / id=42</text>
<text x="670.0" y="856" text-anchor="middle" font-size="23">title = Service health</text>
<text x="670.0" y="888" text-anchor="middle" font-size="23">把报表正文返回调用方</text>
<text x="450" y="991" text-anchor="middle" font-size="22">缓存键区分副本范围；当前成员和动作检查在前一图。</text>
<text x="450" y="1031" text-anchor="middle" font-size="22">这里是应用数据缓存；HTTP no-store 由响应适配层设置。</text>
<text x="450" y="1071" text-anchor="middle" font-size="22">正文 SQL：WHERE tenant_id = ? AND id = ?</text>
</g>
</svg>
