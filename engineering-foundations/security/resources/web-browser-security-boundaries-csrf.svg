<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" role="img" aria-labelledby="title desc"><title id="title">同站跨源表单与书签防伪边界</title><desc id="desc">已登录用户直接打开legacy顶层页，普通表单使Cookie随请求到API；业务认证与动作授权通过后，精确Origin校验拒绝此变更，没有防伪则书签由false变true。</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627c9e"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#26374d;font-size:22px}.label{font-size:24px;font-weight:600}.code{font-family:Menlo,monospace;font-size:20px}.edge{fill:none;stroke:#627c9e;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}</style></defs><rect width="900" height="1030" rx="14" fill="#f8fafc"/><rect x="30" y="24" width="840" height="120" rx="14" fill="#fff5e8" stroke="#ebd3ad" stroke-width="2"/><text x="54" y="62" class="label">顶层旧页面：legacy.example.test</text><text x="54" y="102" class="">HTTPS + 同一可注册域：与 API 同 site、不同 origin</text><path class="edge" d="M450 144V194"/><rect x="30" y="200" width="840" height="160" rx="14" fill="#edf4ff" stroke="#c6d9f5" stroke-width="2"/><text x="54" y="238" class="label">普通表单 POST：把自己的报表 42 书签置顶</text><text x="54" y="278" class="code">pinned=true · application/x-www-form-urlencoded</text><text x="54" y="312" class="">接口支持该编码；无需 CORS 预检</text><path class="edge" d="M450 360V410"/><rect x="30" y="416" width="840" height="165" rx="14" fill="#ffffff" stroke="#ccd7e5" stroke-width="2"/><text x="54" y="454" class="label">浏览器按 API 主机附上会话 Cookie</text><text x="54" y="494" class="code">Origin: https://legacy.example.test</text><text x="54" y="528" class="code">Cookie: __Host-api-session=&lt;opaque-session-id&gt;</text><text x="54" y="562" class="">SameSite=Lax 不阻止此处附带 Cookie</text><path class="edge" d="M450 581V631"/><rect x="30" y="637" width="840" height="130" rx="14" fill="#ffffff" stroke="#ccd7e5" stroke-width="2"/><text x="54" y="675" class="label">API 验证会话与书签操作权限</text><text x="54" y="715" class="">本例确认 user-17 可维护自己的书签；当前 pinned=false</text><path class="edge" d="M450 767V807H235V847"/><path class="edge" d="M450 807H665V847"/><rect x="30" y="853" width="410" height="150" rx="14" fill="#eef8f3" stroke="#a8d5c2" stroke-width="2"/><text x="54" y="891" class="label">执行精确来源校验</text><text x="54" y="931" class="">legacy ≠ 允许的 console</text><text x="54" y="965" class="">拒绝 403；pinned 仍为 false</text><rect x="460" y="853" width="410" height="150" rx="14" fill="#fff2ef" stroke="#e2b3a9" stroke-width="2"/><text x="484" y="891" class="label">没有防伪检查</text><text x="484" y="931" class="">按收到的 pinned=true 变更</text><text x="484" y="965" class="">书签 false → true</text></svg>
