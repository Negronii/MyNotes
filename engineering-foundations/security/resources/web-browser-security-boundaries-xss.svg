<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc"><title id="title">不可信标题进入两种 DOM 接口后的不同结果</title><desc id="desc">同一字符串进入textContent后作为纯文本，进入innerHTML后解析为img及事件处理器；图像失败且策略未阻止内联处理器时可执行脚本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627c9e"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#26374d;font-size:22px}.label{font-size:24px;font-weight:600}.code{font-family:Menlo,monospace;font-size:20px}.edge{fill:none;stroke:#627c9e;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}</style></defs><rect width="900" height="720" rx="14" fill="#f8fafc"/><rect x="30" y="24" width="840" height="120" rx="14" fill="#edf4ff" stroke="#c6d9f5" stroke-width="2"/><text x="54" y="62" class="label">报表 42 的不可信标题</text><text x="54" y="102" class="code">&lt;img src=x onerror=alert(1)&gt;</text><path class="edge" d="M450 144V190H235V234"/><path class="edge" d="M450 190H665V234"/><rect x="30" y="240" width="410" height="190" rx="14" fill="#eef8f3" stroke="#a8d5c2" stroke-width="2"/><text x="54" y="278" class="label">普通标题元素：textContent</text><text x="54" y="318" class="code">title.textContent = value</text><text x="54" y="352" class="">将整个字符串变为文本节点</text><text x="54" y="386" class="">没有生成 img 或事件处理器</text><rect x="460" y="240" width="410" height="190" rx="14" fill="#fff2ef" stroke="#e2b3a9" stroke-width="2"/><text x="484" y="278" class="label">普通标题元素：innerHTML</text><text x="484" y="318" class="code">title.innerHTML = value</text><text x="484" y="352" class="">HTML 解析器生成 img 元素</text><text x="484" y="386" class="">并设置 onerror 处理器</text><path class="edge" d="M235 430V484"/><path class="edge" d="M665 430V484"/><rect x="30" y="490" width="410" height="170" rx="14" fill="#eef8f3" stroke="#a8d5c2" stroke-width="2"/><text x="54" y="528" class="label">显示字符</text><text x="54" y="568" class="code">&lt;img src=x onerror=alert(1)&gt;</text><text x="54" y="602" class="">此输入不会作为事件执行</text><rect x="460" y="490" width="410" height="170" rx="14" fill="#fff2ef" stroke="#e2b3a9" stroke-width="2"/><text x="484" y="528" class="label">图像加载失败</text><text x="484" y="568" class="">若有效策略未阻止内联处理器</text><text x="484" y="602" class="">onerror 运行 alert(1)</text></svg>
