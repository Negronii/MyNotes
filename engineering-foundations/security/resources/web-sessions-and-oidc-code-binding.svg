<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1532" viewBox="0 48 900 1532" role="img" aria-labelledby="title desc">
<title id="title">授权码兑换、OIDC 身份验证和新应用会话</title>
<desc id="desc">Local sequence diagram with explicit inputs, outputs and a stop condition.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2b668f"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#a63f3f"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2f6b53"/></marker>
  <marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#738294"/></marker>
  <style>text { font-family: Arial, "Noto Sans CJK SC", sans-serif; }</style>
</defs>
<rect x="0" y="48" width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="130" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="130" dy="0">浏览器</tspan></text>
<line x1="130" y1="142" x2="130" y2="1460" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="335" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="450" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">报表 BFF</tspan></text>
<line x1="450" y1="142" x2="450" y2="1460" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="655" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="770" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="770" dy="0">IdP Token Endpoint</tspan></text>
<line x1="770" y1="142" x2="770" y2="1460" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="125.0" y="165" width="650" height="82" rx="16" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="450" y="214.0" text-anchor="middle" font-size="22px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">输入：图 1 校验过回调后，取 code 与 BFF 保存的 verifier</tspan></text>
<line x1="450" y1="480" x2="770" y2="480" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="468.0" y="310" width="284" height="158" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="610.0" y="336" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="610.0" dy="0">POST /token</tspan><tspan x="610.0" dy="27">grant_type=</tspan><tspan x="610.0" dy="27">authorization_code + code</tspan><tspan x="610.0" dy="27">callback URI + verifier</tspan><tspan x="610.0" dy="27">confidential client auth</tspan></text>
<circle cx="475" cy="506" r="18" fill="#24415f"/><text x="475" y="513" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">6</text>
<rect x="645.0" y="535" width="250" height="124" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="770" y="560" text-anchor="middle" font-size="21px" font-weight="600" fill="#24415f"><tspan x="770" dy="0">验证 code 与 client</tspan><tspan x="770" dy="27">核对 callback</tspan><tspan x="770" dy="27">匹配 PKCE verifier</tspan><tspan x="770" dy="27">失败：OAuth error</tspan></text>
<line x1="770" y1="800" x2="450" y2="800" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="468.0" y="686" width="284" height="102" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="610.0" y="712" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="610.0" dy="0">ID Token</tspan><tspan x="610.0" dy="27">API Access Token</tspan><tspan x="610.0" dy="27">可能还有 Refresh Token</tspan></text>
<circle cx="745" cy="826" r="18" fill="#24415f"/><text x="745" y="833" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">7</text>
<rect x="275.0" y="820" width="350" height="115" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="450" y="871.0" text-anchor="middle" font-size="22px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">验证签名 · iss · aud · exp · nonce</tspan><tspan x="450" dy="29">用 (iss, sub) 查本地绑定</tspan></text>
<line x1="450" y1="935" x2="450" y2="965" stroke="#738294" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="450,965.0 575.0,1030 450,1095.0 325.0,1030" fill="#f7fafc" stroke="#6e8192" stroke-width="2"/>
<text x="450" y="1018" text-anchor="middle" font-size="22px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">身份与令牌</tspan><tspan x="450" dy="27">均通过？</tspan></text>
<text x="468" y="1108" font-size="20px" font-weight="700" fill="#2f6b53">是</text>
<line x1="450" y1="1095" x2="450" y2="1130" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="275.0" y="1145" width="350" height="100" rx="16" fill="#edf7f1" stroke="#2f6b53" stroke-width="2"/>
<text x="450" y="1189.5" text-anchor="middle" font-size="21px" font-weight="600" fill="#2f6b53"><tspan x="450" dy="0">绑定 user-17 与 API grant</tspan><tspan x="450" dy="27">销毁匿名事务并轮换 session</tspan></text>
<text x="590" y="1018" font-size="20px" font-weight="700" fill="#a63f3f">否</text>
<line x1="575" y1="1030" x2="635" y2="1030" stroke="#a63f3f" stroke-width="3" marker-end="url(#arrow-red)"/>
<rect x="645.0" y="980" width="250" height="102" rx="16" fill="#fff0ef" stroke="#a63f3f" stroke-width="2"/>
<text x="770" y="1025.5" text-anchor="middle" font-size="21px" font-weight="600" fill="#a63f3f"><tspan x="770" dy="0">失败：拒绝身份</tspan><tspan x="770" dy="27">不建立本地会话</tspan></text>
<line x1="450" y1="1245" x2="450" y2="1398" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<line x1="450" y1="1410" x2="130" y2="1410" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="1296" width="284" height="102" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="290.0" y="1322" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="290.0" dy="0">Set-Cookie</tspan><tspan x="290.0" dy="27">__Host-session</tspan><tspan x="290.0" dy="27">固定站内页响应</tspan></text>
<circle cx="425" cy="1436" r="18" fill="#24415f"/><text x="425" y="1443" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">8</text>
</svg>
