<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1722" viewBox="0 48 900 1722" role="img" aria-labelledby="title desc">
<title id="title">BFF 并发安全刷新与 API 请求时序</title>
<desc id="desc">Local sequence diagram with explicit inputs, outputs and a stop condition.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2b668f"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#a63f3f"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2f6b53"/></marker>
  <marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#738294"/></marker>
  <style>text { font-family: Arial, "Noto Sans CJK SC", sans-serif; }</style>
</defs>
<rect x="0" y="48" width="100%" height="100%" fill="#ffffff"/>
<rect x="35" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="150" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="150" dy="0">IdP Token Endpoint</tspan></text>
<line x1="150" y1="142" x2="150" y2="1715" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="335" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="450" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">报表 BFF</tspan></text>
<line x1="450" y1="142" x2="450" y2="1715" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="665" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="780" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="780" dy="0">报表 API</tspan></text>
<line x1="780" y1="142" x2="780" y2="1715" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="300.0" y="175" width="300" height="90" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="450" y="214.0" text-anchor="middle" font-size="21px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">原 API 请求暂存</tspan><tspan x="450" dy="28">发现 Access Token 到期</tspan></text>
<polygon points="450,280.0 560.0,335 450,390.0 340.0,335" fill="#f7fafc" stroke="#6e8192" stroke-width="2"/>
<text x="450" y="323" text-anchor="middle" font-size="22px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">Refresh Token</tspan><tspan x="450" dy="27">存在？</tspan></text>
<text x="468" y="398" font-size="20px" font-weight="700" fill="#2f6b53">有</text>
<line x1="450" y1="390" x2="450" y2="420" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<text x="572" y="323" font-size="20px" font-weight="700" fill="#a63f3f">无</text>
<line x1="560" y1="335" x2="625" y2="335" stroke="#a63f3f" stroke-width="3" marker-end="url(#arrow-red)"/>
<rect x="625.0" y="285" width="270" height="100" rx="16" fill="#fff0ef" stroke="#a63f3f" stroke-width="2"/>
<text x="760" y="316.0" text-anchor="middle" font-size="21px" font-weight="600" fill="#a63f3f"><tspan x="760" dy="0">BFF 无 RT</tspan><tspan x="760" dy="27">不调 IdP/API</tspan><tspan x="760" dy="27">要求重新授权</tspan></text>
<rect x="285.0" y="435" width="330" height="115" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="450" y="473.5" text-anchor="middle" font-size="21px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">发送前按 grant</tspan><tspan x="450" dy="27">跨 worker 互斥/合并</tspan><tspan x="450" dy="27">等待者随后重读会话</tspan></text>
<line x1="450" y1="730" x2="150" y2="730" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="168.0" y="560" width="264" height="158" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="300.0" y="586" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="300.0" dy="0">POST /token</tspan><tspan x="300.0" dy="27">grant_type=</tspan><tspan x="300.0" dy="27">refresh_token</tspan><tspan x="300.0" dy="27">RT + confidential client</tspan><tspan x="300.0" dy="27">authentication over TLS</tspan></text>
<circle cx="425" cy="756" r="18" fill="#24415f"/><text x="425" y="763" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">1</text>
<rect x="20.0" y="790" width="260" height="96" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="150" y="832.0" text-anchor="middle" font-size="21px" font-weight="600" fill="#24415f"><tspan x="150" dy="0">IdP 检查 grant</tspan><tspan x="150" dy="28">按配置轮换 token</tspan></text>
<line x1="150" y1="990" x2="450" y2="990" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="168.0" y="904" width="264" height="74" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="300.0" y="930" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="300.0" dy="0">Token Endpoint 返回</tspan><tspan x="300.0" dy="27">token 或 OAuth error</tspan></text>
<circle cx="175" cy="1016" r="18" fill="#24415f"/><text x="175" y="1023" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">2</text>
<line x1="450" y1="990" x2="450" y2="1008" stroke="#738294" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="450,1010.0 580.0,1085 450,1160.0 320.0,1085" fill="#f7fafc" stroke="#6e8192" stroke-width="2"/>
<text x="450" y="1073" text-anchor="middle" font-size="22px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">BFF 分类</tspan><tspan x="450" dy="27">Token 响应</tspan></text>
<path d="M320 1085 L150 1180" fill="none" stroke="#a63f3f" stroke-width="3" marker-end="url(#arrow-red)"/>
<path d="M450 1160 V1190" fill="none" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<path d="M580 1085 L750 1180" fill="none" stroke="#738294" stroke-width="3" marker-end="url(#arrow-grey)"/>
<rect x="10.0" y="1195" width="280" height="122" rx="16" fill="#fff0ef" stroke="#a63f3f" stroke-width="2"/>
<text x="150" y="1237.0" text-anchor="middle" font-size="21px" font-weight="600" fill="#a63f3f"><tspan x="150" dy="0">invalid_grant</tspan><tspan x="150" dy="27">grant/RT 失效或过期</tspan><tspan x="150" dy="27">不调 API，重新授权</tspan></text>
<rect x="310.0" y="1195" width="280" height="122" rx="16" fill="#edf7f1" stroke="#2f6b53" stroke-width="2"/>
<text x="450" y="1225" text-anchor="middle" font-size="21px" font-weight="600" fill="#2f6b53"><tspan x="450" dy="0">成功：条件写回 AT/RT</tspan><tspan x="450" dy="27">会话有效、grant/版本相符</tspan><tspan x="450" dy="27">失配：丢弃，停止调用</tspan><tspan x="450" dy="27">写回处理完毕，释放锁</tspan></text>
<rect x="610.0" y="1195" width="280" height="122" rx="16" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="750" y="1237.0" text-anchor="middle" font-size="21px" font-weight="600" fill="#738294"><tspan x="750" dy="0">timeout / 5xx / 其他错误</tspan><tspan x="750" dy="27">失败本次调用；不推断失效</tspan><tspan x="750" dy="27">不盲目重发旧 RT</tspan></text>
<text x="430" y="1370" text-anchor="end" font-size="21px" font-weight="600" fill="#2f6b53">仅写回成功</text>
<path d="M450 1317 V1455" fill="none" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<line x1="450" y1="1460" x2="780" y2="1460" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="468.0" y="1374" width="294" height="74" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="615.0" y="1400" text-anchor="middle" font-size="22px" font-weight="600" fill="#2f6b53"><tspan x="615.0" dy="0">新 Access Token</tspan><tspan x="615.0" dy="27">本次调用首次发送原 API 请求</tspan></text>
<circle cx="475" cy="1486" r="18" fill="#24415f"/><text x="475" y="1493" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">3</text>
<line x1="780" y1="1645" x2="450" y2="1645" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="468.0" y="1587" width="294" height="46" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="615.0" y="1613" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="615.0" dy="0">API 响应；不重发旧 token</tspan></text>
<circle cx="755" cy="1671" r="18" fill="#24415f"/><text x="755" y="1678" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">4</text>
</svg>
