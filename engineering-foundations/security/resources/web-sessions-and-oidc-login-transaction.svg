<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1712" viewBox="0 48 900 1712" role="img" aria-labelledby="title desc">
<title id="title">OIDC 授权事务：浏览器绑定与一次性回调</title>
<desc id="desc">Local sequence diagram with explicit inputs, outputs and a stop condition.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2b668f"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#a63f3f"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2f6b53"/></marker>
  <marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#738294"/></marker>
  <style>text { font-family: Arial, "Noto Sans CJK SC", sans-serif; }</style>
</defs>
<rect x="0" y="48" width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="130" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="130" dy="0">浏览器</tspan></text>
<line x1="130" y1="142" x2="130" y2="1720" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="335" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="450" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">报表 BFF</tspan></text>
<line x1="450" y1="142" x2="450" y2="1720" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="655" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="770" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="770" dy="0">固定 IdP</tspan></text>
<line x1="770" y1="142" x2="770" y2="1720" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="130" y1="270" x2="450" y2="270" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="212" width="284" height="46" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="290.0" y="238" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="290.0" dy="0">GET /login</tspan></text>
<circle cx="155" cy="296" r="18" fill="#24415f"/><text x="155" y="303" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">1</text>
<rect x="285.0" y="330" width="330" height="108" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="450" y="365.0" text-anchor="middle" font-size="22px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">建立短期事务：state · nonce</tspan><tspan x="450" dy="27">PKCE verifier · expected iss</tspan><tspan x="450" dy="27">callback · expiry · 未消费</tspan></text>
<line x1="450" y1="535" x2="130" y2="535" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="449" width="284" height="74" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="290.0" y="475" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="290.0" dy="0">Set-Cookie __Host-oidc-tx</tspan><tspan x="290.0" dy="27">＋ 302 到固定授权入口</tspan></text>
<circle cx="425" cy="561" r="18" fill="#24415f"/><text x="425" y="568" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">2</text>
<line x1="130" y1="720" x2="770" y2="720" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="634" width="604" height="74" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="450.0" y="660" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="450.0" dy="0">response_type=code · openid</tspan><tspan x="450.0" dy="27">state · nonce · PKCE S256 challenge</tspan></text>
<circle cx="155" cy="746" r="18" fill="#24415f"/><text x="155" y="753" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">3</text>
<rect x="645.0" y="785" width="250" height="96" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="770" y="827.0" text-anchor="middle" font-size="22px" font-weight="600" fill="#24415f"><tspan x="770" dy="0">IdP 认证用户</tspan><tspan x="770" dy="28">并取得授权/同意</tspan></text>
<line x1="770" y1="1005" x2="130" y2="1005" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="919" width="604" height="74" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="450.0" y="945" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="450.0" dy="0">认证/授权完成后回跳</tspan><tspan x="450.0" dy="27">code + state + iss</tspan></text>
<circle cx="745" cy="1031" r="18" fill="#24415f"/><text x="745" y="1038" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">4</text>
<line x1="130" y1="1210" x2="450" y2="1210" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="1096" width="284" height="102" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="290.0" y="1122" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="290.0" dy="0">GET /oidc/callback</tspan><tspan x="290.0" dy="27">__Host-oidc-tx + code</tspan><tspan x="290.0" dy="27">state + iss</tspan></text>
<circle cx="155" cy="1236" r="18" fill="#24415f"/><text x="155" y="1243" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">5</text>
<rect x="280.0" y="1260" width="340" height="105" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="450" y="1306.5" text-anchor="middle" font-size="22px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">比对浏览器事务、state、iss</tspan><tspan x="450" dy="28">校验有效期并原子消费</tspan></text>
<line x1="450" y1="1365" x2="450" y2="1405" stroke="#738294" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="450,1405.0 575.0,1470 450,1535.0 325.0,1470" fill="#f7fafc" stroke="#6e8192" stroke-width="2"/>
<text x="450" y="1458" text-anchor="middle" font-size="22px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">全部检查</tspan><tspan x="450" dy="27">通过？</tspan></text>
<text x="585" y="1458" font-size="20px" font-weight="700" fill="#2f6b53">是</text>
<line x1="575" y1="1470" x2="630" y2="1470" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="645.0" y="1420" width="250" height="100" rx="16" fill="#edf7f1" stroke="#2f6b53" stroke-width="2"/>
<text x="770" y="1464.5" text-anchor="middle" font-size="21px" font-weight="600" fill="#2f6b53"><tspan x="770" dy="0">通过：交给图 2</tspan><tspan x="770" dy="27">code 与原事务 verifier</tspan></text>
<text x="468" y="1550" font-size="20px" font-weight="700" fill="#a63f3f">否</text>
<line x1="450" y1="1535" x2="450" y2="1575" stroke="#a63f3f" stroke-width="3" marker-end="url(#arrow-red)"/>
<rect x="180.0" y="1588" width="540" height="92" rx="16" fill="#fff0ef" stroke="#a63f3f" stroke-width="2"/>
<text x="450" y="1642.0" text-anchor="middle" font-size="22px" font-weight="600" fill="#a63f3f"><tspan x="450" dy="0">失败：不交换 code，也不创建应用会话</tspan></text>
</svg>
