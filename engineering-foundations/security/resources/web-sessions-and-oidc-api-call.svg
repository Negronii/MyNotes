<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1442" viewBox="0 48 900 1442" role="img" aria-labelledby="title desc">
<title id="title">浏览器会话 Cookie 到 BFF，再到报表 API</title>
<desc id="desc">Local sequence diagram with explicit inputs, outputs and a stop condition.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2b668f"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#a63f3f"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2f6b53"/></marker>
  <marker id="arrow-grey" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#738294"/></marker>
  <style>text { font-family: Arial, "Noto Sans CJK SC", sans-serif; }</style>
</defs>
<rect x="0" y="48" width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="130" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="130" dy="0">浏览器</tspan></text>
<line x1="130" y1="142" x2="130" y2="1395" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="335" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="450" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">报表 BFF</tspan></text>
<line x1="450" y1="142" x2="450" y2="1395" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="655" y="71" width="230" height="68" rx="14" fill="#f5f8fb" stroke="#9aaaba" stroke-width="2"/>
<text x="770" y="111" text-anchor="middle" font-size="23px" font-weight="700" fill="#24415f"><tspan x="770" dy="0">报表 API</tspan></text>
<line x1="770" y1="142" x2="770" y2="1395" stroke="#bcc8d3" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="130" y1="300" x2="450" y2="300" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="186" width="284" height="102" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="290.0" y="212" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="290.0" dy="0">Cookie · 只读 GET</tspan><tspan x="290.0" dy="27">路径是用户选择值</tspan><tspan x="290.0" dy="27">tenant-a / report 42</tspan></text>
<circle cx="155" cy="326" r="18" fill="#24415f"/><text x="155" y="333" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">1</text>
<rect x="290.0" y="365" width="320" height="92" rx="16" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="450" y="405.0" text-anchor="middle" font-size="22px" font-weight="600" fill="#24415f"><tspan x="450" dy="0">查仍有效的本地会话</tspan><tspan x="450" dy="28">读取绑定的 API token</tspan></text>
<line x1="450" y1="457" x2="450" y2="485" stroke="#738294" stroke-width="3" marker-end="url(#arrow)"/>
<polygon points="450,485.0 575.0,550 450,615.0 325.0,550" fill="#f7fafc" stroke="#6e8192" stroke-width="2"/>
<text x="450" y="538" text-anchor="middle" font-size="22px" font-weight="700" fill="#24415f"><tspan x="450" dy="0">Access Token</tspan><tspan x="450" dy="27">尚未到期？</tspan></text>
<text x="598" y="538" font-size="20px" font-weight="700" fill="#2f6b53">是</text>
<path d="M575 550 H650 V950" fill="none" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<text x="467" y="631" font-size="20px" font-weight="700" fill="#a63f3f">否</text>
<line x1="450" y1="615" x2="450" y2="665" stroke="#a63f3f" stroke-width="3" marker-end="url(#arrow-red)"/>
<rect x="270.0" y="680" width="360" height="95" rx="16" fill="#fff0ef" stroke="#a63f3f" stroke-width="2"/>
<text x="450" y="735.5" text-anchor="middle" font-size="21px" font-weight="600" fill="#a63f3f"><tspan x="450" dy="0">到期：先走图 4；此时不发 API 请求</tspan></text>
<line x1="450" y1="950" x2="770" y2="950" stroke="#2f6b53" stroke-width="3" marker-end="url(#arrow-green)"/>
<rect x="468.0" y="836" width="284" height="102" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="610.0" y="862" text-anchor="middle" font-size="22px" font-weight="600" fill="#2f6b53"><tspan x="610.0" dy="0">Access Token 尚未到期</tspan><tspan x="610.0" dy="27">Authorization: Bearer</tspan><tspan x="610.0" dy="27">API Access Token</tspan></text>
<circle cx="475" cy="976" r="18" fill="#24415f"/><text x="475" y="983" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">2</text>
<line x1="770" y1="1170" x2="450" y2="1170" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="468.0" y="1029" width="284" height="129" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="610.0" y="1055" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="610.0" dy="0">先验证 bearer</tspan><tspan x="610.0" dy="27">再识别 user-17</tspan><tspan x="610.0" dy="27">检查成员和报表关系</tspan><tspan x="610.0" dy="27">返回授权结果或拒绝</tspan></text>
<circle cx="745" cy="1196" r="18" fill="#24415f"/><text x="745" y="1203" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">3</text>
<line x1="450" y1="1360" x2="130" y2="1360" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="148.0" y="1302" width="284" height="46" rx="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1"/>
<text x="290.0" y="1328" text-anchor="middle" font-size="22px" font-weight="600" fill="#263746"><tspan x="290.0" dy="0">BFF 返回本次响应</tspan></text>
<circle cx="425" cy="1386" r="18" fill="#24415f"/><text x="425" y="1393" text-anchor="middle" font-size="21px" font-weight="700" fill="#ffffff">4</text>
</svg>
