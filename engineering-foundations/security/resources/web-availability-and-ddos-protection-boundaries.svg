<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1170" viewBox="0 0 900 1170" role="img" aria-labelledby="title desc">
<title id="title">拒绝服务防护的流量观察点与控制边界</title>
<desc id="desc">请求依次经过 ISP 接入、边缘代理、API 和数据库队列。每层只处理已到达该层的流量，并根据该层信号执行控制。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 z" fill="#2b668f"/></marker>
  <style>text { font-family: Arial, "Noto Sans CJK SC", sans-serif; }</style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="46" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="29px" font-weight="700" fill="#24415f"><tspan x="42" dy="0">流量经过的每一层，都有自己的观察点和控制点</tspan></text>
<text x="450" y="83" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="500" fill="#526276"><tspan x="450" dy="0">请求向下；本层控制只影响已到达本层的流量</tspan></text>
<rect x="70" y="112" width="760" height="190" rx="20" fill="#ffffff" stroke="#9c5e1a" stroke-width="3"/>
<text x="100" y="150" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="27px" font-weight="700" fill="#24415f"><tspan x="100" dy="0">1 · ISP 与接入链路</tspan></text>
<rect x="100" y="170" width="315" height="105" rx="12" fill="#f5f8fb" stroke="#aebbc7" stroke-width="2"/>
<rect x="445" y="170" width="355" height="105" rx="12" fill="#fff6e9" stroke="#9c5e1a" stroke-width="2"/>
<text x="257" y="196" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#263746"><tspan x="257" dy="0">观察信号</tspan><tspan x="257" dy="28">比特/秒、包/秒</tspan><tspan x="257" dy="28">链路占用、丢包</tspan></text>
<text x="622" y="196" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#9c5e1a"><tspan x="622" dy="0">可执行控制</tspan><tspan x="622" dy="28">清洗、过滤、改路</tspan><tspan x="622" dy="28">要在饱和链路上游</tspan></text>
<line x1="450" y1="302" x2="450" y2="367" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="510" y="342" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="19px" font-weight="500" fill="#526276"><tspan x="510" dy="0">继续放行的流量</tspan></text>
<rect x="70" y="377" width="760" height="190" rx="20" fill="#ffffff" stroke="#2b668f" stroke-width="3"/>
<text x="100" y="415" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="27px" font-weight="700" fill="#24415f"><tspan x="100" dy="0">2 · 边缘代理、CDN 与 WAF</tspan></text>
<rect x="100" y="435" width="315" height="105" rx="12" fill="#f5f8fb" stroke="#aebbc7" stroke-width="2"/>
<rect x="445" y="435" width="355" height="105" rx="12" fill="#edf5fb" stroke="#2b668f" stroke-width="2"/>
<text x="257" y="461" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#263746"><tspan x="257" dy="0">观察信号</tspan><tspan x="257" dy="28">连接、握手数</tspan><tspan x="257" dy="28">HTTP 请求数/秒</tspan></text>
<text x="622" y="461" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#24415f"><tspan x="622" dy="0">可执行控制</tspan><tspan x="622" dy="28">大小/超时/规则</tspan><tspan x="622" dy="28">缓存可共享内容</tspan></text>
<line x1="450" y1="567" x2="450" y2="632" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="510" y="607" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="19px" font-weight="500" fill="#526276"><tspan x="510" dy="0">继续放行的请求</tspan></text>
<rect x="70" y="642" width="760" height="190" rx="20" fill="#ffffff" stroke="#2f6b53" stroke-width="3"/>
<text x="100" y="680" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="27px" font-weight="700" fill="#24415f"><tspan x="100" dy="0">3 · API 与报表业务</tspan></text>
<rect x="100" y="700" width="315" height="105" rx="12" fill="#f5f8fb" stroke="#aebbc7" stroke-width="2"/>
<rect x="445" y="700" width="355" height="105" rx="12" fill="#edf7f1" stroke="#2f6b53" stroke-width="2"/>
<text x="257" y="726" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#263746"><tspan x="257" dy="0">观察信号</tspan><tspan x="257" dy="28">主体、租户、路由</tspan><tspan x="257" dy="28">估算成本、延迟</tspan></text>
<text x="622" y="726" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#24415f"><tspan x="622" dy="0">可执行控制</tspan><tspan x="622" dy="28">先授权，再限工作</tspan><tspan x="622" dy="28">速率/并发/有界队列</tspan></text>
<line x1="450" y1="832" x2="450" y2="897" stroke="#2b668f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="510" y="872" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="19px" font-weight="500" fill="#526276"><tspan x="510" dy="0">进入依赖的工作</tspan></text>
<rect x="70" y="907" width="760" height="190" rx="20" fill="#ffffff" stroke="#24415f" stroke-width="3"/>
<text x="100" y="945" text-anchor="start" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="27px" font-weight="700" fill="#24415f"><tspan x="100" dy="0">4 · 数据库、缓存与工作进程</tspan></text>
<rect x="100" y="965" width="315" height="105" rx="12" fill="#f5f8fb" stroke="#aebbc7" stroke-width="2"/>
<rect x="445" y="965" width="355" height="105" rx="12" fill="#edf1f5" stroke="#24415f" stroke-width="2"/>
<text x="257" y="991" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#263746"><tspan x="257" dy="0">观察信号</tspan><tspan x="257" dy="28">连接等待、处理器使用</tspan><tspan x="257" dy="28">队列长度、最老任务年龄</tspan></text>
<text x="622" y="991" text-anchor="middle" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="21px" font-weight="600" fill="#24415f"><tspan x="622" dy="0">可执行控制</tspan><tspan x="622" dy="28">限制运行与等待</tspan><tspan x="622" dy="28">满载时拒绝新工作</tspan></text>
</svg>
