<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc"><title id="title">预检决定本次自定义请求能否继续</title><desc id="desc">credentials include且有X-Report-View，无预检缓存时先发送无Cookie的OPTIONS；浏览器检查响应的许可字段，成功后才发送实际GET，否则Fetch TypeError且无实际GET。</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627c9e"/></marker><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#26374d;font-size:22px}.label{font-size:24px;font-weight:600}.code{font-family:Menlo,monospace;font-size:20px}.edge{fill:none;stroke:#627c9e;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}</style></defs><rect width="900" height="720" rx="14" fill="#f8fafc"/><rect x="30" y="24" width="840" height="130" rx="14" fill="#edf4ff" stroke="#c6d9f5" stroke-width="2"/><text x="54" y="62" class="label">控制台发起跨源 Fetch</text><text x="54" y="102" class="code">GET · X-Report-View: compact</text><text x="54" y="136" class="code">credentials: include</text><path class="edge" d="M450 154V204"/><rect x="30" y="210" width="840" height="140" rx="14" fill="#ffffff" stroke="#ccd7e5" stroke-width="2"/><text x="54" y="248" class="label">无可用预检缓存：先发送 OPTIONS</text><text x="54" y="288" class="">声明控制台 Origin、GET 与自定义请求头</text><text x="54" y="322" class="">不带用户 Cookie；尚未发送实际 GET</text><path class="edge" d="M450 350V400"/><rect x="30" y="406" width="840" height="130" rx="14" fill="#ffffff" stroke="#ccd7e5" stroke-width="2"/><text x="54" y="444" class="label">API 返回预检响应，浏览器核对许可</text><text x="54" y="484" class="">核对来源与凭据模式，并允许 X-Report-View 请求头</text><path class="edge" d="M450 536V576H235V616"/><path class="edge" d="M450 576H665V616"/><rect x="30" y="622" width="410" height="80" rx="14" fill="#fff2ef" stroke="#e2b3a9" stroke-width="2"/><text x="54" y="660" class="label">不通过：不发 GET</text><rect x="460" y="622" width="410" height="80" rx="14" fill="#eef8f3" stroke="#a8d5c2" stroke-width="2"/><text x="484" y="660" class="label">通过：进入实际 GET</text></svg>
