<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
  <title id="title">数组和指针链表的内存访问布局</title>
  <desc id="desc">教学模型使用四个时长值、64 字节缓存行与合成地址。数组的四项位于同一缓存行；链表的四个节点分散在四条缓存行，next 字段依次给出下一个节点的地址，直到空指针停止。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6d86a5"/>
    </marker>
    <style>
      text { font-family: Arial, "Heiti SC", "PingFang SC", sans-serif; fill: #24364b; }
      .title { font-size: 20px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #52657c; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; }
      .small { font-size: 12px; fill: #52657c; }
      .addr { font-size: 12px; fill: #53667f; }
      .value { font-size: 18px; font-weight: 700; }
      .nodeHead { font-size: 13px; font-weight: 700; }
      .field { font-size: 12px; }
      .note { font-size: 13px; fill: #334a64; }
    </style>
  </defs>
  <rect width="760" height="690" fill="#f8fafc"/>
  <text class="subtitle" x="28" y="38">教学模型：64B 缓存行；duration 与 next 各 8B；地址为合成值，未测性能</text>

  <rect x="20" y="78" width="720" height="205" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
  <text class="head" x="34" y="105">A　数组：四项相邻，落在同一条 64B 缓存行内</text>
  <text class="small" x="34" y="130">缓存行 [0x1000, 0x1040)</text>
  <rect x="34" y="143" width="680" height="62" rx="8" fill="#edf3fa" stroke="#96abc4" stroke-width="1.4"/>
  <rect x="34" y="143" width="340" height="62" rx="8" fill="#e6f1fb" stroke="#96abc4" stroke-width="1.2"/>
  <line x1="119" y1="143" x2="119" y2="205" stroke="#b8c7d9"/>
  <line x1="204" y1="143" x2="204" y2="205" stroke="#b8c7d9"/>
  <line x1="289" y1="143" x2="289" y2="205" stroke="#b8c7d9"/>
  <text class="small" x="76.5" y="161" text-anchor="middle">i = 0</text>
  <text class="addr" x="76.5" y="178" text-anchor="middle">0x1000</text>
  <text class="value" x="76.5" y="198" text-anchor="middle">4</text>
  <text class="small" x="161.5" y="161" text-anchor="middle">i = 1</text>
  <text class="addr" x="161.5" y="178" text-anchor="middle">0x1008</text>
  <text class="value" x="161.5" y="198" text-anchor="middle">7</text>
  <text class="small" x="246.5" y="161" text-anchor="middle">i = 2</text>
  <text class="addr" x="246.5" y="178" text-anchor="middle">0x1010</text>
  <text class="value" x="246.5" y="198" text-anchor="middle">1</text>
  <text class="small" x="331.5" y="161" text-anchor="middle">i = 3</text>
  <text class="addr" x="331.5" y="178" text-anchor="middle">0x1018</text>
  <text class="value" x="331.5" y="198" text-anchor="middle">3</text>
  <rect x="374" y="143" width="340" height="62" rx="8" fill="#f5f7fa" stroke="#d7e0ea"/>
  <text class="label" x="544" y="179" text-anchor="middle">同一行中的其它 32B</text>
  <text class="note" x="34" y="234">地址由 base + i × 8B 算出；若该行缺失，一次填充就覆盖这四个时长。</text>
  <text class="small" x="34" y="260">两种表示的合成输入都是 [4, 7, 1, 3]，合计 15。</text>

  <rect x="20" y="297" width="720" height="373" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
  <text class="head" x="34" y="324">B　链表：每条缓存行给出当前节点；next 给出下一个地址</text>

  <text class="small" x="34" y="350">64B 缓存行 @ 0x2000</text>
  <rect x="34" y="358" width="300" height="25" rx="5" fill="#f2f5f8" stroke="#aab9ca"/>
  <rect x="34" y="358" width="75" height="25" rx="5" fill="#fff1dc" stroke="#d6a462"/>
  <line x1="109" y1="358" x2="109" y2="383" stroke="#aab9ca"/>
  <line x1="184" y1="358" x2="184" y2="383" stroke="#c4d0dc"/>
  <line x1="259" y1="358" x2="259" y2="383" stroke="#c4d0dc"/>
  <text class="small" x="71.5" y="375" text-anchor="middle">A · 16B</text>
  <text class="small" x="221.5" y="375" text-anchor="middle">节点外 48B</text>
  <rect x="350" y="335" width="360" height="54" rx="8" fill="#fffaf2" stroke="#e3c99d"/>
  <text class="nodeHead" x="365" y="354">节点 A</text>
  <text class="addr" x="695" y="354" text-anchor="end">@ 0x2000</text>
  <rect x="362" y="360" width="122" height="22" rx="5" fill="#fff1dc" stroke="#e4c89a"/>
  <rect x="492" y="360" width="206" height="22" rx="5" fill="#f2ebfb" stroke="#cbb8e6"/>
  <text class="field" x="373" y="375">duration = 4</text>
  <text class="field" x="503" y="375">next = 0x5080</text>

  <path d="M595,383 L595,424" fill="none" stroke="#6d86a5" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text class="small" x="34" y="439">64B 缓存行 @ 0x5080</text>
  <rect x="34" y="447" width="300" height="25" rx="5" fill="#f2f5f8" stroke="#aab9ca"/>
  <rect x="34" y="447" width="75" height="25" rx="5" fill="#fff1dc" stroke="#d6a462"/>
  <line x1="109" y1="447" x2="109" y2="472" stroke="#aab9ca"/>
  <line x1="184" y1="447" x2="184" y2="472" stroke="#c4d0dc"/>
  <line x1="259" y1="447" x2="259" y2="472" stroke="#c4d0dc"/>
  <text class="small" x="71.5" y="464" text-anchor="middle">B · 16B</text>
  <text class="small" x="221.5" y="464" text-anchor="middle">节点外 48B</text>
  <rect x="350" y="424" width="360" height="54" rx="8" fill="#fffaf2" stroke="#e3c99d"/>
  <text class="nodeHead" x="365" y="443">节点 B</text>
  <text class="addr" x="695" y="443" text-anchor="end">@ 0x5080</text>
  <rect x="362" y="449" width="122" height="22" rx="5" fill="#fff1dc" stroke="#e4c89a"/>
  <rect x="492" y="449" width="206" height="22" rx="5" fill="#f2ebfb" stroke="#cbb8e6"/>
  <text class="field" x="373" y="464">duration = 7</text>
  <text class="field" x="503" y="464">next = 0x30C0</text>

  <path d="M595,472 L595,513" fill="none" stroke="#6d86a5" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text class="small" x="34" y="528">64B 缓存行 @ 0x30C0</text>
  <rect x="34" y="536" width="300" height="25" rx="5" fill="#f2f5f8" stroke="#aab9ca"/>
  <rect x="34" y="536" width="75" height="25" rx="5" fill="#fff1dc" stroke="#d6a462"/>
  <line x1="109" y1="536" x2="109" y2="561" stroke="#aab9ca"/>
  <line x1="184" y1="536" x2="184" y2="561" stroke="#c4d0dc"/>
  <line x1="259" y1="536" x2="259" y2="561" stroke="#c4d0dc"/>
  <text class="small" x="71.5" y="553" text-anchor="middle">C · 16B</text>
  <text class="small" x="221.5" y="553" text-anchor="middle">节点外 48B</text>
  <rect x="350" y="513" width="360" height="54" rx="8" fill="#fffaf2" stroke="#e3c99d"/>
  <text class="nodeHead" x="365" y="532">节点 C</text>
  <text class="addr" x="695" y="532" text-anchor="end">@ 0x30C0</text>
  <rect x="362" y="538" width="122" height="22" rx="5" fill="#fff1dc" stroke="#e4c89a"/>
  <rect x="492" y="538" width="206" height="22" rx="5" fill="#f2ebfb" stroke="#cbb8e6"/>
  <text class="field" x="373" y="553">duration = 1</text>
  <text class="field" x="503" y="553">next = 0x7000</text>

  <path d="M595,561 L595,602" fill="none" stroke="#6d86a5" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text class="small" x="34" y="617">64B 缓存行 @ 0x7000</text>
  <rect x="34" y="625" width="300" height="25" rx="5" fill="#f2f5f8" stroke="#aab9ca"/>
  <rect x="34" y="625" width="75" height="25" rx="5" fill="#fff1dc" stroke="#d6a462"/>
  <line x1="109" y1="625" x2="109" y2="650" stroke="#aab9ca"/>
  <line x1="184" y1="625" x2="184" y2="650" stroke="#c4d0dc"/>
  <line x1="259" y1="625" x2="259" y2="650" stroke="#c4d0dc"/>
  <text class="small" x="71.5" y="642" text-anchor="middle">D · 16B</text>
  <text class="small" x="221.5" y="642" text-anchor="middle">节点外 48B</text>
  <rect x="350" y="602" width="360" height="54" rx="8" fill="#fffaf2" stroke="#e3c99d"/>
  <text class="nodeHead" x="365" y="621">节点 D</text>
  <text class="addr" x="695" y="621" text-anchor="end">@ 0x7000</text>
  <rect x="362" y="627" width="122" height="22" rx="5" fill="#fff1dc" stroke="#e4c89a"/>
  <rect x="492" y="627" width="206" height="22" rx="5" fill="#eef7f3" stroke="#abd3c2"/>
  <text class="field" x="373" y="642">duration = 3</text>
  <text class="field" x="503" y="642">next = NULL · stop</text>
</svg>
