<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">work_item A 的成员布局和 container_of 地址还原</title>
  <desc id="desc">教学假设下，A 的 id 位于 0x1000，ready_link 位于 0x1008，audit_link 位于 0x1018。list_head 的两个指针成员分别位于成员起始地址和其后 8 字节。用正确的成员偏移从 ready_link 或 audit_link 地址都能还原 A 的基址 0x1000。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .panel { fill: #fff; stroke: #d8e1ec; stroke-width: 2; }
      .header { font-size: 21px; font-weight: 700; }
      .label { font-size: 18px; }
      .value { font-size: 17px; }
      .note { font-size: 16px; fill: #53657d; }
      .row { fill: #f8fafc; stroke: #d7e0ea; stroke-width: 1; }
      .ready { fill: #eaf2fb; stroke: #8caed2; stroke-width: 1.2; }
      .audit { fill: #f1eaff; stroke: #b7a2dc; stroke-width: 1.2; }
      .formula { fill: #fff8e8; stroke: #e0bd69; stroke-width: 1.2; }
      .divider { stroke: #d8e1ec; stroke-width: 1; }
    </style>
  </defs>
  <rect width="980" height="340" fill="#f7f9fc"/>
  <text class="note" x="28" y="32">教学模型：64 位指针 8 B、u64 8 B、无填充；地址不代表某台机器的真实布局</text>

  <rect class="panel" x="22" y="52" width="474" height="266" rx="14"/>
  <text class="header" x="42" y="82">work_item A @ 0x1000</text>
  <text class="note" x="42" y="105">范围 [0x1000, 0x1028)，共 40 B</text>

  <rect class="row" x="40" y="118" width="438" height="46" rx="7"/>
  <text class="label" x="54" y="147">id = 4</text>
  <text class="value mono" x="260" y="147">0x1000</text>

  <rect class="ready" x="40" y="170" width="438" height="65" rx="7"/>
  <text class="label" x="54" y="197">ready_link</text>
  <text class="value mono" x="260" y="197">成员 @ 0x1008</text>
  <text class="note mono" x="54" y="222">next 字段 @ 0x1008　prev 字段 @ 0x1010</text>

  <rect class="audit" x="40" y="241" width="438" height="65" rx="7"/>
  <text class="label" x="54" y="268">audit_link</text>
  <text class="value mono" x="260" y="268">成员 @ 0x1018</text>
  <text class="note mono" x="54" y="293">next 字段 @ 0x1018　prev 字段 @ 0x1020</text>

  <rect class="panel" x="514" y="52" width="444" height="266" rx="14"/>
  <text class="header" x="534" y="82">按成员偏移还原外层对象</text>
  <text class="value mono" x="536" y="120">&amp;A.ready_link = 0x1008</text>
  <text class="value mono" x="536" y="149">offsetof(work_item, ready_link) = 8 B</text>
  <text class="value mono" x="536" y="178">0x1008 - 8 = A @ 0x1000</text>
  <line class="divider" x1="536" y1="194" x2="934" y2="194"/>
  <text class="value mono" x="536" y="224">&amp;A.audit_link = 0x1018</text>
  <text class="value mono" x="536" y="253">offsetof(work_item, audit_link) = 24 B</text>
  <text class="value mono" x="536" y="282">0x1018 - 24 = A @ 0x1000</text>
</svg>
