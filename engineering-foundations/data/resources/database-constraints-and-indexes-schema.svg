<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="924" viewBox="0 0 1100 924" role="img" aria-labelledby="schema-title schema-desc">
  <title id="schema-title">四张表的键与约束</title>
  <desc id="schema-desc">accounts 与 inventory 是父表。reservations.account_id 与 report_jobs.account_id 引用 accounts.account_id，reservations.sku 引用 inventory.sku；箭头从外键列指向被引用的主键。reservations 以 (account_id, principal_id, idempotency_key) 为复合主键；report_jobs 以 job_id 为主键，同一组作用域列另有唯一约束 report_jobs_idempotency_scope_key。两张表的 principal_id 都没有外键。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#3b5b72"/>
    </marker>
    <marker id="arrow-g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#4f7a62"/>
    </marker>
    <style>
      .canvas { fill: #f7f9fc; }
      .table { fill: #fff; stroke: #b8c7d6; stroke-width: 2.5; }
      .head { fill: #e7eff8; }
      .line { stroke: #c7d2de; stroke-width: 1.5; }
      .edge { fill: none; stroke: #3b5b72; stroke-width: 3; marker-end: url(#arrow); }
      .edge-g { fill: none; stroke: #4f7a62; stroke-width: 3; marker-end: url(#arrow-g); }
      .t { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; fill: #1f2937; }
      .name { font-size: 30px; font-weight: 700; }
      .col { font-size: 25px; }
      .tag { font-size: 23px; font-weight: 700; fill: #34536a; }
      .note { font-size: 22px; fill: #475569; }
    </style>
  </defs>
  <rect class="canvas" x="0" y="0" width="1100" height="924" rx="20"/>

  <text class="t note" x="40" y="62">箭头：外键列 → 被引用的父表主键</text>

  <!-- Foreign-key edges: child column to parent key -->
  <path class="edge" d="M560 183 H505 V241 H454"/>
  <path class="edge" d="M560 591 H505 V241 H454"/>
  <path class="edge-g" d="M560 747 H454"/>

  <!-- Parent tables -->
  <g>
    <rect class="table" x="40" y="150" width="410" height="180" rx="13"/>
    <path class="head" d="M53 150 H437 Q450 150 450 163 V206 H40 V163 Q40 150 53 150Z"/>
    <line class="line" x1="40" y1="206" x2="450" y2="206"/>
    <text class="t name" x="64" y="189">accounts</text>
    <text class="t col" x="64" y="250">account_id</text><text class="t tag" x="426" y="250" text-anchor="end">PK</text>
    <text class="t note" x="64" y="302">每个账户一行</text>
  </g>
  <g>
    <rect class="table" x="40" y="656" width="410" height="182" rx="13"/>
    <path class="head" d="M53 656 H437 Q450 656 450 669 V712 H40 V669 Q40 656 53 656Z"/>
    <line class="line" x1="40" y1="712" x2="450" y2="712"/>
    <text class="t name" x="64" y="695">inventory</text>
    <text class="t col" x="64" y="756">sku</text><text class="t tag" x="426" y="756" text-anchor="end">PK</text>
    <text class="t col" x="64" y="808">available</text><text class="t tag" x="426" y="808" text-anchor="end">NOT NULL + CHECK</text>
  </g>

  <!-- Child tables -->
  <g>
    <rect class="table" x="560" y="40" width="500" height="412" rx="13"/>
    <path class="head" d="M573 40 H1047 Q1060 40 1060 53 V96 H560 V53 Q560 40 573 40Z"/>
    <line class="line" x1="560" y1="96" x2="1060" y2="96"/>
    <text class="t name" x="584" y="79">report_jobs</text>
    <text class="t col" x="584" y="140">job_id</text><text class="t tag" x="1036" y="140" text-anchor="end">PK</text>
    <text class="t col" x="584" y="192">account_id</text><text class="t tag" x="1036" y="192" text-anchor="end">FK · UNIQUE</text>
    <text class="t col" x="584" y="244">principal_id</text><text class="t tag" x="1036" y="244" text-anchor="end">UNIQUE · 无 FK</text>
    <text class="t col" x="584" y="296">idempotency_key</text><text class="t tag" x="1036" y="296" text-anchor="end">UNIQUE</text>
    <text class="t col" x="584" y="348">status</text><text class="t tag" x="1036" y="348" text-anchor="end">NOT NULL + CHECK</text>
    <line class="line" x1="584" y1="370" x2="1036" y2="370"/>
    <text class="t note" x="584" y="400">UNIQUE = 三列作用域键，约束名</text>
    <text class="t note" x="584" y="432">report_jobs_idempotency_scope_key</text>
  </g>
  <g>
    <rect class="table" x="560" y="500" width="500" height="384" rx="13"/>
    <path class="head" d="M573 500 H1047 Q1060 500 1060 513 V556 H560 V513 Q560 500 573 500Z"/>
    <line class="line" x1="560" y1="556" x2="1060" y2="556"/>
    <text class="t name" x="584" y="539">reservations</text>
    <text class="t col" x="584" y="600">account_id</text><text class="t tag" x="1036" y="600" text-anchor="end">FK · PK</text>
    <text class="t col" x="584" y="652">principal_id</text><text class="t tag" x="1036" y="652" text-anchor="end">PK · 无 FK</text>
    <text class="t col" x="584" y="704">idempotency_key</text><text class="t tag" x="1036" y="704" text-anchor="end">PK</text>
    <text class="t col" x="584" y="756">sku</text><text class="t tag" x="1036" y="756" text-anchor="end">FK</text>
    <text class="t col" x="584" y="808">status</text><text class="t tag" x="1036" y="808" text-anchor="end">NOT NULL + CHECK</text>
    <line class="line" x1="584" y1="830" x2="1036" y2="830"/>
    <text class="t note" x="584" y="860">PK = 上面三列组成的复合主键</text>
  </g>
</svg>
