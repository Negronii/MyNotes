<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7187a8"/></marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #24344d; }
    .head { font-size: 16px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 13px; fill: #526681; }
    .state { font-family: "Noto Sans Mono CJK SC", monospace; font-size: 13px; fill: #526681; text-anchor: end; }
    .mono { font-family: "Noto Sans Mono CJK SC", monospace; font-size: 15px; }
    .panel { fill: #fff; stroke: #d5dfeb; stroke-width: 2; }
    .node { fill: #edf4fb; stroke: #91a8c4; stroke-width: 1.5; }
    .line { stroke: #7187a8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="720" height="540" fill="#fbfcfe"/>

<rect class="panel" x="24" y="16" width="672" height="118" rx="12"/>
<text class="head" x="42" y="42">1. enqueue(e07)</text><text class="state" x="678" y="42">length = 1</text>
<text class="small" x="42" y="66">空队列先让 head 指向新节点，tail 随后也指向它。</text>
<text class="label" x="42" y="107">head</text><path class="line" d="M86 102 L130 102"/>
<rect class="node" x="132" y="79" width="170" height="46" rx="8"/><text class="mono" x="146" y="108">e07 | next=null</text>
<path class="line" d="M370 102 L304 102"/><text class="label" x="378" y="107">tail</text>

<rect class="panel" x="24" y="146" width="672" height="118" rx="12"/>
<text class="head" x="42" y="172">2. enqueue(e03)</text><text class="state" x="678" y="172">length = 2</text>
<text class="small" x="42" y="196">旧 tail 的 next 接上新节点，再把 tail 移到 e03。</text>
<text class="label" x="42" y="237">head</text><path class="line" d="M86 232 L130 232"/>
<rect class="node" x="132" y="209" width="130" height="46" rx="8"/><text class="mono" x="146" y="238">e07</text>
<path class="line" d="M262 232 L320 232"/><text class="small" x="276" y="223">next</text>
<rect class="node" x="322" y="209" width="170" height="46" rx="8"/><text class="mono" x="336" y="238">e03 | next=null</text>
<path class="line" d="M560 232 L494 232"/><text class="label" x="568" y="237">tail</text>

<rect class="panel" x="24" y="276" width="672" height="118" rx="12"/>
<text class="head" x="42" y="302">3. dequeue() returns e07</text><text class="state" x="678" y="302">length = 1</text>
<text class="small" x="42" y="326">head 跳到 e07.next；队列仍非空，所以 tail 保持在 e03。</text>
<text class="label" x="42" y="367">head</text><path class="line" d="M86 362 L130 362"/>
<rect class="node" x="132" y="339" width="170" height="46" rx="8"/><text class="mono" x="146" y="368">e03 | next=null</text>
<path class="line" d="M370 362 L304 362"/><text class="label" x="378" y="367">tail</text>

<rect class="panel" x="24" y="406" width="672" height="118" rx="12"/>
<text class="head" x="42" y="432">4. dequeue() returns e03</text><text class="state" x="678" y="432">length = 0</text>
<text class="small" x="42" y="456">head 变成 null；这是最后一项，必须同步把 tail 清成 null。</text>
<text class="mono" x="42" y="497">head = null</text><text class="mono" x="200" y="497">tail = null</text>
<text class="small" x="360" y="496">空状态：isEmpty 为真</text>
</svg>
