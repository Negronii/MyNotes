<svg xmlns="http://www.w3.org/2000/svg" width="720" height="482" viewBox="0 0 720 482">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c07a2c"/></marker>
  <style>
    text { font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #24344d; }
    .head { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #526681; }
    .idx { font-size: 13px; fill: #526681; text-anchor: middle; }
    .ptr { font-size: 14px; font-weight: 700; fill: #b06a1f; }
    .mono { font-family: "Noto Sans Mono CJK SC", monospace; font-size: 15px; text-anchor: middle; }
    .out { font-size: 13px; fill: #7a8798; text-anchor: middle; }
    .panel { fill: #fff; stroke: #d5dfeb; stroke-width: 2; }
    .empty { fill: #f1f3f6; stroke: #aeb9c7; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .active { fill: #e7f5ef; stroke: #58a88a; stroke-width: 2; }
    .ptrline { stroke: #c07a2c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .bound { stroke: #9aa8ba; stroke-width: 1.5; stroke-dasharray: 4 3; }
  </style>
</defs>
<rect width="720" height="482" fill="#fbfcfe"/>
<rect class="panel" x="24" y="16" width="672" height="142" rx="12"/>
<text class="head" x="42" y="42">开始：items = [null, undefined]，head = 0</text>
<text class="small" x="42" y="64">有效区间 [0, 2)，有 2 项；即使第二项是 undefined，也仍是队列值。</text>
<text class="idx" x="222" y="88">index 0</text>
<rect class="active" x="152" y="94" width="140" height="30" rx="4"/><text class="mono" x="222" y="114">null</text>
<text class="idx" x="382" y="88">index 1</text>
<rect class="active" x="312" y="94" width="140" height="30" rx="4"/><text class="mono" x="382" y="114">undefined</text>
<line class="bound" x1="462" y1="90" x2="462" y2="128"/><text class="small" x="470" y="114">length = 2</text>
<path class="ptrline" d="M222 150 L222 128"/><text class="ptr" x="230" y="148">head = 0</text>
<rect class="panel" x="24" y="170" width="672" height="142" rx="12"/>
<text class="head" x="42" y="196">dequeue() returns null；槽 0 改为 undefined，head 前进到 1</text>
<text class="small" x="42" y="218">有效区间 [1, 2)，还有一项；已消费的数组位置仍存在，但已不属于队列。</text>
<text class="idx" x="222" y="242">index 0</text>
<rect class="empty" x="152" y="248" width="140" height="30" rx="4"/><text class="out" x="222" y="268">队列区间外</text>
<text class="idx" x="382" y="242">index 1</text>
<rect class="active" x="312" y="248" width="140" height="30" rx="4"/><text class="mono" x="382" y="268">undefined</text>
<line class="bound" x1="462" y1="244" x2="462" y2="282"/><text class="small" x="470" y="268">length = 2</text>
<path class="ptrline" d="M382 304 L382 282"/><text class="ptr" x="390" y="302">head = 1</text>
<rect class="panel" x="24" y="324" width="672" height="142" rx="12"/>
<text class="head" x="42" y="350">dequeue() returns 已存的 undefined；head 前进到 2</text>
<text class="small" x="42" y="372">有效区间 [2, 2) 为空；head 到达长度，两个数组位置仍存在但已不属于队列。</text>
<text class="idx" x="222" y="396">index 0</text>
<rect class="empty" x="152" y="402" width="140" height="30" rx="4"/><text class="out" x="222" y="422">队列区间外</text>
<text class="idx" x="382" y="396">index 1</text>
<rect class="empty" x="312" y="402" width="140" height="30" rx="4"/><text class="out" x="382" y="422">队列区间外</text>
<line class="bound" x1="462" y1="398" x2="462" y2="436"/><text class="small" x="470" y="422">length = 2</text>
<path class="ptrline" d="M462 458 L462 436"/><text class="ptr" x="470" y="456">head = 2</text>
</svg>
