<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408">
<defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #24344d; }
    .head { font-size: 17px; font-weight: 700; }
    .small { font-size: 13px; fill: #526681; }
    .end { font-size: 13px; fill: #526681; text-anchor: middle; }
    .mono { font-family: "Noto Sans Mono CJK SC", monospace; font-size: 16px; text-anchor: middle; }
    .idx { font-family: "Noto Sans Mono CJK SC", monospace; font-size: 14px; fill: #526681; text-anchor: middle; }
    .panel { fill: #fff; stroke: #d5dfeb; stroke-width: 2; }
    .token { fill: #edf4fb; stroke: #91a8c4; stroke-width: 1.5; }
    .top { fill: #f0eafb; stroke: #9a77d1; stroke-width: 2; }
    .char-cell { fill: #fff; stroke: #d5dfeb; stroke-width: 1.2; }
    .bracket-cell { fill: #f6f8fb; stroke: #91a8c4; stroke-width: 1.5; }
    .space-cell { fill: #f6f6f6; stroke: #c7ced8; stroke-width: 1.2; stroke-dasharray: 3 2; }
    .base { stroke: #7187a8; stroke-width: 3; }
  </style>
</defs>
<rect width="720" height="408" fill="#fbfcfe"/>
<rect class="panel" x="24" y="16" width="672" height="90" rx="12"/>
<text class="small" x="42" y="39">字符下标（下标 4 是空格）</text>
<text class="idx" x="66" y="64">0</text>
<rect class="char-cell" x="46" y="70" width="40" height="28" rx="4"/><text class="mono" x="66" y="90">f</text>
<text class="idx" x="122" y="64">1</text>
<rect class="bracket-cell" x="102" y="70" width="40" height="28" rx="4"/><text class="mono" x="122" y="90">(</text>
<text class="idx" x="178" y="64">2</text>
<rect class="char-cell" x="158" y="70" width="40" height="28" rx="4"/><text class="mono" x="178" y="90">a</text>
<text class="idx" x="234" y="64">3</text>
<rect class="char-cell" x="214" y="70" width="40" height="28" rx="4"/><text class="mono" x="234" y="90">,</text>
<text class="idx" x="290" y="64">4</text>
<rect class="space-cell" x="270" y="70" width="40" height="28" rx="4"/><text class="end" x="290" y="89">空格</text>
<text class="idx" x="346" y="64">5</text>
<rect class="char-cell" x="326" y="70" width="40" height="28" rx="4"/><text class="mono" x="346" y="90">g</text>
<text class="idx" x="402" y="64">6</text>
<rect class="bracket-cell" x="382" y="70" width="40" height="28" rx="4"/><text class="mono" x="402" y="90">(</text>
<text class="idx" x="458" y="64">7</text>
<rect class="char-cell" x="438" y="70" width="40" height="28" rx="4"/><text class="mono" x="458" y="90">b</text>
<text class="idx" x="514" y="64">8</text>
<rect class="bracket-cell" x="494" y="70" width="40" height="28" rx="4"/><text class="mono" x="514" y="90">)</text>
<text class="idx" x="570" y="64">9</text>
<rect class="bracket-cell" x="550" y="70" width="40" height="28" rx="4"/><text class="mono" x="570" y="90">)</text>
<rect class="panel" x="24" y="118" width="672" height="62" rx="12"/>
<text class="head" x="42" y="144">读到下标 1 的 “(”：push 外层 f(</text>
<text class="small" x="42" y="166">它要等 f 的参数部分解析完成。</text>
<text class="end" x="410" y="154">栈底</text><line class="base" x1="434" y1="132" x2="434" y2="166"/>
<rect class="token" x="442" y="132" width="70" height="34" rx="6"/><text class="mono" x="477" y="155">f(</text>
<text class="small" x="522" y="154">← 栈顶</text>
<rect class="panel" x="24" y="190" width="672" height="62" rx="12"/>
<text class="head" x="42" y="216">读到下标 6 的 “(”：push 内层 g(</text>
<text class="small" x="42" y="238">最近未完成的括号位于栈顶。</text>
<text class="end" x="410" y="226">栈底</text><line class="base" x1="434" y1="204" x2="434" y2="238"/>
<rect class="token" x="442" y="204" width="70" height="34" rx="6"/><text class="mono" x="477" y="227">f(</text>
<rect class="top" x="520" y="204" width="70" height="34" rx="6"/><text class="mono" x="555" y="227">g(</text>
<text class="small" x="600" y="226">← 栈顶</text>
<rect class="panel" x="24" y="262" width="672" height="62" rx="12"/>
<text class="head" x="42" y="288">下标 8 的 “)”：pop 栈顶 g(</text>
<text class="small" x="42" y="310">得到一对 [6, 8]；外层 f( 仍待关闭。</text>
<text class="end" x="410" y="298">栈底</text><line class="base" x1="434" y1="276" x2="434" y2="310"/>
<rect class="token" x="442" y="276" width="70" height="34" rx="6"/><text class="mono" x="477" y="299">f(</text>
<text class="small" x="522" y="298">← 栈顶</text>
<rect class="panel" x="24" y="334" width="672" height="62" rx="12"/>
<text class="head" x="42" y="360">下标 9 的 “)”：pop 外层 f(</text>
<text class="small" x="42" y="382">得到一对 [1, 9]；栈变空，匹配成功。</text>
<text class="end" x="410" y="370">栈底</text><line class="base" x1="434" y1="348" x2="434" y2="382"/>
<text class="small" x="446" y="370">空栈</text>
</svg>
