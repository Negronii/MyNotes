<svg xmlns="http://www.w3.org/2000/svg" width="700" height="630" viewBox="0 90 700 630">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .rowtitle { font-size: 19px; font-weight: 700; }
      .body { font-size: 18px; }
      .note { font-size: 18px; fill: #334155; }
      .box { stroke: #526276; stroke-width: 2; rx: 12; }
      .arrow { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="700" height="720" fill="#ffffff"/>

  <text class="rowtitle" x="36" y="116">JSON + scope=function</text>
  <rect class="box" x="36" y="130" width="140" height="82" fill="#f2f7ff"/>
  <text class="body" x="106" y="162" text-anchor="middle">
    <tspan x="106">打开</tspan><tspan x="106" dy="24">Store</tspan>
  </text>
  <line class="arrow" x1="178" y1="171" x2="195" y2="171"/>
  <rect class="box" x="200" y="130" width="140" height="82" fill="#f2f7ff"/>
  <text class="body" x="270" y="162" text-anchor="middle">
    <tspan x="270">路由读取</tspan><tspan x="270" dy="24">最后一行</tspan>
  </text>
  <line class="arrow" x1="342" y1="171" x2="359" y2="171"/>
  <rect class="box" x="364" y="130" width="140" height="82" fill="#e3f0ff"/>
  <text class="body" x="434" y="162" text-anchor="middle">
    <tspan x="434">function scope</tspan><tspan x="434" dy="24">先关闭资源</tspan>
  </text>
  <line class="arrow" x1="506" y1="171" x2="523" y2="171"/>
  <rect class="box" x="528" y="130" width="140" height="82" fill="#f2f7ff"/>
  <text class="body" x="598" y="162" text-anchor="middle">
    <tspan x="598">发送</tspan><tspan x="598" dy="24">JSON 响应</tspan>
  </text>

  <text class="rowtitle" x="36" y="266">JSON + 默认 request scope</text>
  <rect class="box" x="36" y="280" width="140" height="82" fill="#f7f7fb"/>
  <text class="body" x="106" y="312" text-anchor="middle">
    <tspan x="106">打开</tspan><tspan x="106" dy="24">Store</tspan>
  </text>
  <line class="arrow" x1="178" y1="321" x2="195" y2="321"/>
  <rect class="box" x="200" y="280" width="140" height="82" fill="#f7f7fb"/>
  <text class="body" x="270" y="312" text-anchor="middle">
    <tspan x="270">路由读取</tspan><tspan x="270" dy="24">并返回</tspan>
  </text>
  <line class="arrow" x1="342" y1="321" x2="359" y2="321"/>
  <rect class="box" x="364" y="280" width="140" height="82" fill="#f7f7fb"/>
  <text class="body" x="434" y="312" text-anchor="middle">
    <tspan x="434">发送完整</tspan><tspan x="434" dy="24">响应正文</tspan>
  </text>
  <line class="arrow" x1="506" y1="321" x2="523" y2="321"/>
  <rect class="box" x="528" y="280" width="140" height="82" fill="#e9e6f8"/>
  <text class="body" x="598" y="312" text-anchor="middle">
    <tspan x="598">request scope</tspan><tspan x="598" dy="24">后关闭资源</tspan>
  </text>

  <text class="rowtitle" x="36" y="416">StreamingResponse + 默认 request scope</text>
  <rect class="box" x="36" y="430" width="140" height="82" fill="#f7f7fb"/>
  <text class="body" x="106" y="462" text-anchor="middle">
    <tspan x="106">打开</tspan><tspan x="106" dy="24">Store</tspan>
  </text>
  <line class="arrow" x1="178" y1="471" x2="195" y2="471"/>
  <rect class="box" x="200" y="430" width="140" height="82" fill="#f7f7fb"/>
  <text class="body" x="270" y="462" text-anchor="middle">
    <tspan x="270">路由返回</tspan><tspan x="270" dy="24">流响应对象</tspan>
  </text>
  <line class="arrow" x1="342" y1="471" x2="359" y2="471"/>
  <rect class="box" x="364" y="430" width="140" height="82" fill="#e9e6f8"/>
  <text class="body" x="434" y="462" text-anchor="middle">
    <tspan x="434">迭代生成器</tspan><tspan x="434" dy="24">读取 Store</tspan>
  </text>
  <line class="arrow" x1="506" y1="471" x2="523" y2="471"/>
  <rect class="box" x="528" y="430" width="140" height="82" fill="#e9e6f8"/>
  <text class="body" x="598" y="462" text-anchor="middle">
    <tspan x="598">应用发完正文</tspan><tspan x="598" dy="24">关闭资源</tspan>
  </text>

  <rect x="32" y="548" width="636" height="136" rx="14" fill="#fff7ed" stroke="#e7bd91" stroke-width="2"/>
  <text class="note" x="50" y="581">
    <tspan x="50">function scope 在流响应开始前关闭 Store，正文读取会失败。</tspan>
    <tspan x="50" dy="30">request scope 等到应用发完正文；客户端收齐由网络层决定。</tspan>
    <tspan x="50" dy="30">正文成功结束、中止或异常时，都应由依赖清理资源。</tspan>
  </text>
</svg>
