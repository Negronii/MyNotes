<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Node.js 工作线程之间的 JavaScript 堆与数据传递</title>
  <desc id="desc">主线程和 worker_threads 各有自己的 JavaScript isolate 与普通堆，但在同一操作系统进程内。消息默认复制；ArrayBuffer 可转移所有权；SharedArrayBuffer 可由双方访问并需同步。libuv 线程池与应用工作线程是不同机制。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#58769a"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#32927e"/>
    </marker>
    <marker id="arrow-both" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#32927e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #20354e; }
      .head { font-size: 23px; font-weight: 650; }
      .body { font-size: 19px; }
      .small { font-size: 17px; }
      .arrow { stroke: #58769a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowGreen { stroke: #32927e; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .double { stroke: #32927e; stroke-width: 3; fill: none; marker-start: url(#arrow-both); marker-end: url(#arrow-both); }
      .dashed { stroke: #8ba0b6; stroke-width: 2; stroke-dasharray: 6 7; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="650" fill="#f8fafc"/>

  <rect x="36" y="30" width="928" height="590" rx="18" fill="#ffffff" stroke="#7890aa" stroke-width="3"/>
  <rect x="62" y="45" width="330" height="44" rx="10" fill="#eaf0f7"/>
  <text x="78" y="75" class="head">同一 Node.js 进程</text>

  <rect x="72" y="112" width="338" height="174" rx="14" fill="#e9f2fc" stroke="#91b7e1" stroke-width="2"/>
  <text x="241" y="149" text-anchor="middle" class="head">主线程</text>
  <text x="241" y="184" text-anchor="middle" class="body">自己的 JavaScript isolate</text>
  <text x="241" y="216" text-anchor="middle" class="body">自己的普通 JavaScript 堆</text>
  <text x="241" y="257" text-anchor="middle" class="small">主事件循环执行回调</text>

  <rect x="590" y="112" width="338" height="174" rx="14" fill="#fff3e2" stroke="#e8bf78" stroke-width="2"/>
  <text x="759" y="149" text-anchor="middle" class="head">Worker 线程</text>
  <text x="759" y="184" text-anchor="middle" class="body">自己的 JavaScript isolate</text>
  <text x="759" y="216" text-anchor="middle" class="body">自己的普通 JavaScript 堆</text>
  <text x="759" y="257" text-anchor="middle" class="small">自己的事件循环执行回调</text>

  <path d="M414 158 H586" class="arrow"/>
  <rect x="423" y="122" width="154" height="30" rx="7" fill="#ffffff"/>
  <text x="500" y="143" text-anchor="middle" class="small">postMessage</text>
  <text x="500" y="184" text-anchor="middle" class="small">普通可克隆值</text>
  <text x="500" y="207" text-anchor="middle" class="small">复制到接收端</text>

  <path d="M414 244 H586" class="arrowGreen"/>
  <rect x="420" y="213" width="160" height="27" rx="7" fill="#ffffff"/>
  <text x="500" y="233" text-anchor="middle" class="small">transferList</text>
  <text x="500" y="265" text-anchor="middle" class="small">ArrayBuffer 移交</text>

  <path d="M241 286 V315 L350 344" class="double"/>
  <path d="M759 286 V315 L650 344" class="double"/>
  <rect x="200" y="344" width="600" height="72" rx="14" fill="#eaf6f2" stroke="#78b8a8" stroke-width="2"/>
  <text x="500" y="374" text-anchor="middle" class="head">SharedArrayBuffer</text>
  <text x="500" y="401" text-anchor="middle" class="small">共享字节区的并发读写用 Atomics 同步，或先交接所有权再访问</text>

  <path d="M105 286 V451 H190" class="dashed" marker-end="url(#arrow)"/>
  <path d="M895 286 V451 H810" class="dashed" marker-end="url(#arrow)"/>
  <rect x="190" y="438" width="620" height="94" rx="14" fill="#edf2f8" stroke="#a7b7ca" stroke-width="2"/>
  <text x="500" y="472" text-anchor="middle" class="head">libuv threadpool 是另一套机制</text>
  <text x="500" y="499" text-anchor="middle" class="small">特定 Node API 与 native addon 可提交工作</text>
  <text x="500" y="521" text-anchor="middle" class="small">同一进程的多个事件循环共享此池</text>

  <text x="500" y="569" text-anchor="middle" class="body">工作线程与主线程仍共享同一进程身份、生命周期和本机进程资源。</text>
  <text x="500" y="601" text-anchor="middle" class="small" fill="#526b89">独立 JavaScript 堆不等于独立操作系统进程。</text>
</svg>
