<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc">
  <title id="title">Node.js 子进程与 cluster 的地址空间和连接关系</title>
  <desc id="desc">child_process.fork 在父 Node 进程外启动独立子进程，通过序列化 IPC 传消息。cluster 默认轮询路径中，Primary 在共享监听端口接收每条新连接，再选择一个 worker 交付。worker 是各自拥有 JavaScript 堆与本地状态的独立进程；Windows 默认调度方式不同。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#58769a"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#32927e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; fill: #20354e; }
      .head { font-size: 24px; font-weight: 650; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .arrow { stroke: #58769a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green { stroke: #32927e; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>
  <rect width="1000" height="980" fill="#f8fafc"/>

  <rect x="38" y="30" width="924" height="282" rx="18" fill="#ffffff" stroke="#a7b7ca" stroke-width="2"/>
  <text x="70" y="73" class="head">child_process.fork()</text>
  <rect x="78" y="110" width="300" height="116" rx="14" fill="#e9f2fc" stroke="#91b7e1" stroke-width="2"/>
  <text x="228" y="151" text-anchor="middle" class="head">父 Node 进程</text>
  <text x="228" y="184" text-anchor="middle" class="small">独立地址空间与 JavaScript 堆</text>
  <rect x="622" y="110" width="300" height="116" rx="14" fill="#fff3e2" stroke="#e8bf78" stroke-width="2"/>
  <text x="772" y="151" text-anchor="middle" class="head">新 Node 子进程</text>
  <text x="772" y="184" text-anchor="middle" class="small">独立地址空间与 JavaScript 堆</text>
  <path d="M379 146 H617" class="arrow"/>
  <text x="498" y="133" text-anchor="middle" class="small">IPC 请求消息</text>
  <path d="M622 194 H384" class="green"/>
  <text x="500" y="224" text-anchor="middle" class="small">IPC 结果消息</text>
  <text x="500" y="278" text-anchor="middle" class="body">消息经序列化传递；fork() 启动新实例，不复制父进程堆。</text>

  <rect x="38" y="338" width="924" height="602" rx="18" fill="#ffffff" stroke="#a7b7ca" stroke-width="2"/>
  <text x="70" y="381" class="head">cluster 默认轮询路径（Windows 默认方式不同）</text>

  <rect x="394" y="414" width="212" height="52" rx="12" fill="#edf5f3" stroke="#91c6b8" stroke-width="2"/>
  <text x="500" y="447" text-anchor="middle" class="body">客户端 TCP 新连接</text>

  <rect x="350" y="548" width="300" height="72" rx="13" fill="#e9f2fc" stroke="#91b7e1" stroke-width="2"/>
  <text x="500" y="579" text-anchor="middle" class="head">Primary 进程</text>
  <text x="500" y="606" text-anchor="middle" class="small">监听共享端口并接纳连接</text>
  <path d="M500 466 V538" class="arrow"/>

  <path d="M500 620 V686" class="arrow"/>
  <path d="M500 694 L558 726 L500 758 L442 726 Z" fill="#f0f5fb" stroke="#91b7e1" stroke-width="2"/>
  <text x="500" y="732" text-anchor="middle" class="small">RR 选一个</text>

  <path d="M454 746 L284 806" class="arrow"/>
  <path d="M546 746 L716 806" class="arrow"/>
  <text x="500" y="789" text-anchor="middle" class="small" fill="#526b89">每条新连接只交给一路</text>

  <rect x="94" y="812" width="332" height="72" rx="13" fill="#fff3e2" stroke="#e8bf78" stroke-width="2"/>
  <text x="260" y="842" text-anchor="middle" class="head">cluster worker A</text>
  <text x="260" y="870" text-anchor="middle" class="small">独立进程 / 独立本地状态</text>
  <rect x="574" y="812" width="332" height="72" rx="13" fill="#fff3e2" stroke="#e8bf78" stroke-width="2"/>
  <text x="740" y="842" text-anchor="middle" class="head">cluster worker B</text>
  <text x="740" y="870" text-anchor="middle" class="small">独立进程 / 独立本地状态</text>

  <text x="500" y="919" text-anchor="middle" class="small" fill="#526b89">worker 共用同一监听端口；其 JavaScript 堆和会话状态不共享。</text>
</svg>
