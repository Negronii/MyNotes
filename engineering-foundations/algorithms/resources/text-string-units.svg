<svg xmlns="http://www.w3.org/2000/svg" width="700" height="370" viewBox="0 0 700 370" role="img" aria-labelledby="title desc">
<title id="title">同一文本的编码单元、码点与字素簇</title>
<desc id="desc">A、笑脸、e和组合重音共五个UTF-16编码单元，四个码点，三个扩展字素簇。笑脸的两个代理合为一个码点，e和组合重音合为一个字素簇。</desc>
<rect width="700" height="370" fill="#ffffff"/>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#25364b}.main{font-size:16px;font-weight:600}.sub{font-size:14px;fill:#526780}.glyph{font-size:28px;font-family:Arial,"Apple Color Emoji","PingFang SC",sans-serif}</style>
<text x="20" y="64" class="sub">UTF-16 code units</text><text x="20" y="89" class="main">5 个编码单元</text>
<text x="20" y="184" class="sub">Unicode code points</text><text x="20" y="209" class="main">4 个码点</text>
<text x="20" y="304" class="sub">Extended graphemes</text><text x="20" y="329" class="main">3 个扩展字素簇</text>
