<svg xmlns="http://www.w3.org/2000/svg" width="740" height="460" viewBox="0 0 740 460" role="img" aria-labelledby="desc">
  <title id="desc">插入 C 后的最大堆树形与数组层序对应</title>
  <defs>
    <marker id="heap-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#526171"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans CJK SC", sans-serif; fill: #202938; }
      .section { font-size: 19px; font-weight: 700; }
      .rule { font-size: 16px; fill: #475467; }
      .edge { stroke: #526171; stroke-width: 2.5; fill: none; marker-end: url(#heap-arrow); }
      .root { fill: #e5f0fb; stroke: #2469a5; stroke-width: 2.5; }
      .leaf { fill: #f1f3f5; stroke: #667085; stroke-width: 2; }
      .index { font-size: 15px; fill: #475467; text-anchor: middle; }
      .value { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 14px; fill: #475467; text-anchor: middle; }
      .array { fill: #ffffff; stroke: #9aa4b2; stroke-width: 1.5; }
      .cell-index { font-size: 14px; fill: #667085; text-anchor: middle; }
      .cell-value { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .footer { font-size: 15px; fill: #475467; }
    </style>
  </defs>
  <rect x="0" y="0" width="740" height="460" fill="#ffffff"/>

  <text x="30" y="32" class="section">树形视图</text>
  <text x="710" y="32" class="rule" text-anchor="end">父项优先级 ≥ 子项优先级</text>

  <path d="M330 163 L270 214" class="edge"/>
  <path d="M410 163 L470 214" class="edge"/>

  <circle cx="370" cy="125" r="50" class="root"/>
  <text x="370" y="114" class="index">i = 0</text>
  <text x="370" y="140" class="value">C(8)</text>
  <text x="370" y="160" class="sub">seq = 2</text>

  <circle cx="230" cy="250" r="50" class="leaf"/>
  <text x="230" y="239" class="index">i = 1</text>
  <text x="230" y="264" class="value">B(5)</text>
  <text x="230" y="284" class="sub">seq = 1</text>

  <circle cx="510" cy="250" r="50" class="leaf"/>
  <text x="510" y="239" class="index">i = 2</text>
  <text x="510" y="264" class="value">A(5)</text>
  <text x="510" y="284" class="sub">seq = 0</text>

  <text x="30" y="342" class="section">同一堆的数组表示（按层序）</text>
  <rect x="128" y="360" width="145" height="58" rx="5" class="array"/>
  <rect x="298" y="360" width="145" height="58" rx="5" class="array"/>
  <rect x="468" y="360" width="145" height="58" rx="5" class="array"/>
  <text x="200.5" y="382" class="cell-index">下标 0</text>
  <text x="200.5" y="406" class="cell-value">C(8)</text>
  <text x="370.5" y="382" class="cell-index">下标 1</text>
  <text x="370.5" y="406" class="cell-value">B(5)</text>
  <text x="540.5" y="382" class="cell-index">下标 2</text>
  <text x="540.5" y="406" class="cell-value">A(5)</text>
  <text x="30" y="445" class="footer">同级节点不保证按 priority 排序；相同 priority 的取出先后由 seq 裁决。</text>
</svg>
