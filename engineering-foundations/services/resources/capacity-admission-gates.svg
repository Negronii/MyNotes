<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1184" viewBox="0 0 1100 1184" role="img" aria-labelledby="title desc">
  <title id="title">导出管线上的几道容量门槛</title>
  <desc id="desc">新导出请求经 HTTP 入口进入受理事务。受理事务锁住共享额度行，令牌桶 r 为每秒 7 个、b 为 30，不足时回滚并返回 429；等待槽 240 个，满时回滚并返回 503；这两种拒绝都在 202 之前，不留 job。提交 job 与 outbox 后返回 202。outbox 到 broker 是同一排队轮次，不额外占槽。worker 进程有 4×2×8=64 个物理执行槽，没有空槽时不领取。结果写入对象存储，每份 128 KiB，保留 7 天约 369 GiB。受理事务和 worker 都借用数据库连接，应用上限 200，数据库预算 240。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#60738e"/></marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#243247;dominant-baseline:middle}
      .h{font-size:26px;font-weight:600}
      .m{font-size:24px;font-weight:600}
      .s{font-size:20px}
      .gt{font-size:21px;font-weight:600}
      .ct{font-size:21px;font-weight:600}
      .n{font-size:19px}
      .lab{font-size:19px;fill:#34734a}
      .lab2{font-size:19px;fill:#6b5a1e}
      .bt{font-size:20px;font-weight:600;fill:#a54838}
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
      .main{fill:#eef5fe;stroke:#8fb0d9}
      .db{fill:#fffbeb;stroke:#d6b85a}
      .gate{fill:#ffffff;stroke:#a54838;stroke-width:2.5}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .bound{fill:#fff8f6;stroke:#d08070;stroke-width:2;stroke-dasharray:10 7}
      .edge{fill:none;stroke:#60738e;stroke-width:3;marker-end:url(#arrow)}
      .thin{stroke:#94a3b8;stroke-width:2}
      .db.edge{stroke:#b08a1e;stroke-dasharray:8 6}
      .dbline{fill:none;stroke:#b08a1e;stroke-width:3;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1100" height="1184" fill="#ffffff"/>
  <text x="74" y="44" class="h">每道门槛计数不同的东西，任何一道都可能最先到顶</text>
  <rect x="74" y="74" width="542" height="448" rx="16" class="bound"/>
  <text x="90" y="102" class="bt" text-anchor="start">202 之前拒绝：回滚后不留 job</text>
  <rect x="110" y="122" width="470" height="84" rx="12" class="box"/>
  <text x="345.0" y="154" class="m" text-anchor="middle">HTTP 入口</text>
  <text x="345.0" y="184" class="s" text-anchor="middle">新导出请求，正文 8 KiB</text>
  <rect x="620" y="108" width="450" height="112" rx="10" class="card"/>
  <text x="636" y="138" class="ct" text-anchor="start">入口字节</text>
  <text x="636" y="170" class="n" text-anchor="start">峰值 20 个每秒 × 8 KiB = 160 KiB/s</text>
  <text x="636" y="199" class="n" text-anchor="start">读完正文才拒绝的请求也计入</text>
  <path d="M580 164 H618" class="edge thin"/>
  <path d="M345.0 206 V250" class="edge"/>
  <rect x="110" y="252" width="470" height="250" rx="12" class="box main"/>
  <text x="345.0" y="284" class="m" text-anchor="middle">受理事务</text>
  <text x="345.0" y="314" class="s" text-anchor="middle">锁住整条管线共用的额度行</text>
  <rect x="134" y="338" width="422" height="64" rx="12" class="gate"/>
  <text x="345.0" y="362" class="gt" text-anchor="middle">令牌桶：r = 7 个每秒，b = 30</text>
  <text x="345.0" y="388" class="s" text-anchor="middle">令牌不足 → 回滚，429</text>
  <rect x="134" y="418" width="422" height="64" rx="12" class="gate"/>
  <text x="345.0" y="442" class="gt" text-anchor="middle">等待槽：240 个</text>
  <text x="345.0" y="468" class="s" text-anchor="middle">已满 → 回滚，503</text>
  <rect x="620" y="330" width="450" height="80" rx="10" class="card"/>
  <text x="636" y="360" class="n" text-anchor="start">计数：新逻辑 job 进入的速度</text>
  <text x="636" y="389" class="n" text-anchor="start">补充：每秒 7 枚，最多存 30 枚</text>
  <path d="M556 370 H618" class="edge thin"/>
  <rect x="620" y="420" width="450" height="110" rx="10" class="card"/>
  <text x="636" y="450" class="n" text-anchor="start">计数：已承诺、尚未领取的排队轮次</text>
  <text x="636" y="479" class="n" text-anchor="start">占用：受理时；重排时重新占</text>
  <text x="636" y="508" class="n" text-anchor="start">归还：领取提交时；queued 被取消时</text>
  <path d="M556 450 H618" class="edge thin"/>
  <path d="M345.0 502 V570" class="edge"/>
  <text x="359.0" y="546" class="lab" text-anchor="start">job + outbox 同事务提交 → 202</text>
  <rect x="110" y="572" width="470" height="84" rx="12" class="box"/>
  <text x="345.0" y="604" class="m" text-anchor="middle">outbox → broker</text>
  <text x="345.0" y="634" class="s" text-anchor="middle">同一排队轮次，不额外占槽</text>
  <rect x="620" y="572" width="450" height="84" rx="10" class="card"/>
  <text x="636" y="602" class="n" text-anchor="start">broker 很浅不说明空闲：未发布的</text>
  <text x="636" y="631" class="n" text-anchor="start">outbox 里的 queued job 同样占槽</text>
  <path d="M580 614 H618" class="edge thin"/>
  <path d="M345.0 656 V700" class="edge"/>
  <rect x="110" y="702" width="470" height="150" rx="12" class="box main"/>
  <text x="345.0" y="734" class="m" text-anchor="middle">worker 进程</text>
  <rect x="134" y="758" width="422" height="74" rx="12" class="gate"/>
  <text x="345.0" y="784" class="gt" text-anchor="middle">物理执行槽：4 × 2 × 8 = 64</text>
  <text x="345.0" y="812" class="s" text-anchor="middle">没有空槽 → 不领取，只推迟</text>
  <rect x="620" y="710" width="450" height="134" rx="10" class="card"/>
  <text x="636" y="740" class="n" text-anchor="start">计数：同时运行的 attempt</text>
  <text x="636" y="769" class="n" text-anchor="start">（CPU、连接、游标、上传句柄）</text>
  <text x="636" y="798" class="n" text-anchor="start">检查：进程内，条件领取之前</text>
  <text x="636" y="827" class="n" text-anchor="start">归还：attempt 停止并释放资源</text>
  <path d="M556 795 H618" class="edge thin"/>
  <path d="M345.0 852 V896" class="edge"/>
  <rect x="110" y="898" width="470" height="84" rx="12" class="box"/>
  <text x="345.0" y="930" class="m" text-anchor="middle">对象存储</text>
  <text x="345.0" y="960" class="s" text-anchor="middle">每份结果 128 KiB，保留 7 天</text>
  <rect x="620" y="898" width="450" height="84" rx="10" class="card"/>
  <text x="636" y="928" class="n" text-anchor="start">每秒 5 个成功、保留 7 天</text>
  <text x="636" y="957" class="n" text-anchor="start">≈ 369 GiB（不含副本与索引）</text>
  <path d="M580 940 H618" class="edge thin"/>
  <rect x="110" y="1038" width="470" height="96" rx="12" class="box db"/>
  <text x="345.0" y="1070" class="m" text-anchor="middle">数据库连接</text>
  <text x="345.0" y="1102" class="s" text-anchor="middle">应用上限 200 ／ 数据库预算 240</text>
  <rect x="620" y="1019" width="450" height="134" rx="10" class="card"/>
  <text x="636" y="1049" class="n" text-anchor="start">API 4 × 2 × 10 = 80，worker 同为 80，</text>
  <text x="636" y="1078" class="n" text-anchor="start">其他服务预留 40</text>
  <text x="636" y="1107" class="n" text-anchor="start">检查：每次借用连接时</text>
  <text x="636" y="1136" class="n" text-anchor="start">归还：每次借用结束</text>
  <path d="M580 1086 H618" class="edge thin"/>
  <path d="M110 308 H50 V1086 H108" class="edge db"/>
  <path d="M110 732 H50" class="dbline"/>
  <text x="74" y="969" class="lab2" text-anchor="middle" transform="rotate(-90 74 969)">借用连接</text>
</svg>
