<svg xmlns="http://www.w3.org/2000/svg" width="700" height="676" viewBox="0 0 700 676" role="img" aria-labelledby="title desc">
  <title id="title">一次改动依次停在哪几层</title>
  <desc id="desc">改动自上而下经过工作区、暂存区、提交与分支、远端四层：git add 复制执行那一刻的文件内容进暂存区，git commit 把暂存区写成提交并移动分支，git push 把分支引用共享到远端。右侧两个括号标出比较命令的范围：git diff 比较工作区与暂存区，即还没暂存的改动；git diff --cached 比较暂存区与 HEAD，即这次会提交的改动。</desc>
  <defs>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .title { font-size: 20px; font-weight: 700; }
      .body { font-size: 18px; }
      .cmd { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; }
      .wt { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .ix { fill: #f5f3ff; stroke: #7e22ce; stroke-width: 2; }
      .cm { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .rm { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .bracket { fill: none; stroke: #b45309; stroke-width: 3; }
      .diff { fill: #92400e; }
    </style>
  </defs>
  <rect width="700" height="676" fill="#fff"/>

  <rect x="20" y="20" width="410" height="96" rx="12" class="wt"/>
  <text x="38" y="54" class="title">工作区 working tree</text>
  <text x="38" y="90" class="body">磁盘上正在编辑的文件；测试通常读这里</text>

  <path d="M70 118 V182" class="arrow"/>
  <text x="90" y="157" class="body"><tspan class="cmd">git add</tspan>：复制执行那一刻的内容</text>

  <rect x="20" y="186" width="410" height="96" rx="12" class="ix"/>
  <text x="38" y="220" class="title">暂存区 index</text>
  <text x="38" y="256" class="body">下一次提交的快照；之后再编辑不会跟着变</text>

  <path d="M70 284 V348" class="arrow"/>
  <text x="90" y="323" class="body"><tspan class="cmd">git commit</tspan>：写成提交并移动分支</text>

  <rect x="20" y="352" width="410" height="124" rx="12" class="cm"/>
  <text x="38" y="386" class="title">提交与分支 commit / branch</text>
  <text x="38" y="421" class="body">提交：完整目录快照（tree）＋父提交</text>
  <text x="38" y="454" class="body">分支：指向提交的可移动引用；HEAD 指向它</text>

  <path d="M70 478 V542" class="arrow"/>
  <text x="90" y="517" class="body"><tspan class="cmd">git push</tspan>：把分支引用共享到远端</text>

  <rect x="20" y="546" width="410" height="96" rx="12" class="rm"/>
  <text x="38" y="580" class="title">远端 origin</text>
  <text x="38" y="616" class="body">别人可见，可能已基于这些提交继续工作</text>

  <path d="M448 68 H464 V230 H448" class="bracket"/>
  <text x="482" y="124" class="cmd diff">git diff</text>
  <text x="482" y="156" class="body">工作区对暂存区：</text>
  <text x="482" y="184" class="body">还没暂存的改动</text>

  <path d="M448 242 H464 V410 H448" class="bracket"/>
  <text x="482" y="300" class="cmd diff">git diff --cached</text>
  <text x="482" y="332" class="body">暂存区对 HEAD：</text>
  <text x="482" y="360" class="body">这次会提交的改动</text>
</svg>
