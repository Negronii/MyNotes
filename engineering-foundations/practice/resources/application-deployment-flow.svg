<svg xmlns="http://www.w3.org/2000/svg" width="700" height="944" viewBox="0 0 700 944" role="img" aria-labelledby="title desc">
<title id="title">从固定源码提交到生产首轮流量</title>
<desc id="desc">CI 检出并检查固定提交、构建一次并记录镜像摘要；预发布用同一摘要运行 API 与 worker 验收。验收和生产环境门禁通过后部署系统才启动生产实例。实例就绪后，受控生产入口把两种专用身份定向到新摘要做冒烟检查。两种身份都命中新摘要且结果正确、交给旧版的受影响路由已隔离后，流量入口才向它开放首轮小流量。任一门禁、就绪或冒烟检查失败时不切流，并定位业务错误或补齐证据。</desc>
<defs>
  <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#36546f"/></marker>
  <style>
    text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #18324b; }
    .title { font-size: 19px; font-weight: 700; }
    .body { font-size: 16px; }
    .small { font-size: 14px; }
    .box { fill: #f4f8fb; stroke: #557c9a; stroke-width: 1.6; }
    .check { fill: #edf5f1; stroke: #4d806c; stroke-width: 1.6; }
    .decision { fill: #fff8e9; stroke: #a77920; stroke-width: 1.6; }
    .stop { fill: #fbefed; stroke: #a44b40; stroke-width: 1.6; }
    .line { fill: none; stroke: #36546f; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #36546f; stroke-width: 2; }
  </style>
</defs>
<rect x="1" y="1" width="698" height="942" rx="14" fill="#fff" stroke="#d4e0e8"/>

<rect x="84" y="40" width="532" height="62" rx="11" class="box"/>
<text x="350" y="66" text-anchor="middle" class="body">CI：检出干净的 commit c4f2a91，运行门禁</text>
<text x="350" y="89" text-anchor="middle" class="small">构建一次，推送并保存摘要、检查结果与来源记录</text>
<path d="M350 102 V138" class="line"/>

<rect x="84" y="140" width="532" height="62" rx="11" class="check"/>
<text x="350" y="166" text-anchor="middle" class="body">预发布负责人：以同一摘要启动 API 与 worker</text>
<text x="350" y="189" text-anchor="middle" class="small">经已装配入口验证 user-17 / user-29，并检查任务路径</text>
<path d="M350 202 V238" class="line"/>

<polygon points="350,240 470,286 350,332 230,286" class="decision"/>
<text x="350" y="281" text-anchor="middle" class="body">预发布通过且</text>
<text x="350" y="303" text-anchor="middle" class="body">生产门禁获批？</text>

<path d="M230 286 H166 V368" class="line"/>
<text x="192" y="276" class="small">否</text>
<rect x="26" y="370" width="280" height="72" rx="10" class="stop"/>
<text x="166" y="400" text-anchor="middle" class="body">拒绝或失败：停止晋级</text>
<text x="166" y="424" text-anchor="middle" class="small">生产流量继续留在当前版本</text>

<path d="M350 332 V350 H520 V368" class="line"/>
<text x="530" y="364" class="small">是</text>
<rect x="366" y="370" width="308" height="72" rx="10" class="box"/>
<text x="520" y="400" text-anchor="middle" class="body">部署系统：启动获批摘要</text>
<text x="520" y="424" text-anchor="middle" class="small">使用记录过的运行配置与密钥引用</text>
<path d="M520 442 V476" class="line"/>

<polygon points="520,478 620,518 520,558 420,518" class="decision"/>
<text x="520" y="524" text-anchor="middle" class="body">实例就绪？</text>

<path d="M420 518 H166 V598" class="line"/>
<text x="340" y="508" class="small">否</text>
<rect x="26" y="600" width="280" height="72" rx="10" class="stop"/>
<text x="166" y="641" text-anchor="middle" class="body">不切流；保留当前版本并诊断</text>

<path d="M520 558 V598" class="line"/>
<text x="532" y="584" class="small">是</text>
<rect x="350" y="600" width="324" height="72" rx="10" class="check"/>
<text x="512" y="630" text-anchor="middle" class="body">生产入口：定向检查本轮新摘要</text>
<text x="512" y="654" text-anchor="middle" class="small">user-17 200；user-29 404；追踪核摘要</text>

<path d="M512 672 V706" class="line"/>
<polygon points="512,708 642,758 512,808 382,758" class="decision"/>
<text x="512" y="753" text-anchor="middle" class="body">两身份都命中新</text>
<text x="512" y="775" text-anchor="middle" class="body">摘要且结果正确？</text>

<path d="M382 758 H166 V848" class="line"/>
<text x="340" y="748" class="small">否</text>
<rect x="26" y="850" width="280" height="72" rx="10" class="stop"/>
<text x="166" y="891" text-anchor="middle" class="body">不切流，定位错误或补齐证据</text>

<path d="M512 808 V848" class="line"/>
<text x="524" y="834" class="small">是</text>
<rect x="350" y="850" width="324" height="72" rx="10" class="check"/>
<text x="512" y="880" text-anchor="middle" class="body">流量入口：开放首轮小流量</text>
<text x="512" y="904" text-anchor="middle" class="small">前提：交给 d-old 的受影响路由已隔离</text>
</svg>
