<text x="478.0" y="246" text-anchor="end">due 12:00:00 落在右闭端：进分母</text>
<text x="590.0" y="226">成功确认 12:00:01</text>
<text x="590.0" y="246" class="bad">用时 121 s：坏</text>
<rect x="550.0" y="300" width="80.0" height="22" rx="4" class="bar"/>
<circle cx="550.0" cy="311" r="5" fill="#334155"/>
<line x1="630.0" y1="292" x2="630.0" y2="330" class="due"/>
<text x="538.0" y="306" text-anchor="end">受理确认 11:59:30，在窗口内受理，</text>
<text x="538.0" y="326" text-anchor="end">但 due 12:01:30 在窗口外：不进本窗口分母</text>
<text x="650.0" y="306">尚未观察到</text>
<text x="650.0" y="326">成功确认</text>
<rect x="20" y="388" width="22" height="14" rx="3" class="bar"/>
<text x="48.0" y="400">受理确认 → due</text>
<line x1="186" y1="386" x2="186" y2="404" class="due"/>
<text x="196.0" y="400">due</text>
<circle cx="250" cy="395" r="6" fill="#b91c1c"/>
<text x="262.0" y="400">成功确认：晚于 due 即坏（图中把 1 s 的差放大画出）</text>
<text x="20.0" y="436">发布条件：事件完整水位越过 T = 12:00，且到期 job 已逐一与数据库核对，才发布本窗口结果。</text>
</svg>
