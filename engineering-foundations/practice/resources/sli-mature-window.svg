<svg xmlns="http://www.w3.org/2000/svg" width="820" height="458" viewBox="0 0 820 458" role="img" aria-labelledby="title desc">
  <title id="title">12:00 结束的十分钟窗口，哪些任务已经成熟</title>
  <desc id="desc">窗口 (11:50, 12:00] 左开右闭，只收期限 due 落在窗口内的任务，时间均为提交确认时刻。任务 1：11:57:00 受理确认，due 11:59:00 在窗口内，11:59:01 才观察到成功确认，用时 121 秒，计坏。任务 2：11:58:00 受理确认，due 12:00:00 恰在右闭端，进分母，12:00:01 成功确认，计坏。任务 3：11:59:30 受理确认，虽在窗口内受理，但 due 12:01:30 在窗口外，不进本窗口分母。只有事件完整水位越过 12:00 且到期 job 已逐一与数据库核对，才发布本窗口结果。</desc>
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #172033; font-size: 15px; }
    .hd { font-size: 16px; font-weight: 700; }
    .tick { font-size: 13px; fill: #475569; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
    .bad { fill: #b91c1c; font-weight: 700; }
    .faint { fill: #475569; }
    .win { fill: #dbeafe; opacity: 0.55; }
    .bar { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .due { stroke: #b45309; stroke-width: 3; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <rect width="820" height="458" fill="#fff"/>
<text x="20.0" y="30" class="hd">窗口 (T−W, T] = (11:50, 12:00]：只收 11:50 &lt; due ≤ 12:00 的任务，due = 受理确认 + 2 分钟</text>
