<text x="180.0" y="100" class="faint">左端开：不含 11:50</text>
<text x="560.0" y="100" class="faint" text-anchor="end">右端闭：含 12:00</text>
<rect x="450.0" y="140" width="80.0" height="22" rx="4" class="bar"/>
<circle cx="450.0" cy="151" r="5" fill="#334155"/>
<line x1="530.0" y1="132" x2="530.0" y2="170" class="due"/>
