<text x="330.0" y="68" class="tick" text-anchor="middle">11:54</text>
<line x1="370.0" y1="78" x2="370.0" y2="368" class="grid"/>
<text x="370.0" y="68" class="tick" text-anchor="middle">11:55</text>
<line x1="410.0" y1="78" x2="410.0" y2="368" class="grid"/>
<text x="410.0" y="68" class="tick" text-anchor="middle">11:56</text>
<line x1="450.0" y1="78" x2="450.0" y2="368" class="grid"/>
<text x="450.0" y="68" class="tick" text-anchor="middle">11:57</text>
<line x1="490.0" y1="78" x2="490.0" y2="368" class="grid"/>
<text x="490.0" y="68" class="tick" text-anchor="middle">11:58</text>
<line x1="530.0" y1="78" x2="530.0" y2="368" class="grid"/>
<text x="530.0" y="68" class="tick" text-anchor="middle">11:59</text>
<line x1="570.0" y1="78" x2="570.0" y2="368" class="grid"/>
<text x="570.0" y="68" class="tick" text-anchor="middle">12:00</text>
